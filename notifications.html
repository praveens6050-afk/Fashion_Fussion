<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | Fashion_Fussion</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#f1f3f6;color:#222}.top{background:#2874f0;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;margin-left:12px}.wrap{max-width:900px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:18px;margin-bottom:12px}.muted{color:#777;font-size:13px}.pill{display:inline-block;background:#e3f2fd;color:#1565c0;padding:4px 8px;border-radius:10px;font-size:11px;font-weight:700}.empty{background:#fff;padding:30px;border-radius:8px;text-align:center}</style></head><body><div class="top"><b>Fashion_Fussion — Notifications</b><div><a href="index.html">Store</a><a href="account.html">My Account</a></div></div><main class="wrap"><h1>Notifications</h1><div id="list"><div class="empty">Loading updates...</div></div></main><script>(async()=>{const list=document.getElementById('list');const{data:{user}}=await window.supabaseClient.auth.getUser();if(!user){location.href='login.html';return}const[{data:orders,error:oe},{data:reqs,error:re}]=await Promise.all([window.supabaseClient.from('orders').select('id,display_order_id,fulfillment_status,fulfillment_updated_at,created_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(20),window.supabaseClient.from('customer_support_requests').select('id,status,issue,updated_at,created_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(20)]);if(oe||re){list.innerHTML='<div class="empty">Unable to load updates.</div>';return}const items=[];(orders||[]).forEach(o=>items.push({t:o.fulfillment_updated_at||o.created_at,title:'Order '+(o.display_order_id||('#'+o.id)),text:'Order status: '+String(o.fulfillment_status||'ordered').replaceAll('_',' '),href:'order-details.html?id='+o.id,type:'Order'}));(reqs||[]).forEach(r=>items.push({t:r.updated_at||r.created_at,title:'Support request #'+r.id,text:'Status: '+r.status+' — '+(r.issue||''),href:'index.html',type:'Support'}));items.sort((a,b)=>new Date(b.t)-new Date(a.t));list.innerHTML=items.length?items.map(x=>'<a href="'+x.href+'" style="text-decoration:none;color:inherit"><div class="card"><span class="pill">'+x.type+'</span><h3>'+x.title+'</h3><div>'+x.text+'</div><div class="muted">'+new Date(x.t).toLocaleString()+'</div></div></a>').join(''):'<div class="empty">No updates yet.</div>';})();</script></body></html>
