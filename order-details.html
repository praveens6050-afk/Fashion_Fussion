<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Details | Fashion_Fussion</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f1f3f6;font-family:Arial,sans-serif;color:#212121}.top{background:#fff;border-bottom:1px solid #ddd;padding:15px}.topin,.wrap{max-width:1150px;margin:auto}.topin{display:flex;justify-content:space-between}.logo{font-size:21px;font-weight:800;color:#1b2a4a}a{color:#2874f0;text-decoration:none}.wrap{padding:18px}.card{background:#fff;border:1px solid #ddd;margin-bottom:14px;border-radius:6px}.head{padding:15px 18px;border-bottom:1px solid #eee;font-weight:700}.orderid{font-size:13px;color:#777;margin-top:5px}.product{display:grid;grid-template-columns:120px 1fr;gap:18px;padding:20px;border-bottom:1px solid #eee}.product img,.fallback{width:110px;height:110px;object-fit:contain;border:1px solid #eee;background:#fafafa}.fallback{display:grid;place-items:center;text-align:center;color:#888;font-size:11px}.pname{font-size:17px;font-weight:700}.muted{color:#777;font-size:13px;margin-top:7px}.timeline{padding:25px 20px 30px;display:flex;justify-content:space-between;position:relative}.timeline:before{content:"";height:4px;background:#ddd;position:absolute;left:8%;right:8%;top:34px}.step{position:relative;z-index:1;text-align:center;width:20%;font-size:12px;color:#777}.dot{width:20px;height:20px;border-radius:50%;background:#ddd;margin:0 auto 9px;border:4px solid #fff}.step.done .dot{background:#26a541}.step.done{color:#212121;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr}.pane{padding:18px}.pane:first-child{border-right:1px solid #eee}.row{display:flex;justify-content:space-between;gap:12px;margin:11px 0;font-size:14px}.total{border-top:1px solid #ddd;padding-top:13px;font-size:17px;font-weight:800}.green{color:#138a36}.red{color:#c62828}.empty{text-align:center;padding:50px;color:#777}@media(max-width:650px){.product{grid-template-columns:85px 1fr}.product img,.fallback{width:80px;height:80px}.timeline{min-width:600px}.card.track{overflow:auto}.grid{grid-template-columns:1fr}.pane:first-child{border-right:0;border-bottom:1px solid #eee}}</style></head><body><header class="top"><div class="topin"><div class="logo">Fashion_Fussion</div><a href="account.html#orders">My Orders</a></div></header><main id="root" class="wrap"><div class="card empty">Loading order...</div></main><script>'use strict';const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2}),labels={ordered:'Ordered',packed:'Packed',shipped:'Shipped',out_for_delivery:'Out for Delivery',delivered:'Delivered'},stages=Object.keys(labels);function tracking(status){if(status==='cancelled')return '<div style="padding:20px;color:#c62828;font-weight:700">Order Cancelled</div>';const n=Math.max(0,stages.indexOf(status));return '<div class="timeline">'+stages.map((s,i)=>'<div class="step '+(i<=n?'done':'')+'"><div class="dot"></div>'+labels[s]+'</div>').join('')+'</div>'}function image(x){return x.image_url?'<img src="'+esc(x.image_url)+'" alt="'+esc(x.name||'Product')+'" onerror="this.outerHTML=\'<div class=&quot;fallback&quot;>Image unavailable</div>\'">':'<div class="fallback">Image unavailable</div>'}async function init(){const params=new URLSearchParams(location.search),key=params.get('id')||params.get('order');if(!key){document.getElementById('root').innerHTML='<div class="card empty">Invalid order ID.</div>';return}const{data:{session}}=await window.supabaseClient.auth.getSession();if(!session){location.href='login.html';return}let q=window.supabaseClient.from('orders').select('id,display_order_id,user_id,total_amount,currency,status,payment_method,payment_handling_fee,prepaid_discount,cod_fee_non_refundable,payment_verified_at,payment_source,fulfillment_status,fulfillment_updated_at,customer_name,customer_email,customer_phone,items,shipping_address,created_at,coupon_code,coupon_discount,gift_card_code,gift_card_discount,razorpay_payment_id').eq('user_id',session.user.id);q=/^\d+$/.test(key)?q.eq('id',key):q.eq('display_order_id',key);const{data:o,error}=await q.maybeSingle();if(error||!o){document.getElementById('root').innerHTML='<div class="card empty">Order not found.</div>';return}const items=Array.isArray(o.items)?o.items:[],a=o.shipping_address||{},subtotal=items.reduce((s,x)=>s+Number(x.taxable_amount||Number(x.unit_price||0)*Number(x.qty||1)),0),gst=items.reduce((s,x)=>s+Number(x.gst_amount||0),0),coupon=Number(o.coupon_discount||0),gift=Number(o.gift_card_discount||0),handling=Number(o.payment_handling_fee||0),prepaidDiscount=Number(o.prepaid_discount||0),delivery=Math.max(0,Number(o.total_amount)-subtotal-gst+coupon+gift-handling+prepaidDiscount);document.title='Order '+(o.display_order_id||o.id)+' | Fashion_Fussion';const paymentLabel=o.payment_method==='cod'?'Cash on Delivery':(o.status==='paid'?'Prepaid · Paid':'Prepaid · '+String(o.status||'Pending').replaceAll('_',' '));document.getElementById('root').innerHTML='<div class="card"><div class="head">Order Details<div class="orderid">Order #<b>'+esc(o.display_order_id||o.id)+'</b> &nbsp; | &nbsp; Placed on '+new Date(o.created_at).toLocaleDateString('en-IN')+'</div></div>'+items.map(x=>'<div class="product">'+image(x)+'<div><div class="pname">'+esc(x.name||'Product')+'</div><div class="muted">Quantity: '+esc(x.qty||1)+' · '+esc(x.category||'')+' · GST '+esc(x.gst_rate||0)+'%</div><div style="font-weight:800;margin-top:10px">'+money(x.line_total||Number(x.unit_price||0)*Number(x.qty||1))+'</div></div></div>').join('')+'</div><div class="card track"><div class="head">Order Status</div>'+tracking(o.fulfillment_status||'ordered')+'</div><div class="card grid"><div class="pane"><b>Delivery Address</b><p><strong>'+esc(a.full_name||o.customer_name||'')+'</strong><br>'+esc(a.address_line1||'')+(a.address_line2?'<br>'+esc(a.address_line2):'')+'<br>'+esc(a.city||'')+', '+esc(a.state||'')+' '+esc(a.postal_code||'')+'<br>'+esc(a.country||'India')+'<br><br>Phone: '+esc(a.phone||o.customer_phone||'')+'</p></div><div class="pane"><b>Price Details</b><div class="row"><span>Subtotal</span><span>'+money(subtotal)+'</span></div><div class="row"><span>GST</span><span>'+money(gst)+'</span></div><div class="row"><span>Delivery</span><span>'+(delivery?money(delivery):'<span class="green">FREE</span>')+'</span></div>'+(coupon?'<div class="row green"><span>Coupon '+esc(o.coupon_code||'')+'</span><span>− '+money(coupon)+'</span></div>':'')+(gift?'<div class="row green"><span>Gift Card</span><span>− '+money(gift)+'</span></div>':'')+(handling?'<div class="row"><span>Payment Handling</span><span>+ '+money(handling)+'</span></div>':'')+(prepaidDiscount?'<div class="row green"><span>Prepaid Discount</span><span>− '+money(prepaidDiscount)+'</span></div>':'')+(o.cod_fee_non_refundable?'<div class="row red"><span>COD charge</span><span>Non-refundable</span></div>':'')+'<div class="row total"><span>Order Total</span><span>'+money(o.total_amount)+'</span></div><div class="muted">Payment: '+esc(paymentLabel)+(o.razorpay_payment_id?'<br>Payment ID: '+esc(o.razorpay_payment_id):'')+'</div></div></div>'}init().catch(e=>{console.error(e);document.getElementById('root').innerHTML='<div class="card empty">Order details could not be loaded.</div>'});</script></body></html>
