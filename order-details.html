<style>
:root{--navy:#111827;--brand:#5b3df5;--brand2:#472bd7;--bg:#f6f7fb;--card:#fff;--ink:#171a22;--muted:#697386;--line:#e5e7eb;--green:#118344;--greenbg:#edf9f1;--red:#b42318;--redbg:#fff0ef;--amber:#9a6700;--amberbg:#fff8dc;--shadow:0 8px 30px rgba(17,24,39,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}a{color:inherit}.top{background:var(--navy);color:#fff}.topin{max-width:1320px;height:72px;margin:auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:23px;font-weight:900;letter-spacing:-.7px;text-decoration:none}.toplinks{display:flex;gap:20px;align-items:center;font-size:13px}.toplinks a{text-decoration:none;color:#e7eaf0}.subbar{background:#fff;border-bottom:1px solid var(--line)}.subin{max-width:1320px;margin:auto;padding:13px 28px;display:flex;justify-content:space-between;align-items:center}.crumb{font-size:13px;color:var(--muted)}.crumb a{text-decoration:none}.back{font-size:13px;color:var(--brand);font-weight:800;text-decoration:none}.wrap{max-width:1320px;margin:26px auto 54px;padding:0 28px}.hero{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px 24px;margin-bottom:20px;display:flex;justify-content:space-between;gap:24px;align-items:flex-start}.hero h1{font-size:26px;letter-spacing:-.6px;margin:0 0 8px}.orderid{font-size:13px;color:var(--muted);line-height:1.6}.status-badge{display:inline-flex;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.3px;background:#efedff;color:var(--brand)}.status-badge.good{background:var(--greenbg);color:var(--green)}.status-badge.bad{background:var(--redbg);color:var(--red)}.status-badge.warn{background:var(--amberbg);color:var(--amber)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}.head{padding:17px 20px;border-bottom:1px solid var(--line);font-weight:900;font-size:15px;display:flex;justify-content:space-between;align-items:center}.head small{font-size:11px;color:var(--muted);font-weight:700}.product{display:grid;grid-template-columns:112px minmax(0,1fr) auto;gap:18px;padding:20px;border-bottom:1px solid #edf0f3}.product:last-child{border-bottom:0}.product img,.fallback{width:112px;height:112px;object-fit:contain;border:1px solid #eceef2;border-radius:10px;background:#fafafa}.fallback{display:grid;place-items:center;text-align:center;color:#8b93a3;font-size:12px;padding:10px}.pname{font-size:15px;font-weight:900;margin:2px 0 7px}.muted{color:var(--muted);font-size:12px;line-height:1.55}.amount{font-size:17px;font-weight:900;margin-top:10px}.line-total{text-align:right;font-size:15px;font-weight:900}.track-wrap{padding:24px 20px 30px}.timeline{display:grid;grid-template-columns:repeat(5,1fr);position:relative}.timeline:before{content:"";position:absolute;height:4px;background:#e2e5ea;left:10%;right:10%;top:14px}.progress{position:absolute;height:4px;background:var(--green);left:10%;top:14px;max-width:80%}.step{position:relative;z-index:1;text-align:center;color:#8b93a3;font-size:11px}.dot{width:28px;height:28px;border-radius:50%;background:#e2e5ea;border:6px solid #fff;box-shadow:0 0 0 1px #d8dce3;margin:0 auto 10px}.step.done .dot{background:var(--green);box-shadow:0 0 0 1px var(--green)}.step.done{color:var(--ink);font-weight:800}.cancel-state{margin:0;padding:20px;background:var(--redbg);color:var(--red);font-weight:800}.info-grid{display:grid;grid-template-columns:1fr 1fr}.pane{padding:20px}.pane:first-child{border-right:1px solid var(--line)}.pane h3{font-size:14px;margin:0 0 12px}.pane p{font-size:13px;line-height:1.65;margin:0;color:#3f4653}.row{display:flex;justify-content:space-between;gap:14px;margin:10px 0;font-size:13px}.row span:last-child{font-weight:700}.total{border-top:1px dashed #d9dde5;margin-top:12px;padding-top:14px;font-size:18px;font-weight:900}.green{color:var(--green)}.side{position:sticky;top:18px}.action-list{padding:16px 18px}.btn{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:12px 13px;margin-bottom:9px;font-weight:900;font-size:13px;cursor:pointer;text-decoration:none;display:block;text-align:center}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.primary:hover{background:var(--brand2)}.btn.danger{border-color:#f0c5c1;color:var(--red);background:#fffafa}.btn:disabled,.btn.disabled{opacity:.5;cursor:not-allowed;pointer-events:none}.action-note{font-size:11px;color:var(--muted);line-height:1.55;margin:4px 0 14px}.policy{padding:16px 18px;background:#fafbfc;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.6}.support-box{padding:18px}.support-box p{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 12px}.empty{text-align:center;padding:50px;color:var(--muted)}.modal-backdrop{position:fixed;inset:0;background:rgba(17,24,39,.58);display:none;align-items:center;justify-content:center;padding:24px;z-index:1000}.modal-backdrop.show{display:flex}.modal{width:min(560px,100%);background:#fff;border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.28);overflow:hidden}.modal-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}.modal-head h2{font-size:19px;margin:0 0 4px}.modal-head p{font-size:12px;color:var(--muted);margin:0}.close{border:0;background:#f3f4f6;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px}.modal-body{padding:20px 22px}.field-label{display:block;font-size:12px;font-weight:900;margin:0 0 8px}.reason{width:100%;border:1px solid #d8dce4;border-radius:9px;padding:11px 12px;background:#fff;font:inherit;outline:none}.reason:focus{border-color:var(--brand);box-shadow:0 0 0 3px #efedff}.preview{margin-top:18px;border:1px solid var(--line);border-radius:11px;overflow:hidden}.preview-title{padding:11px 13px;background:#f8f9fb;font-size:12px;font-weight:900}.preview .row{padding:0 13px}.preview-note{padding:11px 13px;background:var(--greenbg);color:#176b3a;font-size:11px;line-height:1.55}.modal-error{display:none;margin-top:12px;background:var(--redbg);color:var(--red);padding:10px 12px;border-radius:8px;font-size:12px}.modal-error.show{display:block}.modal-actions{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);background:#fafbfc}.modal-actions button{border-radius:9px;padding:11px 15px;font-weight:900;border:1px solid var(--line);cursor:pointer}.keep{background:#fff;color:var(--ink)}.confirm{background:var(--red);border-color:var(--red)!important;color:#fff}.confirm:disabled{opacity:.55;cursor:not-allowed}@media(max-width:950px){.layout{grid-template-columns:1fr}.side{position:static}.info-grid{grid-template-columns:1fr}.pane:first-child{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header class="top"><div class="topin"><a class="logo" href="index.html">Fashion_Fussion</a><div class="toplinks"><a href="account.html#orders">My Orders</a><a href="account.html">Account</a></div></div></header>
<div class="subbar"><div class="subin"><div class="crumb"><a href="account.html#orders">My Orders</a> &nbsp;›&nbsp; Order Details</div><a class="back" href="account.html#orders">← Back to orders</a></div></div>
<main id="root" class="wrap"><div class="card empty">Loading order...</div></main>
<div class="modal-backdrop" id="cancelModal" aria-hidden="true"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="cancelTitle"><div class="modal-head"><div><h2 id="cancelTitle">Cancel this order?</h2><p>Review the refund impact before confirming.</p></div><button class="close" id="closeCancel" type="button" aria-label="Close">×</button></div><div class="modal-body"><label class="field-label" for="cancelReason">Reason for cancellation</label><select class="reason" id="cancelReason"><option value="">Select a reason</option><option>Ordered by mistake</option><option>Need to change address</option><option>Need to change product or quantity</option><option>Delivery will be too late</option><option>Found another option</option><option>Other</option></select><div class="preview" id="refundPreview"></div><div class="modal-error" id="cancelError"></div></div><div class="modal-actions"><button class="keep" id="keepOrder" type="button">Keep order</button><button class="confirm" id="confirmCancel" type="button">Cancel & refund</button></div></div></div>
<script>
'use strict';
const BACKEND_URL='https://fashion-fussion-olive.vercel.app';
const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const labels={ordered:'Order Placed',packed:'Packed',shipped:'Shipped',out_for_delivery:'Out for Delivery',delivered:'Delivered'};
const stages=Object.keys(labels);let activeOrder=null;
function statusText(o){const s=String(o.status||'').toLowerCase(),f=String(o.fulfillment_status||'ordered').toLowerCase();if(['cancelled','cod_cancelled'].includes(s)||f==='cancelled')return[s==='refund_initiated'?'Refund in progress':'Cancelled',s==='refund_initiated'?'warn':'bad'];if(s==='refunded')return['Refunded','good'];if(s==='refund_pending'||s==='refund_initiated')return['Refund in progress','warn'];if(f==='delivered')return['Delivered','good'];if(f==='out_for_delivery')return['Out for delivery','warn'];if(f==='shipped')return['Shipped','warn'];if(f==='packed')return['Packed',''];return['Order placed','']}
function tracking(o){const status=String(o.status||'').toLowerCase(),f=String(o.fulfillment_status||'ordered').toLowerCase();if(f==='cancelled'||['cancelled','cod_cancelled','refund_initiated','refunded'].includes(status)){let msg='Order cancelled.';if(status==='refund_initiated')msg+=' Refund has been initiated to the original payment method.';else if(status==='refunded')msg+=' Refund has been processed to the original payment method.';else if(o.payment_method==='cod')msg+=' No refund is required because payment was not collected for this COD order.';return '<div class="cancel-state">'+msg+'</div>'}const n=Math.max(0,stages.indexOf(f));const progress=n<=0?0:(n/(stages.length-1))*80;return '<div class="track-wrap"><div class="timeline"><div class="progress" style="width:'+progress+'%"></div>'+stages.map((s,i)=>'<div class="step '+(i<=n?'done':'')+'"><div class="dot"></div>'+labels[s]+'</div>').join('')+'</div></div>'}
function image(x){return x.image_url?'<img src="'+esc(x.image_url)+'" alt="'+esc(x.name||'Product')+'" onerror="this.outerHTML=\'<div class=&quot;fallback&quot;>Product image<br>unavailable</div>\'">':'<div class="fallback">Product image<br>unavailable</div>'}
function cancellation(o){const f=String(o.fulfillment_status||'ordered').toLowerCase(),s=String(o.status||'').toLowerCase();const terminal=['cancelled','cod_cancelled','refund_initiated','refunded','payment_failed','expired'];if(terminal.includes(s)||f==='cancelled')return{available:false,note:'This order is already closed, so cancellation is not available.'};if(!['ordered','packed'].includes(f))return{available:false,note:f==='delivered'?'This order has been delivered. Use return or exchange options when eligible.':'Cancellation is unavailable because fulfilment has progressed.'};if(o.payment_method==='cod'&&s==='cod_pending')return{available:true,note:'You can cancel this COD order before shipment. No refund is needed because payment has not been collected.'};if(o.payment_method==='prepaid'&&s==='paid'){if(Number(o.gift_card_discount||0)>0)return{available:false,note:'This order used a gift card. Contact support so the payment refund and gift-card balance can both be restored safely.'};return{available:true,note:'Cancellation will refund the eligible prepaid amount to the original payment method. Any delivery charge applied below ₹299 remains non-refundable.'}}return{available:false,note:'Cancellation is not available for the current payment state.'}}
async function api(path,body){const{data:{session},error}=await window.supabaseClient.auth.getSession();if(error||!session?.access_token)throw new Error('Your login session has expired. Please log in again.');const r=await fetch(BACKEND_URL+path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
function refundBreakdown(o){const items=Array.isArray(o.items)?o.items:[],subtotal=items.reduce((s,x)=>s+Number(x.taxable_amount||Number(x.unit_price||0)*Number(x.qty||1)),0),gst=items.reduce((s,x)=>s+Number(x.gst_amount||0),0),coupon=Number(o.coupon_discount||0),gift=Number(o.gift_card_discount||0),delivery=Math.max(0,Number(o.total_amount)-subtotal-gst+coupon+gift);return{delivery,refundable:Math.max(0,Number(o.total_amount)-delivery)}}
function openCancellation(o){activeOrder=o;const modal=document.getElementById('cancelModal'),reason=document.getElementById('cancelReason'),err=document.getElementById('cancelError'),confirm=document.getElementById('confirmCancel'),b=refundBreakdown(o),prepaid=o.payment_method==='prepaid';reason.value='';err.textContent='';err.classList.remove('show');confirm.textContent=prepaid?'Cancel & refund':'Cancel order';document.getElementById('refundPreview').innerHTML='<div class="preview-title">Refund preview</div><div class="row"><span>Payment method</span><span>'+esc(prepaid?'Online payment':'Cash on Delivery')+'</span></div><div class="row"><span>Amount already collected</span><span>'+money(prepaid?o.total_amount:0)+'</span></div>'+(prepaid&&b.delivery?'<div class="row"><span>Non-refundable delivery</span><span>− '+money(b.delivery)+'</span></div>':'')+'<div class="row total"><span>Refund due</span><span>'+money(prepaid?b.refundable:0)+'</span></div><div class="preview-note">'+(prepaid?'The eligible amount will be refunded to your original payment method. Refund processing status will appear on this order after cancellation.':'No money has been collected for this COD order, so cancellation does not require a refund.')+'</div>';modal.classList.add('show');modal.setAttribute('aria-hidden','false')}
function closeCancellation(){const modal=document.getElementById('cancelModal');modal.classList.remove('show');modal.setAttribute('aria-hidden','true');activeOrder=null}
async function confirmCancellation(){if(!activeOrder)return;const reason=document.getElementById('cancelReason').value.trim(),err=document.getElementById('cancelError'),btn=document.getElementById('confirmCancel'),prepaid=activeOrder.payment_method==='prepaid';err.textContent='';err.classList.remove('show');if(!reason){err.textContent='Please select a cancellation reason.';err.classList.add('show');return}btn.disabled=true;btn.textContent=prepaid?'Starting refund...':'Cancelling...';try{const d=await api('/api/cancel-order',{order_id:activeOrder.id,reason});if(d.ok){closeCancellation();location.reload();return}throw new Error('Cancellation could not be completed')}catch(e){err.textContent=e.message||'Unable to cancel order';err.classList.add('show')}finally{btn.disabled=false;btn.textContent=prepaid?'Cancel & refund':'Cancel order'}}
async function init(){const params=new URLSearchParams(location.search),key=params.get('id')||params.get('order');if(!key){document.getElementById('root').innerHTML='<div class="card empty">Invalid order ID.</div>';return}const{data:{session}}=await window.supabaseClient.auth.getSession();if(!session){location.href='login.html';return}let q=window.supabaseClient.from('orders').select('id,display_order_id,user_id,total_amount,currency,status,payment_method,payment_verified_at,payment_source,fulfillment_status,fulfillment_updated_at,customer_name,customer_email,customer_phone,items,shipping_address,created_at,coupon_code,coupon_discount,gift_card_code,gift_card_discount,razorpay_payment_id').eq('user_id',session.user.id);q=/^\d+$/.test(key)?q.eq('id',key):q.eq('display_order_id',key);const{data:o,error}=await q.maybeSingle();if(error||!o){document.getElementById('root').innerHTML='<div class="card empty">Order not found.</div>';return}const items=Array.isArray(o.items)?o.items:[],a=o.shipping_address||{},subtotal=items.reduce((s,x)=>s+Number(x.taxable_amount||Number(x.unit_price||0)*Number(x.qty||1)),0),gst=items.reduce((s,x)=>s+Number(x.gst_amount||0),0),coupon=Number(o.coupon_discount||0),gift=Number(o.gift_card_discount||0),delivery=Math.max(0,Number(o.total_amount)-subtotal-gst+coupon+gift),badge=statusText(o),cancel=cancellation(o);document.title='Order '+(o.display_order_id||o.id)+' | Fashion_Fussion';const paymentLabel=o.payment_method==='cod'?'Cash on Delivery':(o.status==='paid'?'Online payment · Paid':'Online payment · '+String(o.status||'Pending').replaceAll('_',' '));const productHtml=items.map(x=>'<div class="product">'+image(x)+'<div><div class="pname">'+esc(x.name||'Product')+'</div><div class="muted">Quantity: '+esc(x.qty||1)+(x.category?' · '+esc(x.category):'')+(x.gst_rate!=null?' · GST '+esc(x.gst_rate)+'%':'')+'</div><div class="amount">'+money(x.unit_price||0)+' / unit</div></div><div class="line-total">'+money(x.line_total||Number(x.unit_price||0)*Number(x.qty||1))+'</div></div>').join('');const cancelButton=cancel.available?'<button class="btn danger" id="cancelOrderBtn" type="button">Cancel order</button>':'<button class="btn danger" type="button" disabled>Cancel order unavailable</button>';document.getElementById('root').innerHTML='<div class="hero"><div><h1>Order details</h1><div class="orderid">Order #<b>'+esc(o.display_order_id||o.id)+'</b><br>Placed on '+new Date(o.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})+'</div></div><span class="status-badge '+badge[1]+'">'+esc(badge[0])+'</span></div><div class="layout"><section><div class="card"><div class="head">Products <small>'+items.length+' item'+(items.length===1?'':'s')+'</small></div>'+productHtml+'</div><div class="card"><div class="head">Order status</div>'+tracking(o)+'</div><div class="card info-grid"><div class="pane"><h3>Delivery address</h3><p><strong>'+esc(a.full_name||o.customer_name||'')+'</strong><br>'+esc(a.address_line1||'')+(a.address_line2?'<br>'+esc(a.address_line2):'')+'<br>'+esc(a.city||'')+', '+esc(a.state||'')+' '+esc(a.postal_code||'')+'<br>'+esc(a.country||'India')+'<br><br>Phone: '+esc(a.phone||o.customer_phone||'')+'</p></div><div class="pane"><h3>Price details</h3><div class="row"><span>Product subtotal</span><span>'+money(subtotal)+'</span></div><div class="row"><span>GST</span><span>'+money(gst)+'</span></div><div class="row"><span>Delivery</span><span>'+(delivery?money(delivery):'<span class="green">FREE</span>')+'</span></div>'+(coupon?'<div class="row green"><span>Coupon '+esc(o.coupon_code||'')+'</span><span>− '+money(coupon)+'</span></div>':'')+(gift?'<div class="row green"><span>Gift card</span><span>− '+money(gift)+'</span></div>':'')+'<div class="row total"><span>Order total</span><span>'+money(o.total_amount)+'</span></div><div class="muted">Payment: '+esc(paymentLabel)+(o.razorpay_payment_id?'<br>Payment ID: '+esc(o.razorpay_payment_id):'')+'</div></div></div></section><aside class="side"><div class="card"><div class="head">Order actions</div><div class="action-list"><a class="btn primary" href="account.html#orders">View all orders</a>'+cancelButton+'<div class="action-note">'+esc(cancel.note)+'</div><a class="btn" href="account.html">Need help with this order?</a></div><div class="policy">Delivery charges applied below ₹299 remain separate from GST and are non-refundable on cancellation.</div></div><div class="card"><div class="head">Payment & refund</div><div class="support-box"><p>'+(o.status==='refund_initiated'?'Your refund has been initiated to the original payment method.':o.status==='refunded'?'Your refund has been processed to the original payment method.':'Prepaid refunds return to the original payment method when eligible. COD orders cancelled before payment do not need a refund destination.')+'</p><a class="btn" href="account.html">Payments & refunds</a></div></div></aside></div>';const btn=document.getElementById('cancelOrderBtn');if(btn)btn.onclick=()=>openCancellation(o)}
document.getElementById('closeCancel').onclick=closeCancellation;document.getElementById('keepOrder').onclick=closeCancellation;document.getElementById('confirmCancel').onclick=confirmCancellation;document.getElementById('cancelModal').addEventListener('click',e=>{if(e.target.id==='cancelModal')closeCancellation()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCancellation()});
init().catch(e=>{console.error(e);document.getElementById('root').innerHTML='<div class="card empty">Order details could not be loaded.</div>'});
</script>
</body>
</html>
