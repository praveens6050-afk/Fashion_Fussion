<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Details | Fashion_Fussion</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="supabase-config.js"></script>
<style>
:root{--navy:#111827;--brand:#5b3df5;--brand2:#472bd7;--bg:#f6f7fb;--card:#fff;--ink:#171a22;--muted:#697386;--line:#e5e7eb;--green:#118344;--greenbg:#edf9f1;--red:#b42318;--redbg:#fff0ef;--amber:#9a6700;--amberbg:#fff8dc;--shadow:0 8px 30px rgba(17,24,39,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}a{color:inherit}.top{background:var(--navy);color:#fff}.topin{max-width:1320px;height:72px;margin:auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:23px;font-weight:900;letter-spacing:-.7px;text-decoration:none}.toplinks{display:flex;gap:20px;align-items:center;font-size:13px}.toplinks a{text-decoration:none;color:#e7eaf0}.subbar{background:#fff;border-bottom:1px solid var(--line)}.subin{max-width:1320px;margin:auto;padding:13px 28px;display:flex;justify-content:space-between;align-items:center}.crumb{font-size:13px;color:var(--muted)}.crumb a{text-decoration:none}.back{font-size:13px;color:var(--brand);font-weight:800;text-decoration:none}.wrap{max-width:1320px;margin:26px auto 54px;padding:0 28px}.hero{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px 24px;margin-bottom:20px;display:flex;justify-content:space-between;gap:24px;align-items:flex-start}.hero h1{font-size:26px;letter-spacing:-.6px;margin:0 0 8px}.orderid{font-size:13px;color:var(--muted);line-height:1.6}.status-badge{display:inline-flex;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.3px;background:#efedff;color:var(--brand)}.status-badge.good{background:var(--greenbg);color:var(--green)}.status-badge.bad{background:var(--redbg);color:var(--red)}.status-badge.warn{background:var(--amberbg);color:var(--amber)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}.head{padding:17px 20px;border-bottom:1px solid var(--line);font-weight:900;font-size:15px;display:flex;justify-content:space-between;align-items:center}.head small{font-size:11px;color:var(--muted);font-weight:700}.product{display:grid;grid-template-columns:112px minmax(0,1fr) auto;gap:18px;padding:20px;border-bottom:1px solid #edf0f3}.product:last-child{border-bottom:0}.product img,.fallback{width:112px;height:112px;object-fit:contain;border:1px solid #eceef2;border-radius:10px;background:#fafafa}.fallback{display:grid;place-items:center;text-align:center;color:#8b93a3;font-size:12px;padding:10px}.pname{font-size:15px;font-weight:900;margin:2px 0 7px}.muted{color:var(--muted);font-size:12px;line-height:1.55}.amount{font-size:17px;font-weight:900;margin-top:10px}.line-total{text-align:right;font-size:15px;font-weight:900}.track-wrap{padding:24px 20px 30px}.timeline{display:grid;grid-template-columns:repeat(5,1fr);position:relative}.timeline:before{content:"";position:absolute;height:4px;background:#e2e5ea;left:10%;right:10%;top:14px}.progress{position:absolute;height:4px;background:var(--green);left:10%;top:14px;max-width:80%}.step{position:relative;z-index:1;text-align:center;color:#8b93a3;font-size:11px}.dot{width:28px;height:28px;border-radius:50%;background:#e2e5ea;border:6px solid #fff;box-shadow:0 0 0 1px #d8dce3;margin:0 auto 10px}.step.done .dot{background:var(--green);box-shadow:0 0 0 1px var(--green)}.step.done{color:var(--ink);font-weight:800}.cancel-state{margin:0;padding:20px;background:var(--redbg);color:var(--red);font-weight:800}.info-grid{display:grid;grid-template-columns:1fr 1fr}.pane{padding:20px}.pane:first-child{border-right:1px solid var(--line)}.pane h3{font-size:14px;margin:0 0 12px}.pane p{font-size:13px;line-height:1.65;margin:0;color:#3f4653}.row{display:flex;justify-content:space-between;gap:14px;margin:10px 0;font-size:13px}.row span:last-child{font-weight:700}.total{border-top:1px dashed #d9dde5;margin-top:12px;padding-top:14px;font-size:18px;font-weight:900}.green{color:var(--green)}.side{position:sticky;top:18px}.action-list{padding:16px 18px}.btn{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:12px 13px;margin-bottom:9px;font-weight:900;font-size:13px;cursor:pointer;text-decoration:none;display:block;text-align:center}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.primary:hover{background:var(--brand2)}.btn.danger{border-color:#f0c5c1;color:var(--red);background:#fffafa}.btn:disabled,.btn.disabled{opacity:.5;cursor:not-allowed;pointer-events:none}.action-note{font-size:11px;color:var(--muted);line-height:1.55;margin:4px 0 14px}.policy{padding:16px 18px;background:#fafbfc;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.6}.support-box{padding:18px}.support-box p{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 12px}.empty{text-align:center;padding:50px;color:var(--muted)}@media(max-width:950px){.layout{grid-template-columns:1fr}.side{position:static}.info-grid{grid-template-columns:1fr}.pane:first-child{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header class="top"><div class="topin"><a class="logo" href="index.html">Fashion_Fussion</a><div class="toplinks"><a href="account.html#orders">My Orders</a><a href="account.html">Account</a></div></div></header>
<div class="subbar"><div class="subin"><div class="crumb"><a href="account.html#orders">My Orders</a> &nbsp;›&nbsp; Order Details</div><a class="back" href="account.html#orders">← Back to orders</a></div></div>
<main id="root" class="wrap"><div class="card empty">Loading order...</div></main>
<script>
'use strict';
const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const labels={ordered:'Order Placed',packed:'Packed',shipped:'Shipped',out_for_delivery:'Out for Delivery',delivered:'Delivered'};
const stages=Object.keys(labels);
function statusText(o){const s=String(o.status||'').toLowerCase(),f=String(o.fulfillment_status||'ordered').toLowerCase();if(['cancelled','cod_cancelled'].includes(s)||f==='cancelled')return['Cancelled','bad'];if(s==='refunded')return['Refunded','good'];if(s==='refund_pending'||s==='refund_initiated')return['Refund in progress','warn'];if(f==='delivered')return['Delivered','good'];if(f==='out_for_delivery')return['Out for delivery','warn'];if(f==='shipped')return['Shipped','warn'];if(f==='packed')return['Packed',''];return['Order placed','']}
function tracking(o){const status=String(o.status||'').toLowerCase(),f=String(o.fulfillment_status||'ordered').toLowerCase();if(['cancelled','cod_cancelled'].includes(status)||f==='cancelled')return '<div class="cancel-state">Order cancelled. Refund information will appear here when applicable.</div>';const n=Math.max(0,stages.indexOf(f));const progress=n<=0?0:(n/(stages.length-1))*80;return '<div class="track-wrap"><div class="timeline"><div class="progress" style="width:'+progress+'%"></div>'+stages.map((s,i)=>'<div class="step '+(i<=n?'done':'')+'"><div class="dot"></div>'+labels[s]+'</div>').join('')+'</div></div>'}
function image(x){return x.image_url?'<img src="'+esc(x.image_url)+'" alt="'+esc(x.name||'Product')+'" onerror="this.outerHTML=\'<div class=&quot;fallback&quot;>Product image<br>unavailable</div>\'">':'<div class="fallback">Product image<br>unavailable</div>'}
function cancellation(o){const f=String(o.fulfillment_status||'ordered').toLowerCase(),s=String(o.status||'').toLowerCase();const terminal=['cancelled','cod_cancelled','refunded','payment_failed','expired'];if(terminal.includes(s))return{available:false,note:'This order is already closed, so cancellation is not available.'};if(f==='ordered')return{available:true,note:'Cancellation is available before packing begins. A refund, when required, should go to the original payment method.'};if(f==='packed')return{available:true,note:'The order is packed. Cancellation may still be possible until shipment is handed over.'};if(['shipped','out_for_delivery'].includes(f))return{available:false,note:'Cancellation is unavailable because the package has shipped. You can use return/support options after delivery if eligible.'};if(f==='delivered')return{available:false,note:'This order has been delivered. Use return or exchange options when the product is eligible.'};return{available:false,note:'Cancellation availability cannot be confirmed for this order state.'}}
async function init(){const params=new URLSearchParams(location.search),key=params.get('id')||params.get('order');if(!key){document.getElementById('root').innerHTML='<div class="card empty">Invalid order ID.</div>';return}const{data:{session}}=await window.supabaseClient.auth.getSession();if(!session){location.href='login.html';return}let q=window.supabaseClient.from('orders').select('id,display_order_id,user_id,total_amount,currency,status,payment_method,payment_verified_at,payment_source,fulfillment_status,fulfillment_updated_at,customer_name,customer_email,customer_phone,items,shipping_address,created_at,coupon_code,coupon_discount,gift_card_code,gift_card_discount,razorpay_payment_id').eq('user_id',session.user.id);q=/^\d+$/.test(key)?q.eq('id',key):q.eq('display_order_id',key);const{data:o,error}=await q.maybeSingle();if(error||!o){document.getElementById('root').innerHTML='<div class="card empty">Order not found.</div>';return}const items=Array.isArray(o.items)?o.items:[],a=o.shipping_address||{},subtotal=items.reduce((s,x)=>s+Number(x.taxable_amount||Number(x.unit_price||0)*Number(x.qty||1)),0),gst=items.reduce((s,x)=>s+Number(x.gst_amount||0),0),coupon=Number(o.coupon_discount||0),gift=Number(o.gift_card_discount||0),delivery=Math.max(0,Number(o.total_amount)-subtotal-gst+coupon+gift),badge=statusText(o),cancel=cancellation(o);document.title='Order '+(o.display_order_id||o.id)+' | Fashion_Fussion';const paymentLabel=o.payment_method==='cod'?'Cash on Delivery':(o.status==='paid'?'Online payment · Paid':'Online payment · '+String(o.status||'Pending').replaceAll('_',' '));const productHtml=items.map(x=>'<div class="product">'+image(x)+'<div><div class="pname">'+esc(x.name||'Product')+'</div><div class="muted">Quantity: '+esc(x.qty||1)+(x.category?' · '+esc(x.category):'')+(x.gst_rate!=null?' · GST '+esc(x.gst_rate)+'%':'')+'</div><div class="amount">'+money(x.unit_price||0)+' / unit</div></div><div class="line-total">'+money(x.line_total||Number(x.unit_price||0)*Number(x.qty||1))+'</div></div>').join('');const cancelButton=cancel.available?'<button class="btn danger" id="cancelOrderBtn" type="button">Cancel order</button>':'<button class="btn danger" type="button" disabled>Cancel order unavailable</button>';document.getElementById('root').innerHTML='<div class="hero"><div><h1>Order details</h1><div class="orderid">Order #<b>'+esc(o.display_order_id||o.id)+'</b><br>Placed on '+new Date(o.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})+'</div></div><span class="status-badge '+badge[1]+'">'+esc(badge[0])+'</span></div><div class="layout"><section><div class="card"><div class="head">Products <small>'+items.length+' item'+(items.length===1?'':'s')+'</small></div>'+productHtml+'</div><div class="card"><div class="head">Order status</div>'+tracking(o)+'</div><div class="card info-grid"><div class="pane"><h3>Delivery address</h3><p><strong>'+esc(a.full_name||o.customer_name||'')+'</strong><br>'+esc(a.address_line1||'')+(a.address_line2?'<br>'+esc(a.address_line2):'')+'<br>'+esc(a.city||'')+', '+esc(a.state||'')+' '+esc(a.postal_code||'')+'<br>'+esc(a.country||'India')+'<br><br>Phone: '+esc(a.phone||o.customer_phone||'')+'</p></div><div class="pane"><h3>Price details</h3><div class="row"><span>Product subtotal</span><span>'+money(subtotal)+'</span></div><div class="row"><span>GST</span><span>'+money(gst)+'</span></div><div class="row"><span>Delivery</span><span>'+(delivery?money(delivery):'<span class="green">FREE</span>')+'</span></div>'+(coupon?'<div class="row green"><span>Coupon '+esc(o.coupon_code||'')+'</span><span>− '+money(coupon)+'</span></div>':'')+(gift?'<div class="row green"><span>Gift card</span><span>− '+money(gift)+'</span></div>':'')+'<div class="row total"><span>Order total</span><span>'+money(o.total_amount)+'</span></div><div class="muted">Payment: '+esc(paymentLabel)+(o.razorpay_payment_id?'<br>Payment ID: '+esc(o.razorpay_payment_id):'')+'</div></div></div></section><aside class="side"><div class="card"><div class="head">Order actions</div><div class="action-list"><a class="btn primary" href="account.html#orders">View all orders</a>'+cancelButton+'<div class="action-note">'+esc(cancel.note)+'</div><a class="btn" href="account.html">Need help with this order?</a></div><div class="policy">Delivery charges, when applied below the store threshold, are shown separately from GST. Refund eligibility depends on the order stage and store policy.</div></div><div class="card"><div class="head">Payment & refund</div><div class="support-box"><p>Prepaid refunds should be returned to the original payment method whenever supported. For Cash on Delivery orders cancelled before payment, no refund destination is needed.</p><a class="btn" href="account.html">Payments & refunds</a></div></div></aside></div>';
const btn=document.getElementById('cancelOrderBtn');if(btn)btn.onclick=()=>{alert('Cancellation flow is being enabled for eligible orders. This button will not cancel or charge anything until the refund preview and confirmation step are added.');};}
init().catch(e=>{console.error(e);document.getElementById('root').innerHTML='<div class="card empty">Order details could not be loaded.</div>'});
</script>
</body>
</html>
