<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | Fashion_Fussion</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:#f4eee1;color:#1c2333}.container{width:100%;max-width:460px;padding:20px}.card{background:#fffdf8;padding:35px;border:1px solid #d8cdae;border-radius:10px;box-shadow:0 12px 35px #1b2a4a14}h1{text-align:center;margin:0 0 8px;color:#1b2a4a}.subtitle{text-align:center;color:#666;margin-bottom:28px}label{display:block;font-weight:bold;margin:15px 0 7px;font-size:13px}input{width:100%;padding:13px;border:1px solid #ccc;border-radius:6px;font-size:15px}input:focus{outline:none;border-color:#1b2a4a}button{width:100%;padding:13px;margin-top:22px;border:0;border-radius:5px;background:#1b2a4a;color:#fff;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.links{text-align:center;margin-top:20px;line-height:1.8}.links a{color:#1b2a4a;text-decoration:none;font-weight:700}.message{display:none;margin-top:18px;padding:12px;border-radius:7px;font-size:14px;line-height:1.5}.error{background:#ffebee;color:#c62828}.success{background:#e8f5e9;color:#2e7d32}.hint{margin-top:7px;color:#666;font-size:12px}</style></head><body><div class="container"><div class="card"><h1>Fashion_Fussion</h1><div class="subtitle">Create your account</div><form id="signupForm"><label for="fullName">Full Name</label><input type="text" id="fullName" maxlength="100" required autocomplete="name"><label for="phone">Phone</label><input type="tel" id="phone" maxlength="20" required autocomplete="tel" placeholder="10-digit mobile number"><label for="email">Email</label><input type="email" id="email" required autocomplete="email"><label for="password">Password</label><input type="password" id="password" required minlength="10" autocomplete="new-password"><div class="hint">Use at least 10 characters. A unique password is recommended.</div><label for="confirmPassword">Confirm Password</label><input type="password" id="confirmPassword" required minlength="10" autocomplete="new-password"><button type="submit" id="signupButton">Create Account</button></form><div id="message" class="message"></div><div class="links"><a href="login.html">Already have an account? Login</a><br><a href="index.html">Continue shopping</a></div></div></div><script>'use strict';const form=document.getElementById('signupForm'),button=document.getElementById('signupButton'),message=document.getElementById('message');function show(text,type){message.textContent=text;message.className='message '+type;message.style.display='block'}form.addEventListener('submit',async e=>{e.preventDefault();const fullName=document.getElementById('fullName').value.trim(),rawPhone=document.getElementById('phone').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirmPassword').value;const phone=rawPhone.replace(/[^0-9+]/g,'');if(fullName.length<2){show('Enter your full name.','error');return}if(!/^\+?[0-9]{10,15}$/.test(phone)){show('Enter a valid mobile number.','error');return}if(password.length<10){show('Password must be at least 10 characters.','error');return}if(password!==confirm){show('Passwords do not match.','error');return}button.disabled=true;button.textContent='Creating account…';message.style.display='none';try{const emailRedirectTo=new URL('index.html',location.href).href;const{data,error}=await window.supabaseClient.auth.signUp({email,password,options:{emailRedirectTo,data:{full_name:fullName,phone}}});if(error)throw error;if(!data?.user)throw new Error('Account could not be created.');if(!data.session){show('Account created. Check your email and confirm your account before signing in.','success');form.reset()}else{show('Account created successfully. Redirecting…','success');setTimeout(()=>location.href='account.html',800)}}catch(err){console.error(err);show(err.message||'Unable to create account.','error')}finally{button.disabled=false;button.textContent='Create Account'}});</script></body></html>
