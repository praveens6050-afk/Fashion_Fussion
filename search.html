<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search | Fashion_Fussion</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="supabase-config.js"></script><style>:root{--navy:#111827;--brand:#5b3df5;--orange:#f59e0b;--bg:#f6f7fb;--ink:#171a22;--muted:#697386;--line:#e5e7eb;--green:#118344;--red:#b42318;--shadow:0 8px 28px #11182712}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}button,input,select{font:inherit}.wrap{max-width:1320px;margin:auto;padding:0 28px}.top{background:var(--navy);color:#fff}.topin{height:72px;display:flex;align-items:center;gap:22px}.brand{font-size:23px;font-weight:900}.search{flex:1;display:flex;max-width:720px}.search input{flex:1;border:0;padding:12px 14px;border-radius:8px 0 0 8px;outline:none}.search button{border:0;background:var(--orange);padding:0 20px;border-radius:0 8px 8px 0;font-weight:900;cursor:pointer}.links{margin-left:auto;display:flex;gap:20px;font-size:12px;font-weight:900}.sub{background:#fff;border-bottom:1px solid var(--line)}.subin{min-height:45px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.page{padding:26px 28px 52px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}.head h1{margin:0;font-size:28px}.head p{margin:6px 0 0;color:var(--muted);font-size:12px}.clear{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;font-size:11px;font-weight:900;cursor:pointer}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px}.filters,.results{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.filters{padding:18px;align-self:start;position:sticky;top:18px}.filters h2{font-size:13px;margin:0 0 14px}.label{font-size:10px;font-weight:900;margin:14px 0 7px}.catbtn{width:100%;text-align:left;border:0;background:none;padding:8px 9px;border-radius:7px;font-size:11px;cursor:pointer;color:#394150}.catbtn.active{background:#f1efff;color:var(--brand);font-weight:900}.results{padding:18px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;padding-bottom:15px;border-bottom:1px solid var(--line)}.count{font-size:12px;color:var(--muted)}.sort{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-size:11px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-top:18px}.product{border:1px solid var(--line);border-radius:11px;overflow:hidden;display:flex;flex-direction:column}.media{aspect-ratio:1;background:#f8f9fb;display:grid;place-items:center}.media img{width:100%;height:100%;object-fit:contain}.fallback{font-size:11px;color:#8a91a0}.body{padding:13px;display:flex;flex-direction:column;gap:7px;flex:1}.cat{font-size:9px;text-transform:uppercase;color:var(--brand);font-weight:900}.name{font-size:14px;font-weight:900;line-height:1.35}.desc{font-size:10px;color:var(--muted);line-height:1.45;min-height:30px}.review{font-size:10px;color:var(--muted)}.price{font-size:20px;font-weight:900;margin-top:auto}.tax{font-size:9px;color:var(--muted)}.actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:4px}.add,.details{border-radius:8px;padding:10px;font-size:10px;font-weight:900;cursor:pointer}.add{border:0;background:var(--navy);color:#fff}.details{border:1px solid var(--line);background:#fff}.empty{grid-column:1/-1;padding:50px 20px;text-align:center;color:var(--muted)}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;font-size:11px;display:none}.toast.show{display:block}</style></head><body><header class="top"><div class="wrap topin"><a class="brand" href="index.html">Fashion_Fussion</a><div class="search"><input id="searchBox" type="search" placeholder="Search products or categories" autocomplete="off"><button id="searchBtn">SEARCH</button></div><nav class="links"><a href="account.html#orders">Account</a><a href="wishlist.html">Wishlist</a><a href="cart.html">Cart</a></nav></div></header><div class="sub"><div class="wrap subin"><a href="index.html">Home</a><span>›</span><strong>Search & Categories</strong></div></div><main class="wrap page"><div class="head"><div><h1 id="title">Browse products</h1><p id="subtitle">Search active Fashion_Fussion products and filter by real catalogue categories.</p></div><button id="clear" class="clear">CLEAR FILTERS</button></div><div class="layout"><aside class="filters"><h2>Department</h2><div id="categoryList"></div></aside><section class="results"><div class="toolbar"><div id="count" class="count">Loading products…</div><select id="sort" class="sort"><option value="relevance">Sort: Relevance</option><option value="price-low">Price: Low to High</option><option value="price-high">Price: High to Low</option><option value="rating">Rating</option></select></div><div id="grid" class="grid"><div class="empty">Loading active products…</div></div></section></div></main><div id="toast" class="toast"></div><script>'use strict';const CART_KEY='fashion_fussion_cart',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});let products=[],activeCategory='All';function params(){return new URLSearchParams(location.search)}function searchTerm(){return $('searchBox').value.trim()}function toast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>$('toast').classList.remove('show'),1500)}function cart(){try{return JSON.parse(localStorage.getItem(CART_KEY)||'{}')||{}}catch{return{}}}function add(id){const c=cart();c[id]=Math.min(500,Math.max(0,Number(c[id])||0)+1);localStorage.setItem(CART_KEY,JSON.stringify(c));sessionStorage.removeItem('fashion_fussion_checkout_key');toast('Added to cart')}function image(p){return p.image_url?'<img src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;fallback&quot;>Image unavailable</div>\'">':'<div class="fallback">Image unavailable</div>'}function categories(){return['All',...new Set(products.map(p=>String(p.category||'').trim()).filter(Boolean))]}function syncUrl(){const u=new URL(location.href),q=searchTerm();q?u.searchParams.set('q',q):u.searchParams.delete('q');activeCategory!=='All'?u.searchParams.set('category',activeCategory):u.searchParams.delete('category');history.replaceState(null,'',u.pathname+(u.searchParams.toString()?'?'+u.searchParams.toString():''))}function renderCategories(){const cats=categories();if(!cats.includes(activeCategory))activeCategory='All';$('categoryList').innerHTML=cats.map(c=>'<button class="catbtn '+(c===activeCategory?'active':'')+'" data-cat="'+esc(c)+'">'+esc(c==='All'?'All departments':c)+'</button>').join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;renderCategories();syncUrl();render()})}function render(){const term=searchTerm().toLowerCase();let rows=products.filter(p=>(activeCategory==='All'||p.category===activeCategory)&&(!term||[p.name,p.category,p.description].some(v=>String(v||'').toLowerCase().includes(term))));const sort=$('sort').value;if(sort==='price-low')rows.sort((a,b)=>Number(a.price)-Number(b.price));if(sort==='price-high')rows.sort((a,b)=>Number(b.price)-Number(a.price));if(sort==='rating')rows.sort((a,b)=>Number(b.rating||0)-Number(a.rating||0));$('title').textContent=term?'Search results for “'+searchTerm()+'”':(activeCategory==='All'?'Browse products':activeCategory);$('count').textContent=rows.length+' product'+(rows.length===1?'':'s')+' found';$('grid').innerHTML=rows.length?rows.map(p=>{const reviews=Number(p.reviews||0),rating=Number(p.rating||0),review=reviews>0&&rating>0?'<div class="review">'+rating.toFixed(1)+' / 5 · '+reviews+' review'+(reviews===1?'':'s')+'</div>':'';return '<article class="product"><a class="media" href="product.html?id='+encodeURIComponent(p.id)+'">'+image(p)+'</a><div class="body"><div class="cat">'+esc(p.category||'General')+'</div><a class="name" href="product.html?id='+encodeURIComponent(p.id)+'">'+esc(p.name)+'</a><div class="desc">'+esc(p.description||'Product from Fashion_Fussion.')+'</div>'+review+'<div class="price">'+money(p.price)+'</div><div class="tax">Inclusive of applicable taxes · GST '+Number(p.gst_rate||0)+'%</div><div class="actions"><button class="add" data-add="'+p.id+'">ADD TO CART</button><a class="details" href="product.html?id='+encodeURIComponent(p.id)+'">DETAILS</a></div></div></article>'}).join(''):'<div class="empty">No products match these filters.</div>';document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add))}async function load(){const p=params();$('searchBox').value=p.get('q')||'';activeCategory=p.get('category')||'All';const{data,error}=await supabaseClient.from('products').select('id,name,description,category,price,rating,reviews,gst_rate,image_url,is_active').eq('is_active',true).order('id',{ascending:true});if(error)throw error;products=(data||[]).filter(x=>Number(x.price)>=0);renderCategories();render()}$('searchBtn').onclick=()=>{activeCategory='All';renderCategories();syncUrl();render()};$('searchBox').onkeydown=e=>{if(e.key==='Enter')$('searchBtn').click()};$('sort').onchange=render;$('clear').onclick=()=>{$('searchBox').value='';activeCategory='All';$('sort').value='relevance';renderCategories();syncUrl();render()};load().catch(e=>{console.error(e);$('count').textContent='Products could not be loaded.';$('grid').innerHTML='<div class="empty">Store search is temporarily unavailable.</div>'});</script></body></html>
