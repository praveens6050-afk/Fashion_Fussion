<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout | Fashion_Fussion</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#1c2333;--muted:#687083;--blue:#2874f0;--line:#e3e6eb;--green:#138a36;--yellow:#ffbf00}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.header-in{max-width:1200px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:22px;font-weight:800;color:#1b2a4a}.back{color:var(--blue);text-decoration:none;font-weight:700}
.wrap{max-width:1200px;margin:18px auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:14px}.steps{display:grid;grid-template-columns:repeat(3,1fr);padding:16px}.step{text-align:center;color:#999;font-size:13px}.step b{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;border:2px solid #cfd5df;margin-bottom:5px}.step.done,.step.active{color:#1c2333;font-weight:700}.step.done b,.step.active b{border-color:var(--blue);color:var(--blue)}
.section-h{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}.addr{padding:16px;display:flex;justify-content:space-between;gap:16px}.addr-main{line-height:1.55}.tag{font-size:11px;background:#edf0f4;padding:4px 7px;border-radius:4px;margin-left:6px}.change{color:var(--blue);font-weight:700;text-decoration:none;white-space:nowrap}
.item{display:grid;grid-template-columns:92px 1fr auto;gap:14px;padding:16px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.thumb{width:92px;height:92px;object-fit:cover;border:1px solid var(--line);border-radius:6px;background:#f6f6f6}.name{font-weight:700;line-height:1.35;margin-bottom:6px}.meta{color:var(--muted);font-size:12px;margin-bottom:8px}.price{font-size:18px;font-weight:800}.qty{margin-top:9px;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:4px;overflow:hidden}.qty button{border:0;background:#f5f5f5;padding:6px 10px}.qty span{padding:6px 11px}.line-total{font-weight:700;white-space:nowrap}
.side{position:sticky;top:82px;align-self:start}.price-row{display:flex;justify-content:space-between;padding:10px 16px;font-size:14px}.price-row.total{border-top:1px solid var(--line);margin-top:4px;padding-top:15px;font-size:17px;font-weight:800}.free{color:var(--green);font-weight:700}.continue{width:calc(100% - 32px);margin:14px 16px 16px;border:0;border-radius:6px;background:var(--yellow);padding:14px;font-size:16px;font-weight:800;cursor:pointer}.continue:disabled{opacity:.6;cursor:not-allowed}.note{font-size:12px;color:var(--muted);padding:0 16px 14px;line-height:1.5}.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:800px){.wrap{grid-template-columns:1fr}.side{position:static}.item{grid-template-columns:76px 1fr}.thumb{width:76px;height:76px}.line-total{grid-column:2}.steps{padding:12px 6px}.addr{flex-direction:column}.change{align-self:flex-start}}
</style>
</head>
<body>
<header class="header"><div class="header-in"><div class="logo">Fashion_Fussion</div><a class="back" href="index.html">← Back to store</a></div></header>
<main class="wrap">
<section>
<div class="card steps"><div class="step done"><b>✓</b><div>Address</div></div><div class="step active"><b>2</b><div>Order Summary</div></div><div class="step"><b>3</b><div>Payment</div></div></div>
<div class="card"><div class="section-h">Delivery Address</div><div id="addressBox" class="empty">Loading address...</div></div>
<div class="card"><div class="section-h">Order Summary</div><div id="itemsBox" class="empty">Loading products...</div></div>
</section>
<aside class="side"><div class="card"><div class="section-h">Price Details</div><div id="priceBox"></div><div class="note">Final amount is securely confirmed by the server before payment.</div><button id="continueBtn" class="continue" disabled>Continue to Payment</button></div></aside>
</main>
<script>
const BACKEND_URL='https://fashion-fussion-olive.vercel.app';const CART_KEY='fashion_fussion_cart';let session=null,products=[],address=null;
const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});
function loadCart(){try{return JSON.parse(localStorage.getItem(CART_KEY)||'{}')||{}}catch{return{}}}let cart=loadCart();
function items(){return Object.entries(cart).map(([id,qty])=>({id:Number(id),qty:Number(qty)})).filter(x=>Number.isInteger(x.id)&&Number.isInteger(x.qty)&&x.qty>0&&x.qty<=20)}
function price(p){const n=Number(p.price);return Number.isFinite(n)&&n>0?n:0}function calc(){let subtotal=0,gst=0;for(const p of products){const q=Number(cart[p.id]||0);const line=price(p)*q;subtotal+=line;gst+=line*.18}const delivery=subtotal<=0?0:subtotal>=299?0:49;return{subtotal,gst,delivery,total:subtotal+gst+delivery}}
function save(){localStorage.setItem(CART_KEY,JSON.stringify(cart));renderItems();renderPrice()}
function renderAddress(){const b=document.getElementById('addressBox');if(!address){b.innerHTML='<div style="color:#b23a2e">No default address selected.</div><a class="change" href="account.html">+ Add / Select Address</a>';return}b.className='addr';b.innerHTML='<div class="addr-main"><div><b>'+esc(address.full_name)+'</b><span class="tag">'+esc(address.label||'Home')+'</span></div><div>'+esc(address.address_line1)+(address.address_line2?', '+esc(address.address_line2):'')+'</div><div>'+esc(address.city)+', '+esc(address.state)+' '+esc(address.postal_code)+'</div><div>'+esc(address.phone)+'</div></div><a class="change" href="account.html">Change</a>'}
function renderItems(){const box=document.getElementById('itemsBox');if(!products.length){box.className='empty';box.innerHTML='No products in cart.';document.getElementById('continueBtn').disabled=true;return}box.className='';box.innerHTML=products.map(p=>{const q=Number(cart[p.id]||0),img=p.image_url||'';return '<div class="item"><img class="thumb" src="'+esc(img)+'" alt="'+esc(p.name)+'"><div><div class="name">'+esc(p.name)+'</div><div class="meta">'+esc(p.category||'')+'</div><div class="price">'+money(price(p))+'</div><div class="qty"><button data-dec="'+p.id+'">−</button><span>'+q+'</span><button data-inc="'+p.id+'">+</button></div></div><div class="line-total">'+money(price(p)*q)+'</div></div>'}).join('');box.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{const id=b.dataset.inc;cart[id]=Math.min(20,Number(cart[id]||0)+1);save()});box.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{const id=b.dataset.dec;const n=Number(cart[id]||0)-1;if(n<=0)delete cart[id];else cart[id]=n;products=products.filter(p=>cart[p.id]);save()});document.getElementById('continueBtn').disabled=!address||!products.length}
function renderPrice(){const c=calc();document.getElementById('priceBox').innerHTML='<div class="price-row"><span>Subtotal</span><span>'+money(c.subtotal)+'</span></div><div class="price-row"><span>GST</span><span>'+money(c.gst)+'</span></div><div class="price-row"><span>Delivery</span><span class="'+(c.delivery===0?'free':'')+'">'+(c.delivery===0?'FREE':money(c.delivery))+'</span></div><div class="price-row total"><span>Total Amount</span><span>'+money(c.total)+'</span></div>'}
async function init(){const{data:{session:s}}=await window.supabaseClient.auth.getSession();session=s;if(!session){location.href='login.html?redirect=checkout';return}const ci=items();if(!ci.length){document.getElementById('itemsBox').innerHTML='Your cart is empty.';renderPrice();return}const ids=ci.map(x=>x.id);const[{data:ps,error:pe},{data:a,error:ae}]=await Promise.all([window.supabaseClient.from('products').select('id,name,category,price,image_url,is_active').in('id',ids).eq('is_active',true),window.supabaseClient.from('customer_addresses').select('*').eq('user_id',session.user.id).eq('is_default',true).limit(1).maybeSingle()]);if(pe)throw pe;if(ae)throw ae;products=(ps||[]).filter(p=>cart[p.id]);address=a||null;renderAddress();renderItems();renderPrice()}
async function pay(){const btn=document.getElementById('continueBtn');btn.disabled=true;btn.textContent='Preparing payment...';try{const{data:profile,error}=await window.supabaseClient.from('profiles').select('full_name,phone').eq('id',session.user.id).maybeSingle();if(error)throw error;const body={items:items(),customer_name:String(profile?.full_name||address?.full_name||'').trim(),customer_phone:String(profile?.phone||address?.phone||'').trim(),shipping_address:address};const r=await fetch(BACKEND_URL+'/api/create-order',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not create order');const opt={key:d.key_id,amount:d.order.amount,currency:d.order.currency||'INR',name:'Fashion_Fussion',description:'Fashion_Fussion order',order_id:d.order.id,prefill:{name:body.customer_name,email:session.user.email||'',contact:body.customer_phone},handler:async pr=>{const vr=await fetch(BACKEND_URL+'/api/verify-payment',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({order_id:d.order.id,razorpay_payment_id:pr.razorpay_payment_id,razorpay_order_id:pr.razorpay_order_id,razorpay_signature:pr.razorpay_signature})});const vd=await vr.json();if(!vr.ok||!vd.verified)throw new Error(vd.error||'Payment verification failed');localStorage.removeItem(CART_KEY);alert('Payment successful!');location.href='account.html'},modal:{ondismiss:()=>{btn.disabled=false;btn.textContent='Continue to Payment'}}};new Razorpay(opt).open()}catch(e){alert(e.message||'Unable to start payment');btn.disabled=false;btn.textContent='Continue to Payment'}}
document.getElementById('continueBtn').onclick=pay;init().catch(e=>{console.error(e);alert('Checkout could not be loaded. Please try again.')});
</script>
</body></html>
