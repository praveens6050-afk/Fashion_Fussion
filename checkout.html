<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Fashion_Fussion</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="https://checkout.razorpay.com/v1/checkout.js"></script><style>
:root{--bg:#f1f3f6;--card:#fff;--ink:#212121;--muted:#777;--blue:#2874f0;--line:#e0e0e0;--green:#138a36;--orange:#fb641b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}.header{background:#fff;border-bottom:1px solid var(--line)}.header-in{max-width:1200px;margin:auto;padding:15px 18px;display:flex;justify-content:space-between}.logo{font-size:22px;font-weight:800;color:#1b2a4a}.back{color:var(--blue);text-decoration:none;font-weight:700}.wrap{max-width:1200px;margin:18px auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px}.card{background:#fff;border:1px solid var(--line);margin-bottom:14px}.section-h{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}.addr{padding:16px;display:flex;justify-content:space-between}.change{color:var(--blue);font-weight:700;text-decoration:none}.item{display:grid;grid-template-columns:92px 1fr auto;gap:14px;padding:16px;border-bottom:1px solid var(--line)}.thumb{width:92px;height:92px;object-fit:contain}.name{font-weight:700}.meta{color:var(--muted);font-size:12px;margin:6px 0}.price{font-size:18px;font-weight:800}.qty{display:inline-flex;margin-top:10px;border:1px solid var(--line)}.qty button,.qty span{border:0;padding:6px 10px;background:#fff}.line-total{font-weight:700}.side{position:sticky;top:18px;align-self:start}.price-row{display:flex;justify-content:space-between;padding:9px 16px;font-size:14px}.price-row.total{border-top:1px solid var(--line);font-size:18px;font-weight:800;padding-top:15px}.saving{color:var(--green);font-weight:700}.promo{padding:14px 16px;border-top:1px solid var(--line)}.promo label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.promo-line{display:flex;gap:7px}.promo input{min-width:0;flex:1;padding:10px;border:1px solid #bbb}.promo button{border:0;background:var(--blue);color:#fff;font-weight:700;padding:0 12px}.promo-msg{font-size:12px;margin-top:7px;color:var(--green)}.continue{width:calc(100% - 32px);margin:14px 16px 16px;border:0;background:var(--orange);color:#fff;padding:14px;font-size:16px;font-weight:800;cursor:pointer}.continue:disabled{opacity:.6}.empty{padding:28px;text-align:center;color:#777}@media(max-width:800px){.wrap{grid-template-columns:1fr}.side{position:static}.item{grid-template-columns:76px 1fr}.thumb{width:76px;height:76px}.line-total{grid-column:2}.addr{flex-direction:column;gap:10px}}
</style></head><body><header class="header"><div class="header-in"><div class="logo">Fashion_Fussion</div><a class="back" href="index.html">← Back to store</a></div></header><main class="wrap"><section><div class="card"><div class="section-h">Delivery Address</div><div id="addressBox" class="empty">Loading address...</div></div><div class="card"><div class="section-h">Order Summary</div><div id="itemsBox" class="empty">Loading products...</div></div></section><aside class="side"><div class="card"><div class="section-h">PRICE DETAILS</div><div id="priceBox"></div><div class="promo"><label>COUPON CODE</label><div class="promo-line"><input id="couponCode" autocomplete="off" placeholder="Enter coupon"><button id="applyCoupon">Apply</button></div><div id="couponMsg" class="promo-msg"></div></div><div class="promo"><label>GIFT CARD</label><div class="promo-line"><input id="giftCode" autocomplete="off" placeholder="Enter gift card code"><button id="applyGift">Apply</button></div><div id="giftMsg" class="promo-msg"></div></div><button id="continueBtn" class="continue" disabled>PLACE ORDER</button></div></aside></main><script>
const BACKEND_URL='https://fashion-fussion-olive.vercel.app',CART_KEY='fashion_fussion_cart';let session=null,products=[],address=null,quote=null,appliedCoupon='',appliedGift='';const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});function loadCart(){try{return JSON.parse(localStorage.getItem(CART_KEY)||'{}')||{}}catch{return{}}}let cart=loadCart();function items(){return Object.entries(cart).map(([id,qty])=>({id:Number(id),qty:Number(qty)})).filter(x=>Number.isInteger(x.id)&&Number.isInteger(x.qty)&&x.qty>0&&x.qty<=20)}function save(){localStorage.setItem(CART_KEY,JSON.stringify(cart));quote=null;renderItems();refreshQuote()}
function renderAddress(){const b=document.getElementById('addressBox');if(!address){b.innerHTML='No default address. <a class="change" href="account.html">Add address</a>';return}b.className='addr';b.innerHTML='<div><b>'+esc(address.full_name)+'</b><br>'+esc(address.address_line1)+(address.address_line2?', '+esc(address.address_line2):'')+'<br>'+esc(address.city)+', '+esc(address.state)+' '+esc(address.postal_code)+'<br>'+esc(address.phone)+'</div><a class="change" href="account.html">CHANGE</a>'}
function renderItems(){const box=document.getElementById('itemsBox');if(!products.length){box.className='empty';box.textContent='Your cart is empty.';return}box.className='';box.innerHTML=products.map(p=>{const q=Number(cart[p.id]||0);return '<div class="item"><img class="thumb" src="'+esc(p.image_url||'')+'"><div><div class="name">'+esc(p.name)+'</div><div class="meta">'+esc(p.category||'')+'</div><div class="price">'+money(p.price)+'</div><div class="qty"><button data-dec="'+p.id+'">−</button><span>'+q+'</span><button data-inc="'+p.id+'">+</button></div></div><div class="line-total">'+money(Number(p.price)*q)+'</div></div>'}).join('');box.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{cart[b.dataset.inc]=Math.min(20,Number(cart[b.dataset.inc]||0)+1);save()});box.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{const id=b.dataset.dec,n=Number(cart[id]||0)-1;if(n<=0){delete cart[id];products=products.filter(p=>cart[p.id])}else cart[id]=n;save()})}
async function getQuote(){const r=await fetch(BACKEND_URL+'/api/quote-order',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({items:items(),coupon_code:appliedCoupon,gift_card_code:appliedGift})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not calculate total');return d}
function renderPrice(){const p=quote?.pricing;if(!p){document.getElementById('priceBox').innerHTML='<div class="price-row"><span>Calculating...</span></div>';return}let h='<div class="price-row"><span>Price</span><span>'+money(p.subtotal)+'</span></div><div class="price-row"><span>GST</span><span>'+money(p.gst)+'</span></div><div class="price-row"><span>Delivery Charges</span><span>'+(p.delivery===0?'<span class="saving">FREE</span>':money(p.delivery))+'</span></div>';if(p.coupon_discount>0)h+='<div class="price-row saving"><span>Coupon Discount</span><span>− '+money(p.coupon_discount)+'</span></div>';if(p.gift_card_discount>0)h+='<div class="price-row saving"><span>Gift Card</span><span>− '+money(p.gift_card_discount)+'</span></div>';h+='<div class="price-row total"><span>Total Amount</span><span>'+money(p.total)+'</span></div>';document.getElementById('priceBox').innerHTML=h}
async function refreshQuote(){const btn=document.getElementById('continueBtn');btn.disabled=true;try{quote=await getQuote();renderPrice();btn.disabled=!address||!products.length}catch(e){quote=null;renderPrice();alert(e.message)}}
async function apply(kind){const input=document.getElementById(kind==='coupon'?'couponCode':'giftCode'),msg=document.getElementById(kind==='coupon'?'couponMsg':'giftMsg'),val=input.value.trim().toUpperCase();if(kind==='coupon')appliedCoupon=val;else appliedGift=val;msg.textContent='Checking...';try{quote=await getQuote();renderPrice();msg.textContent=val?'Applied successfully':'Removed';document.getElementById('continueBtn').disabled=!address||!products.length}catch(e){if(kind==='coupon')appliedCoupon='';else appliedGift='';msg.textContent=e.message;msg.style.color='#c62828';await refreshQuote()}}
async function init(){const{data:{session:s}}=await window.supabaseClient.auth.getSession();session=s;if(!session){location.href='login.html?redirect=checkout';return}const ci=items();if(!ci.length){document.getElementById('itemsBox').textContent='Your cart is empty.';return}const ids=ci.map(x=>x.id);const[{data:ps,error:pe},{data:a,error:ae}]=await Promise.all([window.supabaseClient.from('products').select('id,name,category,price,image_url,is_active').in('id',ids).eq('is_active',true),window.supabaseClient.from('customer_addresses').select('*').eq('user_id',session.user.id).eq('is_default',true).limit(1).maybeSingle()]);if(pe)throw pe;if(ae)throw ae;products=(ps||[]).filter(p=>cart[p.id]);address=a||null;renderAddress();renderItems();await refreshQuote()}
async function pay(){const btn=document.getElementById('continueBtn');btn.disabled=true;btn.textContent='Preparing payment...';try{const{data:profile}=await window.supabaseClient.from('profiles').select('full_name,phone').eq('id',session.user.id).maybeSingle();const body={items:items(),customer_name:String(profile?.full_name||address?.full_name||'').trim(),customer_phone:String(profile?.phone||address?.phone||'').trim(),shipping_address:address,coupon_code:appliedCoupon,gift_card_code:appliedGift};const r=await fetch(BACKEND_URL+'/api/create-order',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not create order');const rz=new Razorpay({key:d.key_id,amount:d.order.amount,currency:d.order.currency||'INR',name:'Fashion_Fussion',order_id:d.order.id,prefill:{name:body.customer_name,email:session.user.email||'',contact:body.customer_phone},handler:async pr=>{const vr=await fetch(BACKEND_URL+'/api/verify-payment',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({order_id:d.order.id,razorpay_payment_id:pr.razorpay_payment_id,razorpay_order_id:pr.razorpay_order_id,razorpay_signature:pr.razorpay_signature})}),vd=await vr.json();if(!vr.ok||!vd.verified)throw new Error(vd.error||'Payment verification failed');localStorage.removeItem(CART_KEY);location.href='order-details.html?id='+encodeURIComponent(vd.store_order_id||d.store_order_id)},modal:{ondismiss:()=>{btn.disabled=false;btn.textContent='PLACE ORDER'}}});rz.open()}catch(e){alert(e.message||'Unable to start payment');btn.disabled=false;btn.textContent='PLACE ORDER'}}
document.getElementById('applyCoupon').onclick=()=>apply('coupon');document.getElementById('applyGift').onclick=()=>apply('gift');document.getElementById('continueBtn').onclick=pay;init().catch(e=>{console.error(e);alert('Checkout could not be loaded.')});
</script></body></html>
