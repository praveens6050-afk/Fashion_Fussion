<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout | Fashion_Fussion</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="supabase-config.js?v=20260910-cutover1"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
:root{--bg:#f1f3f6;--card:#fff;--ink:#212121;--muted:#777;--blue:#2874f0;--line:#e0e0e0;--green:#138a36;--orange:#fb641b;--red:#c62828}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}.header{background:#fff;border-bottom:1px solid var(--line)}.header-in{max-width:1200px;margin:auto;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:800;color:#1b2a4a}.back{color:var(--blue);text-decoration:none;font-weight:700}.wrap{max-width:1200px;margin:18px auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px}.card{background:#fff;border:1px solid var(--line);margin-bottom:14px;border-radius:6px;overflow:hidden}.section-h{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}.addr{padding:16px;display:flex;justify-content:space-between;gap:16px}.change{color:var(--blue);font-weight:700;text-decoration:none}.item{display:grid;grid-template-columns:92px 1fr auto;gap:14px;padding:16px;border-bottom:1px solid var(--line)}.thumb,.thumb-fallback{width:92px;height:92px;object-fit:contain;border:1px solid #eee;background:#fafafa}.thumb-fallback{display:grid;place-items:center;text-align:center;font-size:11px;color:#888}.name{font-weight:700}.meta{color:var(--muted);font-size:12px;margin:6px 0}.price{font-size:18px;font-weight:800}.qty{display:inline-flex;margin-top:10px;border:1px solid var(--line)}.qty button,.qty span{border:0;padding:6px 10px;background:#fff}.line-total{font-weight:700}.side{position:sticky;top:18px;align-self:start}.price-row{display:flex;justify-content:space-between;gap:12px;padding:9px 16px;font-size:14px}.price-row.total{border-top:1px solid var(--line);font-size:18px;font-weight:800;padding-top:15px}.saving{color:var(--green);font-weight:700}.danger{color:var(--red);font-weight:700}.promo{padding:14px 16px;border-top:1px solid var(--line)}.promo label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.promo-line{display:flex;gap:7px}.promo input{min-width:0;flex:1;padding:10px;border:1px solid #bbb}.promo button{border:0;background:var(--blue);color:#fff;font-weight:700;padding:0 12px}.promo-msg{font-size:12px;margin-top:7px;color:var(--green)}.payments{padding:14px 16px;border-top:1px solid var(--line)}.payments h3{font-size:13px;margin:0 0 10px}.pay-option{display:block;border:1px solid var(--line);border-radius:6px;padding:12px;margin:8px 0;cursor:pointer}.pay-option:has(input:checked){border-color:var(--blue);background:#f6f9ff}.pay-option input{margin-right:8px}.pay-title{font-weight:700}.pay-note{font-size:12px;color:var(--muted);margin:5px 0 0 24px;line-height:1.45}.continue{width:calc(100% - 32px);margin:14px 16px 16px;border:0;background:var(--orange);color:#fff;padding:14px;font-size:16px;font-weight:800;cursor:pointer}.continue:disabled{opacity:.6}.empty{padding:28px;text-align:center;color:#777}.status{margin:0 16px 16px;padding:11px 12px;border-radius:5px;font-size:13px;display:none}.status.show{display:block}.status.error{background:#ffebee;color:#b71c1c}.status.ok{background:#e8f5e9;color:#1b5e20}@media(max-width:800px){.wrap{grid-template-columns:1fr}.side{position:static}.item{grid-template-columns:76px 1fr}.thumb,.thumb-fallback{width:76px;height:76px}.line-total{grid-column:2}.addr{flex-direction:column}}
</style>
</head>
<body>
<header class="header"><div class="header-in"><div class="logo">Fashion_Fussion</div><a class="back" href="index.html">← Back to store</a></div></header>
<main class="wrap">
<section>
<div class="card"><div class="section-h">Delivery Address</div><div id="addressBox" class="empty">Loading address...</div></div>
<div class="card"><div class="section-h">Order Summary</div><div id="itemsBox" class="empty">Loading products...</div></div>
</section>
<aside class="side"><div class="card">
<div class="section-h">PRICE DETAILS</div><div id="priceBox"></div>
<div class="promo"><label>COUPON CODE</label><div class="promo-line"><input id="couponCode" autocomplete="off" placeholder="Enter coupon"><button id="applyCoupon" type="button">Apply</button></div><div id="couponMsg" class="promo-msg"></div></div>
<div class="promo"><label>GIFT CARD</label><div class="promo-line"><input id="giftCode" autocomplete="off" placeholder="Enter gift card code"><button id="applyGift" type="button">Apply</button></div><div id="giftMsg" class="promo-msg"></div></div>
<div class="payments"><h3>PAYMENT METHOD</h3>
<label class="pay-option"><input type="radio" name="paymentMethod" value="prepaid" checked><span class="pay-title">Prepaid</span><div class="pay-note">₹49 payment handling charge is fully discounted on prepaid orders.</div></label>
<label class="pay-option"><input type="radio" name="paymentMethod" value="cod"><span class="pay-title">Cash on Delivery</span><div class="pay-note">₹49 COD charge applies and is non-refundable.</div></label>
</div>
<button id="continueBtn" class="continue" disabled>PAY SECURELY</button><div id="checkoutStatus" class="status"></div>
</div></aside>
</main>
<script>
'use strict';
const BACKEND_URL='https://fashion-fussion-olive.vercel.app';
const CART_KEY='fashion_fussion_cart';
const CHECKOUT_KEY='fashion_fussion_checkout_key';
let session=null,products=[],address=null,quote=null,appliedCoupon='',appliedGift='',refreshSeq=0;
const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2});
function paymentMethod(){return document.querySelector('input[name="paymentMethod"]:checked')?.value||'prepaid'}
function loadCart(){try{return JSON.parse(localStorage.getItem(CART_KEY)||'{}')||{}}catch{return{}}}
let cart=loadCart();
function items(){return Object.entries(cart).map(([id,qty])=>({id:Number(id),qty:Number(qty)})).filter(x=>Number.isInteger(x.id)&&Number.isInteger(x.qty)&&x.qty>0&&x.qty<=20)}
function newCheckoutKey(){const id=globalThis.crypto?.randomUUID?.()||('ff_'+Date.now()+'_'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2));sessionStorage.setItem(CHECKOUT_KEY,id);return id}
function checkoutKey(){return sessionStorage.getItem(CHECKOUT_KEY)||newCheckoutKey()}
function clearCompletedCheckout(){localStorage.removeItem(CART_KEY);sessionStorage.removeItem(CHECKOUT_KEY)}
function setStatus(message,type='error'){const el=document.getElementById('checkoutStatus');el.textContent=message||'';el.className='status'+(message?' show '+type:'')}
function saveCart(){localStorage.setItem(CART_KEY,JSON.stringify(cart));quote=null;renderItems();refreshQuote()}
function renderAddress(){const b=document.getElementById('addressBox');if(!address){b.className='empty';b.innerHTML='No default address. <a class="change" href="account.html#addresses">Add address</a>';return}b.className='addr';b.innerHTML='<div><b>'+esc(address.full_name)+'</b><br>'+esc(address.address_line1)+(address.address_line2?', '+esc(address.address_line2):'')+'<br>'+esc(address.city)+', '+esc(address.state)+' '+esc(address.postal_code)+'<br>'+esc(address.phone)+'</div><a class="change" href="account.html#addresses">CHANGE</a>'}
function imageMarkup(p){return p.image_url?'<img class="thumb" src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;thumb-fallback&quot;>Image unavailable</div>\'">':'<div class="thumb-fallback">Image unavailable</div>'}
function renderItems(){const box=document.getElementById('itemsBox');if(!products.length){box.className='empty';box.textContent='Your cart is empty.';return}box.className='';box.innerHTML=products.map(p=>{const q=Number(cart[p.id]||0);return '<div class="item">'+imageMarkup(p)+'<div><div class="name">'+esc(p.name)+'</div><div class="meta">'+esc(p.category||'')+'</div><div class="price">'+money(p.price)+'</div><div class="qty"><button type="button" data-dec="'+p.id+'">−</button><span>'+q+'</span><button type="button" data-inc="'+p.id+'">+</button></div></div><div class="line-total">'+money(Number(p.price)*q)+'</div></div>'}).join('');box.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{cart[b.dataset.inc]=Math.min(20,Number(cart[b.dataset.inc]||0)+1);newCheckoutKey();saveCart()});box.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{const id=b.dataset.dec,n=Number(cart[id]||0)-1;if(n<=0){delete cart[id];products=products.filter(p=>cart[p.id])}else cart[id]=n;newCheckoutKey();saveCart()})}
async function api(path,body){const{data:{session:fresh},error:sessionError}=await window.supabaseClient.auth.getSession();if(sessionError||!fresh?.access_token)throw new Error('Your login session has expired. Please log in again.');session=fresh;const r=await fetch(BACKEND_URL+path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+fresh.access_token},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||'Request failed');e.data=d;e.status=r.status;throw e}return d}
async function getQuote(){return api('/api/quote-order',{items:items(),coupon_code:appliedCoupon,gift_card_code:appliedGift,payment_method:paymentMethod()})}
function renderPrice(){const p=quote?.pricing;if(!p){document.getElementById('priceBox').innerHTML='<div class="price-row"><span>Calculating...</span></div>';return}let h='<div class="price-row"><span>Price</span><span>'+money(p.subtotal)+'</span></div><div class="price-row"><span>GST</span><span>'+money(p.gst)+'</span></div><div class="price-row"><span>Delivery Charges</span><span>'+(Number(p.delivery)===0?'<span class="saving">FREE</span>':money(p.delivery))+'</span></div>';if(Number(p.coupon_discount)>0)h+='<div class="price-row saving"><span>Coupon Discount</span><span>− '+money(p.coupon_discount)+'</span></div>';if(Number(p.gift_card_discount)>0)h+='<div class="price-row saving"><span>Gift Card</span><span>− '+money(p.gift_card_discount)+'</span></div>';if(Number(p.payment_handling_fee)>0)h+='<div class="price-row"><span>Payment Handling</span><span>+ '+money(p.payment_handling_fee)+'</span></div>';if(Number(p.prepaid_discount)>0)h+='<div class="price-row saving"><span>Prepaid Discount</span><span>− '+money(p.prepaid_discount)+'</span></div>';if(p.payment_method==='cod')h+='<div class="price-row danger"><span>COD Charge</span><span>Non-refundable</span></div>';h+='<div class="price-row total"><span>Total Amount</span><span>'+money(p.total)+'</span></div>';document.getElementById('priceBox').innerHTML=h}
function syncButton(){const btn=document.getElementById('continueBtn');btn.textContent=paymentMethod()==='cod'?'PLACE COD ORDER':'PAY SECURELY';btn.disabled=!quote||!address||!products.length}
async function refreshQuote(){const seq=++refreshSeq;const btn=document.getElementById('continueBtn');btn.disabled=true;setStatus('');try{const q=await getQuote();if(seq!==refreshSeq)return;quote=q;renderPrice();syncButton()}catch(e){if(seq!==refreshSeq)return;quote=null;renderPrice();setStatus(e.message);syncButton()}}
async function apply(kind){const input=document.getElementById(kind==='coupon'?'couponCode':'giftCode'),msg=document.getElementById(kind==='coupon'?'couponMsg':'giftMsg'),val=input.value.trim().toUpperCase();if(kind==='coupon')appliedCoupon=val;else appliedGift=val;newCheckoutKey();msg.textContent='Checking...';msg.style.color='';try{quote=await getQuote();renderPrice();msg.textContent=val?'Applied successfully':'Removed';syncButton()}catch(e){if(kind==='coupon')appliedCoupon='';else appliedGift='';msg.textContent=e.message;msg.style.color='#c62828';await refreshQuote()}}
async function reconcile(storeOrderId){for(let attempt=0;attempt<3;attempt++){await new Promise(r=>setTimeout(r,1200*(attempt+1)));try{const d=await api('/api/reconcile-payment',{store_order_id:storeOrderId});if(d.reconciled&&d.status==='paid')return d}catch(e){console.error('Reconcile attempt failed',e)}}return null}
function finish(storeOrderId){clearCompletedCheckout();location.href='order-details.html?id='+encodeURIComponent(storeOrderId)}
async function handleRazorpay(d,body,btn){const rz=new Razorpay({key:d.key_id,amount:d.order.amount,currency:d.order.currency||'INR',name:'Fashion_Fussion',description:'Secure prepaid order',order_id:d.order.id,prefill:{name:body.customer_name,email:session.user.email||'',contact:body.customer_phone},handler:async pr=>{btn.disabled=true;btn.textContent='Confirming payment...';setStatus('Payment received. Confirming your order…','ok');try{const vd=await api('/api/verify-payment',{order_id:d.order.id,razorpay_payment_id:pr.razorpay_payment_id,razorpay_order_id:pr.razorpay_order_id,razorpay_signature:pr.razorpay_signature});if(vd.verified){finish(vd.store_order_id||d.store_order_id);return}}catch(e){console.error('Payment verification callback failed',e);if(e.data?.captured||e.data?.recoverable){setStatus('Payment captured. We are reconciling your order automatically. Do not pay again.','ok');const recovered=await reconcile(d.store_order_id);if(recovered){finish(recovered.store_order_id||d.store_order_id);return}setStatus('Payment is captured and safe. Open My Orders shortly; do not pay again.','ok');location.href='account.html#orders';return}setStatus(e.message||'Payment verification failed. Please check My Orders before retrying.')}btn.disabled=false;syncButton()},modal:{ondismiss:()=>{setStatus('Payment window closed. No new payment was recorded.');syncButton()}}});rz.on('payment.failed',response=>{setStatus(response?.error?.description||'Payment failed. You can try prepaid again or choose COD.');syncButton()});rz.open()}
async function pay(){const btn=document.getElementById('continueBtn');if(!quote||!address)return;btn.disabled=true;btn.textContent='Preparing order...';setStatus('');try{const{data:profile,error}=await window.supabaseClient.from('profiles').select('full_name,phone').eq('id',session.user.id).maybeSingle();if(error)throw error;const body={checkout_key:checkoutKey(),items:items(),customer_name:String(profile?.full_name||address?.full_name||'').trim(),customer_phone:String(profile?.phone||address?.phone||'').trim(),shipping_address:{id:address.id},coupon_code:appliedCoupon,gift_card_code:appliedGift,payment_method:paymentMethod()};const d=await api('/api/create-order',body);if(d.completed){setStatus(d.payment_method==='cod'?'COD order placed successfully. ₹49 COD charge is non-refundable.':'Order placed successfully.','ok');finish(d.store_order_id);return}if(d.idempotent&&d.completed){finish(d.store_order_id);return}if(!d.order?.id||!d.key_id)throw new Error('Payment order could not be prepared.');await handleRazorpay(d,body,btn)}catch(e){console.error(e);setStatus(e.message||'Unable to start checkout');syncButton()}}
async function init(){const{data:{session:s},error}=await window.supabaseClient.auth.getSession();if(error)throw error;session=s;if(!session){location.href='login.html?redirect=checkout';return}const ci=items();if(!ci.length){document.getElementById('itemsBox').textContent='Your cart is empty.';return}const ids=ci.map(x=>x.id);const[{data:ps,error:pe},{data:a,error:ae}]=await Promise.all([window.supabaseClient.from('products').select('id,name,category,price,image_url,is_active').in('id',ids).eq('is_active',true),window.supabaseClient.from('customer_addresses').select('id,label,full_name,phone,address_line1,address_line2,city,state,postal_code,country,is_default').eq('user_id',session.user.id).eq('is_default',true).limit(1).maybeSingle()]);if(pe)throw pe;if(ae)throw ae;products=(ps||[]).filter(p=>cart[p.id]);address=a||null;renderAddress();renderItems();await refreshQuote()}
document.getElementById('applyCoupon').onclick=()=>apply('coupon');document.getElementById('applyGift').onclick=()=>apply('gift');document.getElementById('continueBtn').onclick=pay;document.querySelectorAll('input[name="paymentMethod"]').forEach(r=>r.addEventListener('change',()=>{newCheckoutKey();refreshQuote()}));init().catch(e=>{console.error(e);setStatus('Checkout could not be loaded. '+(e.message||''))});
</script>
</body>
</html>
