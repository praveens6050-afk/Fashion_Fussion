<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping Cart | Fashion_Fussion</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f1f3f6;font-family:Arial,sans-serif;color:#212121}.top{height:58px;background:#2874f0;color:white}.topin{max-width:1200px;height:100%;margin:auto;padding:0 18px;display:flex;align-items:center;gap:28px}.logo{font-size:21px;font-weight:800}.search{flex:1;max-width:560px;background:#fff;border-radius:2px;padding:11px 14px;color:#777}.back{color:#fff;text-decoration:none;font-weight:700}.wrap{max-width:1200px;margin:16px auto;padding:0 14px;display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px}.card{background:#fff;box-shadow:0 1px 2px #ddd;margin-bottom:14px}.addr{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px}.addr b{font-size:14px}.tag{background:#f0f2f5;color:#777;font-size:11px;padding:3px 7px;margin-left:7px}.muted{color:#777;font-size:12px;margin-top:5px}.change{border:1px solid #e0e0e0;background:#fff;color:#2874f0;font-weight:700;padding:9px 18px;text-decoration:none}.item{display:grid;grid-template-columns:120px 1fr;gap:18px;padding:22px 20px;border-bottom:1px solid #eee}.pic,.pic-fallback{width:112px;height:112px;object-fit:contain;border:1px solid #eee;background:#fafafa}.pic-fallback{display:grid;place-items:center;text-align:center;color:#888;font-size:11px}.name{font-size:16px;margin-bottom:8px}.seller{font-size:12px;color:#878787;margin-bottom:12px}.price{font-size:18px;font-weight:700}.controls{grid-column:1/-1;display:flex;align-items:center;gap:12px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:28px;height:28px;border-radius:50%;border:1px solid #c9c9c9;background:#fff;font-size:18px}.qty span{border:1px solid #c9c9c9;min-width:45px;text-align:center;padding:5px}.remove{border:0;background:none;font-weight:700;cursor:pointer}.placebar{padding:16px;display:flex;justify-content:flex-end;position:sticky;bottom:0;background:#fff;box-shadow:0 -2px 10px #ddd}.place{background:#fb641b;color:#fff;border:0;padding:16px 58px;font-weight:800;font-size:15px;cursor:pointer}.side{position:sticky;top:16px;align-self:start}.heading{padding:16px 20px;border-bottom:1px solid #eee;color:#878787;font-weight:700}.row{display:flex;justify-content:space-between;padding:10px 20px;font-size:14px}.total{border-top:1px dashed #ddd;border-bottom:1px dashed #ddd;margin:8px 0;padding:17px 20px;font-size:18px;font-weight:800}.green{color:#388e3c}.saving{padding:15px 20px;color:#388e3c;font-weight:700;font-size:14px}.secure{color:#878787;font-weight:700;font-size:13px;padding:18px;line-height:1.5}.empty{text-align:center;padding:50px 20px}.empty a{color:#2874f0}@media(max-width:800px){.search{display:none}.wrap{grid-template-columns:1fr}.side{position:static}.item{grid-template-columns:85px 1fr}.pic,.pic-fallback{width:82px;height:82px}.place{width:100%}.placebar{padding:10px}.topin{justify-content:space-between}}</style></head><body><header class="top"><div class="topin"><div class="logo">Fashion_Fussion</div><div class="search">Secure shopping cart</div><a class="back" href="index.html">Continue Shopping</a></div></header><main class="wrap"><section><div class="card" id="address"><div class="addr">Loading delivery address...</div></div><div class="card" id="cart"><div class="empty">Loading cart...</div></div><div class="card placebar"><button class="place" id="place" disabled>PLACE ORDER</button></div></section><aside class="side"><div class="card"><div class="heading">PRICE DETAILS</div><div id="prices"></div></div><div class="secure">🔒 Final price, offers and payment-method charges are verified by the server at checkout.</div></aside></main><script>'use strict';const KEY='fashion_fussion_cart';let cart={},products=[];const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});function load(){try{cart=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{cart={}}}function save(){localStorage.setItem(KEY,JSON.stringify(cart));sessionStorage.removeItem('fashion_fussion_checkout_key')}function totals(){let subtotal=0,gst=0,count=0;products.forEach(p=>{const q=Number(cart[p.id]||0),v=Number(p.price||0)*q,rate=Number(p.gst_rate||0);subtotal+=v;gst+=v*rate/100;count+=q});const delivery=subtotal?subtotal>=299?0:49:0;return{subtotal,gst,delivery,total:subtotal+gst+delivery,count}}function renderPrices(){const t=totals();document.getElementById('prices').innerHTML='<div class="row"><span>Price ('+t.count+' items)</span><span>'+money(t.subtotal)+'</span></div><div class="row"><span>GST</span><span>'+money(t.gst)+'</span></div><div class="row"><span>Delivery Charges</span><span class="'+(!t.delivery?'green':'')+'">'+(!t.delivery?'FREE':money(t.delivery))+'</span></div><div class="row total"><span>Estimated Total</span><span>'+money(t.total)+'</span></div>'+(t.delivery===0&&t.subtotal?'<div class="saving">You saved ₹49 on delivery</div>':'')}function image(p){return p.image_url?'<img class="pic" src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'" onerror="this.outerHTML=\'<div class=&quot;pic-fallback&quot;>Image unavailable</div>\'">':'<div class="pic-fallback">Image unavailable</div>'}function render(){products=products.filter(p=>Number(cart[p.id]||0)>0);const box=document.getElementById('cart');if(!products.length){box.innerHTML='<div class="empty"><h3>Your cart is empty!</h3><p>Add items to it now.</p><a href="index.html">Shop now</a></div>';document.getElementById('place').disabled=true;renderPrices();return}box.innerHTML=products.map(p=>'<div class="item">'+image(p)+'<div><div class="name">'+esc(p.name)+'</div><div class="seller">'+esc(p.category||'Fashion_Fussion')+'</div><div class="price">'+money(p.price)+'</div><div class="muted">GST '+Number(p.gst_rate||0)+'%</div></div><div class="controls"><div class="qty"><button type="button" data-dec="'+p.id+'">−</button><span>'+Number(cart[p.id])+'</span><button type="button" data-inc="'+p.id+'">+</button></div><button type="button" class="remove" data-remove="'+p.id+'">REMOVE</button></div></div>').join('');box.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>change(b.dataset.inc,1));box.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>change(b.dataset.dec,-1));box.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>remove(b.dataset.remove));document.getElementById('place').disabled=false;renderPrices()}function change(id,d){const n=Math.max(0,Math.min(20,Number(cart[id]||0)+d));if(!n)delete cart[id];else cart[id]=n;save();render()}function remove(id){delete cart[id];save();render()}async function init(){load();const ids=Object.keys(cart).map(Number).filter(Number.isInteger);if(ids.length){const{data,error}=await window.supabaseClient.from('products').select('id,name,category,price,image_url,gst_rate,is_active').in('id',ids).eq('is_active',true);if(error)throw error;products=data||[]}const{data:{session}}=await window.supabaseClient.auth.getSession();const a=document.getElementById('address');if(session){const{data:addr}=await window.supabaseClient.from('customer_addresses').select('id,label,full_name,postal_code,address_line1,city,state').eq('user_id',session.user.id).eq('is_default',true).limit(1).maybeSingle();a.innerHTML=addr?'<div class="addr"><div><b>Deliver to: '+esc(addr.full_name)+', '+esc(addr.postal_code)+'</b><span class="tag">'+esc(addr.label||'Home')+'</span><div class="muted">'+esc(addr.address_line1)+', '+esc(addr.city)+', '+esc(addr.state)+'</div></div><a class="change" href="account.html#addresses">Change</a></div>':'<div class="addr"><div><b>Add a delivery address</b></div><a class="change" href="account.html#addresses">Add Address</a></div>'}else a.innerHTML='<div class="addr"><b>Login to select your delivery address</b><a class="change" href="login.html?redirect=checkout">Login</a></div>';render()}document.getElementById('place').onclick=()=>location.href='checkout.html';init().catch(e=>{console.error(e);document.getElementById('cart').innerHTML='<div class="empty">Cart could not be loaded.</div>'});</script></body></html>
