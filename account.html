<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Account | Fashion_Fussion</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="supabase-config.js"></script>
<style>
:root{--navy:#111827;--brand:#5b3df5;--brand2:#472bd7;--bg:#f6f7fb;--card:#fff;--ink:#171a22;--muted:#697386;--line:#e5e7eb;--green:#118344;--greenbg:#edf9f1;--red:#b42318;--redbg:#fff0ef;--amber:#9a6700;--amberbg:#fff8dc;--shadow:0 8px 30px rgba(17,24,39,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}a{color:inherit;text-decoration:none}button,input{font:inherit}.top{background:var(--navy);color:#fff}.topin{max-width:1320px;height:72px;margin:auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:24px}.logo{font-size:23px;font-weight:900;letter-spacing:-.7px}.topnav{display:flex;gap:20px;align-items:center;font-size:13px}.topnav a,.topnav button{color:#e8eaf0;background:none;border:0;cursor:pointer}.subbar{background:#fff;border-bottom:1px solid var(--line)}.subin{max-width:1320px;margin:auto;padding:13px 28px;font-size:13px;color:var(--muted)}.wrap{max-width:1320px;margin:26px auto 54px;padding:0 28px}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start}.side{position:sticky;top:18px}.profile-mini,.menu,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.profile-mini{padding:18px;display:flex;align-items:center;gap:13px;margin-bottom:14px}.avatar{width:48px;height:48px;border-radius:50%;background:#efedff;color:var(--brand);display:grid;place-items:center;font-weight:900;font-size:19px}.hello{font-size:11px;color:var(--muted)}.mini-name{font-size:15px;font-weight:900;margin-top:3px}.menu{overflow:hidden}.menu button{width:100%;border:0;background:#fff;text-align:left;padding:14px 16px;font-size:13px;cursor:pointer;border-left:3px solid transparent}.menu button:hover{background:#fafbfc}.menu button.active{background:#f3f1ff;color:var(--brand);font-weight:900;border-left-color:var(--brand)}.menu .danger{color:var(--red);border-top:1px solid var(--line)}.main-title{margin-bottom:18px}.main-title h1{font-size:28px;letter-spacing:-.6px;margin:0 0 7px}.main-title p{margin:0;color:var(--muted);font-size:13px}.panel{overflow:hidden;margin-bottom:18px}.panel-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}.panel-head h2{font-size:15px;margin:0}.panel-body{padding:20px}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:900;color:#4f5663;margin-bottom:7px}.field input{width:100%;border:1px solid #d7dbe3;border-radius:9px;padding:11px 12px;outline:none}.field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #efedff}.field input[readonly]{background:#f8f9fb;color:#737b89}.actions{display:flex;justify-content:flex-end;margin-top:16px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 14px;font-weight:900;font-size:12px;cursor:pointer}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.primary:hover{background:var(--brand2)}.btn.danger{color:var(--red);border-color:#efc8c4;background:#fffafa}.btn:disabled{opacity:.5;cursor:not-allowed}.alert{padding:10px 12px;border-radius:8px;font-size:12px;margin-top:14px}.success{background:var(--greenbg);color:var(--green)}.error{background:var(--redbg);color:var(--red)}.orders{display:flex;flex-direction:column;gap:14px}.order{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.order-head{padding:13px 16px;background:#fafbfc;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:18px;align-items:center}.order-meta{display:flex;gap:30px;align-items:center}.meta-label{font-size:10px;text-transform:uppercase;color:#8a91a0;font-weight:900}.meta-value{font-size:12px;font-weight:800;margin-top:3px}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900;text-transform:uppercase;background:#efedff;color:var(--brand)}.badge.good{background:var(--greenbg);color:var(--green)}.badge.warn{background:var(--amberbg);color:var(--amber)}.badge.bad{background:var(--redbg);color:var(--red)}.order-body{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;padding:16px}.itemrow{display:grid;grid-template-columns:82px minmax(0,1fr);gap:14px;align-items:center}.itemrow+.itemrow{margin-top:12px;padding-top:12px;border-top:1px solid #eef0f3}.itemrow img,.fallback{width:82px;height:82px;object-fit:contain;border:1px solid #eceef2;border-radius:9px;background:#fafafa}.fallback{display:grid;place-items:center;text-align:center;color:#8b93a3;font-size:10px;padding:8px}.pname{font-size:14px;font-weight:900;margin-bottom:5px}.muted{font-size:11px;color:var(--muted);line-height:1.55}.order-total{text-align:right;font-size:16px;font-weight:900}.order-actions{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:#fff}.empty{padding:46px 20px;text-align:center;color:var(--muted);font-size:13px}.loading{min-height:55vh;display:grid;place-items:center;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}.menu{display:flex}.menu button{width:auto}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.order-body{grid-template-columns:1fr}.order-total{text-align:left}.order-meta{gap:16px;flex-wrap:wrap}}
</style>
</head>
<body>
<header class="top"><div class="topin"><a class="logo" href="index.html">Fashion_Fussion</a><nav class="topnav"><a href="index.html">Store</a><a href="cart.html">Cart</a><button id="topLogout" type="button">Sign out</button></nav></div></header>
<div class="subbar"><div class="subin">Home &nbsp;›&nbsp; My Account</div></div>
<div id="loading" class="loading">Loading your account…</div>
<main id="app" class="wrap" hidden>
<div class="layout">
<aside class="side"><div class="profile-mini"><div class="avatar" id="avatar">U</div><div><div class="hello">Hello,</div><div class="mini-name" id="miniName">Customer</div></div></div><div class="menu"><button class="active" data-view="orders">My Orders</button><button data-view="profile">Profile</button><button data-view="refunds">Payments & Refunds</button><button class="danger" id="menuLogout" type="button">Sign out</button></div></aside>
<section>
<div class="main-title"><h1 id="viewTitle">My Orders</h1><p id="viewSub">Track purchases, delivery progress, cancellations and refunds.</p></div>
<div id="ordersView" class="view active"><div class="panel"><div class="panel-head"><h2>Your orders</h2><button class="btn" id="refreshOrders" type="button">↻ Refresh</button></div><div class="panel-body"><div id="ordersList" class="orders"><div class="empty">Loading orders…</div></div></div></div></div>
<div id="profileView" class="view"><div class="panel"><div class="panel-head"><h2>Profile information</h2><button class="btn" id="editProfile" type="button">Edit</button></div><div class="panel-body"><form id="profileForm"><div class="grid"><div class="field"><label for="fullName">Full name</label><input id="fullName" maxlength="100" autocomplete="name"></div><div class="field"><label for="phone">Phone</label><input id="phone" maxlength="20" autocomplete="tel"></div><div class="field full"><label for="email">Email</label><input id="email" readonly></div></div><div id="profileStatus"></div><div class="actions"><button id="saveProfile" class="btn primary" type="submit">Save profile</button></div></form></div></div></div>
<div id="refundsView" class="view"><div class="panel"><div class="panel-head"><h2>Payments & refunds</h2></div><div class="panel-body"><div id="refundsList" class="orders"><div class="empty">Refund activity from your orders will appear here.</div></div></div></div></div>
</section>
</div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c])),money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});let currentUser=null,ordersCache=[];
function statusInfo(o){const s=String(o.status||'').toLowerCase(),f=String(o.fulfillment_status||'ordered').toLowerCase();if(s==='refunded')return['Refunded','good'];if(s==='refund_failed')return['Refund failed','bad'];if(['refund_pending','refund_initiated'].includes(s))return['Refund in progress','warn'];if(['cancelled','cod_cancelled'].includes(s)||f==='cancelled')return['Cancelled','bad'];if(f==='delivered')return['Delivered','good'];if(f==='out_for_delivery')return['Out for delivery','warn'];if(f==='shipped')return['Shipped','warn'];if(f==='packed')return['Packed',''];return['Order placed','']}
function fmtDate(v){const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}
function image(x){return x.image_url?'<img src="'+esc(x.image_url)+'" alt="'+esc(x.name||'Product')+'" onerror="this.outerHTML=\'<div class=&quot;fallback&quot;>Image unavailable</div>\'">':'<div class="fallback">Image unavailable</div>'}
function canCancel(o){const s=String(o.status||'').toLowerCase(),f=String(o.fulfillment_status||'ordered').toLowerCase();if(!['ordered','packed'].includes(f))return false;if(o.payment_method==='cod')return s==='cod_pending';return o.payment_method==='prepaid'&&s==='paid'&&Number(o.gift_card_discount||0)===0}
function orderCard(o){const items=Array.isArray(o.items)?o.items:[],st=statusInfo(o),display=o.display_order_id||o.id,itemHtml=(items.slice(0,3).map(x=>'<div class="itemrow">'+image(x)+'<div><div class="pname">'+esc(x.name||'Product')+'</div><div class="muted">Qty '+esc(x.qty||x.quantity||1)+(x.category?' · '+esc(x.category):'')+(x.gst_rate!=null?' · GST '+esc(x.gst_rate)+'%':'')+'</div></div></div>').join('')||'<div class="muted">Order item details unavailable.</div>')+(items.length>3?'<div class="muted" style="margin-top:10px">+'+(items.length-3)+' more item(s)</div>':'');return '<article class="order"><div class="order-head"><div class="order-meta"><div><div class="meta-label">Order</div><div class="meta-value">#'+esc(display)+'</div></div><div><div class="meta-label">Placed</div><div class="meta-value">'+esc(fmtDate(o.created_at))+'</div></div><div><div class="meta-label">Payment</div><div class="meta-value">'+esc(o.payment_method==='cod'?'Cash on Delivery':'Online payment')+'</div></div></div><span class="badge '+st[1]+'">'+esc(st[0])+'</span></div><div class="order-body"><div>'+itemHtml+'</div><div class="order-total">'+money(o.total_amount)+'</div></div><div class="order-actions"><a class="btn primary" href="order-details.html?id='+encodeURIComponent(o.id)+'">View details</a><a class="btn" href="order-details.html?id='+encodeURIComponent(o.id)+'#tracking">Track order</a>'+(canCancel(o)?'<a class="btn danger" href="order-details.html?id='+encodeURIComponent(o.id)+'#cancel">Cancel order</a>':'')+'<a class="btn" href="order-details.html?id='+encodeURIComponent(o.id)+'#help">Need help</a></div></article>'}
function renderOrders(){const box=$('ordersList');if(!ordersCache.length){box.innerHTML='<div class="empty">You have not placed any orders yet.<br><br><a class="btn primary" href="index.html">Continue shopping</a></div>';return}box.innerHTML=ordersCache.map(orderCard).join('');renderRefunds()}
function renderRefunds(){const list=ordersCache.filter(o=>['refund_pending','refund_initiated','refund_failed','refunded'].includes(String(o.status||'').toLowerCase())),box=$('refundsList');if(!list.length){box.innerHTML='<div class="empty">No refund activity yet.</div>';return}box.innerHTML=list.map(o=>orderCard(o)).join('')}
async function loadOrders(){const box=$('ordersList');box.innerHTML='<div class="empty">Loading orders…</div>';const{data,error}=await supabaseClient.from('orders').select('id,display_order_id,total_amount,currency,status,payment_method,fulfillment_status,created_at,items,gift_card_discount').eq('user_id',currentUser.id).order('created_at',{ascending:false});if(error)throw error;ordersCache=data||[];renderOrders()}
async function loadProfile(){const{data,error}=await supabaseClient.from('profiles').select('id,full_name,phone').eq('id',currentUser.id).maybeSingle();if(error)throw error;localStorage.removeItem('customer_name');localStorage.removeItem('customer_phone');$('fullName').value=data?.full_name||'';$('phone').value=data?.phone||'';$('email').value=currentUser.email||'';syncName();lockProfile()}
function syncName(){const n=$('fullName').value.trim()||'Customer';$('miniName').textContent=n;$('avatar').textContent=(n[0]||'U').toUpperCase()}
function lockProfile(){ $('fullName').readOnly=true;$('phone').readOnly=true;$('saveProfile').style.display='none';$('editProfile').style.display='inline-block'}function unlockProfile(){$('fullName').readOnly=false;$('phone').readOnly=false;$('saveProfile').style.display='inline-block';$('editProfile').style.display='none';$('fullName').focus()}
function showStatus(msg,type='success'){$('profileStatus').innerHTML='<div class="alert '+type+'">'+esc(msg)+'</div>';setTimeout(()=>{$('profileStatus').innerHTML=''},3500)}
async function saveProfile(e){e.preventDefault();const full=$('fullName').value.trim(),phone=$('phone').value.trim();if(!full||!phone){showStatus('Please enter your full name and phone number.','error');return}const b=$('saveProfile');b.disabled=true;b.textContent='Saving…';try{const{data,error}=await supabaseClient.from('profiles').upsert({id:currentUser.id,full_name:full,phone,updated_at:new Date().toISOString()},{onConflict:'id'}).select('id,full_name,phone').single();if(error)throw error;$('fullName').value=data?.full_name||full;$('phone').value=data?.phone||phone;syncName();lockProfile();showStatus('Profile saved successfully.')}catch(err){showStatus(err.message||'Could not save profile.','error')}finally{b.disabled=false;b.textContent='Save profile'}}
function switchView(view){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.querySelectorAll('.menu button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const map={orders:['ordersView','My Orders','Track purchases, delivery progress, cancellations and refunds.'],profile:['profileView','Profile','Manage your personal account information.'],refunds:['refundsView','Payments & Refunds','Review refund progress linked to your orders.']},m=map[view]||map.orders;$(m[0]).classList.add('active');$('viewTitle').textContent=m[1];$('viewSub').textContent=m[2];history.replaceState(null,'',location.pathname+(view==='orders'?'#orders':'#'+view))}
async function logout(){try{await supabaseClient.auth.signOut()}finally{localStorage.removeItem('customer_name');localStorage.removeItem('customer_phone');location.href='index.html'}}
async function init(){const{data:{user},error}=await supabaseClient.auth.getUser();if(error||!user){location.href='login.html';return}currentUser=user;await Promise.all([loadProfile(),loadOrders()]);$('loading').hidden=true;$('app').hidden=false;switchView((location.hash||'#orders').slice(1))}
document.querySelectorAll('.menu button[data-view]').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$('refreshOrders').onclick=()=>loadOrders().catch(e=>{$('ordersList').innerHTML='<div class="alert error">'+esc(e.message||'Could not load orders.')+'</div>'});$('editProfile').onclick=unlockProfile;$('profileForm').onsubmit=saveProfile;$('topLogout').onclick=logout;$('menuLogout').onclick=logout;init().catch(e=>{console.error(e);$('loading').textContent='Account could not be loaded.'});
</script>
</body>
</html>
