```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Fashion Fusion</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #111;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      border: 0;
      border-radius: 7px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      line-height: 1.8;
    }

    .links a {
      color: #111;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 7px;
      font-size: 14px;
    }

    .error {
      background: #ffebee;
      color: #c62828;
    }

    .success {
      background: #e8f5e9;
      color: #2e7d32;
    }
  </style>
</head>

<body>

<div class="login-container">

  <div class="login-card">

    <h1>Fashion Fusion</h1>

    <div class="subtitle">
      Sign in to your account
    </div>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
        autocomplete="email"
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
        autocomplete="current-password"
      >

      <button type="submit" id="loginButton">
        Login
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="links">
      <a href="#" id="forgotPassword">Forgot password?</a>
      <br>
      <a href="signup.html">Create a new account</a>
      <br>
      <a href="index.html">Continue shopping</a>
    </div>

  </div>

</div>

<script>

  /*
    IMPORTANT:
    supabaseClient is already created by supabase-config.js.
    Do NOT create another Supabase client here.
  */

  const loginForm =
    document.getElementById("loginForm");

  const loginButton =
    document.getElementById("loginButton");

  const message =
    document.getElementById("message");


  function showMessage(text, type) {

    message.textContent = text;
    message.className = "message " + type;
    message.style.display = "block";

  }


  /*
    LOGIN
  */

  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;

      loginButton.disabled = true;
      loginButton.textContent = "Signing in...";

      message.style.display = "none";

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {

          showMessage(
            error.message,
            "error"
          );

          return;
        }


        if (!data || !data.user) {

          showMessage(
            "Login was not completed. Please try again.",
            "error"
          );

          return;
        }


        showMessage(
          "Login successful. Redirecting...",
          "success"
        );


        /*
          Use a relative URL so GitHub Pages
          keeps the /Fashion_Fussion/ path.
        */

        setTimeout(function() {

          window.location.href =
            new URL(
              "account.html",
              window.location.href
            ).href;

        }, 700);


      } catch (error) {

        console.error(
          "Login error:",
          error
        );

        showMessage(
          "An unexpected error occurred. Please try again.",
          "error"
        );

      } finally {

        loginButton.disabled = false;
        loginButton.textContent = "Login";

      }

    }
  );


  /*
    FORGOT PASSWORD
  */

  document
    .getElementById("forgotPassword")
    .addEventListener(
      "click",
      async function(event) {

        event.preventDefault();

        const email =
          document
            .getElementById("email")
            .value
            .trim();


        if (!email) {

          showMessage(
            "Enter your email address first.",
            "error"
          );

          return;
        }


        try {

          /*
            Correct GitHub Pages reset URL.
          */

          const resetUrl =
            new URL(
              "reset-password.html",
              window.location.href
            ).href;


          const {
            error
          } =
            await supabaseClient.auth.resetPasswordForEmail(
              email,
              {
                redirectTo: resetUrl
              }
            );


          if (error) {

            showMessage(
              error.message,
              "error"
            );

            return;
          }


          showMessage(
            "Password reset instructions have been sent to your email.",
            "success"
          );


        } catch (error) {

          console.error(
            "Password reset error:",
            error
          );

          showMessage(
            "Unable to send the password reset email.",
            "error"
          );

        }

      }
    );

</script>

</body>
</html>
