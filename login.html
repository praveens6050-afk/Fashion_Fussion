<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In — Fashion_Fussion</title><meta name="description" content="Sign in to your Fashion_Fussion account."><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="supabase-config.js"></script><style>:root{--paper:#f4eee1;--ink:#1c2333;--soft:#5a6172;--indigo:#1b2a4a;--gold:#e5972e;--white:#fffdf8;--line:#d8cdae;--red:#b23a2e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,'Segoe UI',Arial,sans-serif}a{color:inherit;text-decoration:none}.top{padding:18px 24px;border-bottom:1px solid var(--line)}.logo{font:700 25px Georgia,serif;color:var(--indigo)}.shell{min-height:calc(100vh - 67px);display:grid;grid-template-columns:1fr 1fr}.brand{background:var(--indigo);color:#fff;padding:60px;display:grid;align-content:center}.brand h1{font:700 clamp(34px,4vw,48px) Georgia,serif;margin:14px 0}.brand p{color:#c9d0df;line-height:1.65;max-width:38ch}.stamp{width:max-content;background:var(--gold);color:var(--indigo);padding:6px 12px;border-radius:99px;font-size:12px;font-weight:800}.form-side{display:grid;place-items:center;padding:35px 20px}.card{width:min(410px,100%)}h2{font:700 31px Georgia,serif;color:var(--indigo);margin:0 0 7px}.sub{color:var(--soft);margin:0 0 28px}.field{margin:15px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:5px;background:var(--white)}.row{display:flex;justify-content:flex-end;margin:8px 0 22px}.link{border:0;background:none;color:var(--indigo);font-weight:700;cursor:pointer}.btn{width:100%;padding:13px;border:0;border-radius:4px;background:var(--indigo);color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6}.banner{display:none;padding:11px 13px;border-radius:5px;margin-bottom:15px;font-size:13px;line-height:1.5}.banner.show{display:block}.banner.error{background:#fbe6e2;color:var(--red)}.banner.success{background:#e4e9dd;color:#2f5233}.foot{text-align:center;color:var(--soft);font-size:14px;margin-top:22px}.foot a{color:var(--indigo);font-weight:700}@media(max-width:800px){.shell{grid-template-columns:1fr}.brand{padding:35px 25px;min-height:250px}.form-side{padding:35px 20px}}</style></head><body><header class="top"><a href="index.html" class="logo">Fashion_Fussion</a></header><main class="shell"><section class="brand"><span class="stamp">Welcome back</span><h1>Good to see you again.</h1><p>Sign in to track orders, use your wishlist, manage delivery addresses and check out securely.</p></section><section class="form-side"><div class="card"><h2>Sign in</h2><p class="sub">Enter your account details.</p><div id="banner" class="banner"></div><form id="form"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><div class="row"><button id="forgot" class="link" type="button">Forgot password?</button></div><button id="submit" class="btn" type="submit">Sign in</button></form><p class="foot">Don't have an account? <a href="signup.html">Create one</a></p></div></section></main><script>'use strict';const form=document.getElementById('form'),email=document.getElementById('email'),password=document.getElementById('password'),submit=document.getElementById('submit'),banner=document.getElementById('banner');const redirect=new URLSearchParams(location.search).get('redirect');function show(msg,type='error'){banner.textContent=msg;banner.className='banner show '+type}async function destination(user){const{data:p}=await window.supabaseClient.from('profiles').select('is_admin').eq('id',user.id).maybeSingle();if(p?.is_admin===true)return 'admin.html';if(redirect==='checkout')return 'checkout.html';return 'account.html'}async function redirectExisting(){const{data:{session}}=await window.supabaseClient.auth.getSession();if(session?.user)location.replace(await destination(session.user))}form.addEventListener('submit',async e=>{e.preventDefault();const mail=email.value.trim();if(!mail||!password.value){show('Enter your email and password.');return}submit.disabled=true;submit.textContent='Signing in…';try{const{data,error}=await window.supabaseClient.auth.signInWithPassword({email:mail,password:password.value});if(error)throw error;if(!data?.user)throw new Error('Sign in could not be completed.');show('Signed in successfully.','success');location.replace(await destination(data.user))}catch(err){show(err.message||'Unable to sign in.')}finally{submit.disabled=false;submit.textContent='Sign in'}});document.getElementById('forgot').onclick=async()=>{const mail=email.value.trim();if(!mail){show('Enter your email address first.');email.focus();return}try{const redirectTo=new URL('reset-password.html',location.href).href;const{error}=await window.supabaseClient.auth.resetPasswordForEmail(mail,{redirectTo});if(error)throw error;show('Password reset email sent. Check your inbox.','success')}catch(err){show(err.message||'Unable to send reset email.')}};redirectExisting().catch(console.error);</script></body></html>
