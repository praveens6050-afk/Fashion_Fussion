<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist | Fashion_Fussion</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="supabase-config.js"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#f1f3f6;color:#222}.top{background:#2874f0;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;margin-left:12px}.wrap{max-width:980px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:8px;padding:16px;border:1px solid #ddd;margin-bottom:12px;display:grid;grid-template-columns:90px 1fr auto;align-items:center;gap:16px}.pic,.fallback{width:90px;height:90px;object-fit:contain;border:1px solid #eee;background:#fafafa}.fallback{display:grid;place-items:center;text-align:center;font-size:11px;color:#888}.name{font-size:17px;font-weight:800}.meta{color:#777;font-size:12px;margin-top:5px}.price{font-size:19px;font-weight:800;margin-top:8px}.empty{text-align:center;padding:45px;display:block;background:#fff;border:1px solid #ddd;border-radius:8px}.btn{display:inline-block;background:#2874f0;color:#fff;padding:10px 14px;border-radius:5px;text-decoration:none;border:0;cursor:pointer;font-weight:700}.remove{background:#fff;color:#d32f2f;border:1px solid #ddd}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}@media(max-width:650px){.card{grid-template-columns:75px 1fr}.pic,.fallback{width:75px;height:75px}.actions{grid-column:1/-1;justify-content:stretch}.actions .btn{flex:1}}</style></head><body><div class="top"><b>Fashion_Fussion — Wishlist</b><div><a href="index.html">Store</a><a href="cart.html">Cart</a><a href="account.html">My Account</a></div></div><main class="wrap"><h1>Wishlist</h1><div id="list" class="empty">Loading wishlist...</div></main><script>'use strict';(async()=>{const list=document.getElementById('list'),CART_KEY='fashion_fussion_cart';const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});const{data:{user},error:ue}=await window.supabaseClient.auth.getUser();if(ue||!user){location.href='login.html';return}function image(p){return p.image_url?'<img class="pic" src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'" onerror="this.outerHTML=\'<div class=&quot;fallback&quot;>Image unavailable</div>\'">':'<div class="fallback">Image unavailable</div>'}function add(id){let c={};try{c=JSON.parse(localStorage.getItem(CART_KEY)||'{}')||{}}catch{}c[id]=Math.min(20,(Number(c[id])||0)+1);localStorage.setItem(CART_KEY,JSON.stringify(c));sessionStorage.removeItem('fashion_fussion_checkout_key');alert('Added to cart.')}async function load(){const{data:rows,error}=await window.supabaseClient.from('customer_wishlist').select('id,product_id,created_at').eq('user_id',user.id).order('created_at',{ascending:false});if(error){list.className='empty';list.textContent='Unable to load wishlist.';return}if(!rows?.length){list.className='empty';list.innerHTML='<h2>Your Wishlist is empty</h2><p>Tap the heart on a product to save it here.</p><a class="btn" href="index.html">Continue Shopping</a>';return}const ids=rows.map(x=>x.product_id);const{data:products,error:pe}=await window.supabaseClient.from('products').select('id,name,category,price,image_url,is_active,gst_rate').in('id',ids);if(pe){list.className='empty';list.textContent='Unable to load saved products.';return}const map=new Map((products||[]).map(p=>[Number(p.id),p]));list.className='';list.innerHTML=rows.map(x=>{const p=map.get(Number(x.product_id));if(!p)return '<div class="card"><div class="fallback">Removed product</div><div><div class="name">Product unavailable</div><div class="meta">This saved product no longer exists.</div></div><div class="actions"><button class="btn remove" data-remove="'+x.product_id+'">Remove</button></div></div>';return '<div class="card">'+image(p)+'<div><div class="name">'+esc(p.name)+'</div><div class="meta">'+esc(p.category||'')+' · GST '+Number(p.gst_rate||0)+'%</div><div class="price">'+money(p.price)+'</div></div><div class="actions"><button class="btn" data-add="'+p.id+'" '+(!p.is_active?'disabled':'')+'>'+(p.is_active?'Add to Cart':'Unavailable')+'</button><button class="btn remove" data-remove="'+p.id+'">Remove</button></div></div>'}).join('');list.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(Number(b.dataset.add)));list.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{b.disabled=true;const{error}=await window.supabaseClient.from('customer_wishlist').delete().eq('user_id',user.id).eq('product_id',Number(b.dataset.remove));if(error){alert(error.message);b.disabled=false}else load()})}await load()})().catch(e=>{console.error(e);document.getElementById('list').textContent='Wishlist could not be loaded.'});</script></body></html>
