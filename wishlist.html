<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist | Fashion_Fussion</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#f1f3f6;color:#222}.top{background:#2874f0;color:#fff;padding:16px 24px;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none;margin-left:12px}.wrap{max-width:900px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:8px;padding:18px;border:1px solid #ddd;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:15px}.empty{text-align:center;padding:45px;display:block}.btn{display:inline-block;background:#2874f0;color:#fff;padding:10px 16px;border-radius:5px;text-decoration:none;border:0;cursor:pointer}.remove{background:#fff;color:#d32f2f;border:1px solid #ddd}.pid{color:#777;font-size:13px}</style></head><body><div class="top"><b>Fashion_Fussion — Wishlist</b><div><a href="index.html">Store</a><a href="account.html">My Account</a></div></div><main class="wrap"><h1>Wishlist</h1><div id="list" class="card empty">Loading wishlist...</div></main><script>(async()=>{const list=document.getElementById('list');const{data:{user}}=await window.supabaseClient.auth.getUser();if(!user){location.href='login.html';return}async function load(){const{data,error}=await window.supabaseClient.from('customer_wishlist').select('id,product_id,created_at').eq('user_id',user.id).order('created_at',{ascending:false});if(error){list.className='card empty';list.textContent='Unable to load wishlist.';return}if(!data?.length){list.className='card empty';list.innerHTML='<h2>Your Wishlist is empty</h2><p>Tap the heart on a product to save it here.</p><a class="btn" href="index.html">Continue Shopping</a>';return}list.className='';list.innerHTML=data.map(x=>'<div class="card"><div><b>Saved Product</b><div class="pid">Product #'+x.product_id+'</div></div><div><a class="btn" href="index.html?product='+x.product_id+'">View Product</a> <button class="btn remove" data-remove="'+x.product_id+'">Remove</button></div></div>').join('');list.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{b.disabled=true;const{error}=await window.supabaseClient.from('customer_wishlist').delete().eq('user_id',user.id).eq('product_id',Number(b.dataset.remove));if(error){alert(error.message);b.disabled=false}else load()})}load()})();</script></body></html>
