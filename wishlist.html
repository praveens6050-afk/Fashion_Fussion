<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist | Fashion_Fussion</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="supabase-config.js"></script><style>:root{--navy:#111827;--brand:#5b3df5;--orange:#f59e0b;--bg:#f6f7fb;--ink:#171a22;--muted:#697386;--line:#e5e7eb;--red:#b42318;--shadow:0 8px 30px #11182712}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}.top{background:var(--navy);color:#fff}.topin{max-width:1320px;height:70px;margin:auto;padding:0 28px;display:flex;align-items:center}.brand{font-size:23px;font-weight:900}.links{margin-left:auto;display:flex;gap:20px;font-size:12px;font-weight:900}.wrap{max-width:1180px;margin:26px auto 50px;padding:0 28px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.head h1{margin:0;font-size:28px}.head p{margin:5px 0 0;color:var(--muted);font-size:12px}.card{background:#fff;border-radius:12px;padding:17px;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:12px;display:grid;grid-template-columns:100px 1fr auto;align-items:center;gap:18px}.pic,.fallback{width:100px;height:100px;object-fit:contain;border:1px solid #eee;background:#fafafa;border-radius:8px}.fallback{display:grid;place-items:center;text-align:center;font-size:11px;color:#888}.name{font-size:16px;font-weight:900}.meta{color:var(--muted);font-size:11px;margin-top:5px}.price{font-size:20px;font-weight:900;margin-top:8px}.empty{text-align:center;padding:55px;display:block;background:#fff;border:1px solid var(--line);border-radius:12px}.btn{display:inline-block;background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none;border:0;cursor:pointer;font-weight:900;font-size:11px}.remove{background:#fff;color:var(--red);border:1px solid var(--line)}.details{background:#fff;color:var(--ink);border:1px solid var(--line)}.actions{display:flex;gap:7px;justify-content:flex-end}</style></head><body><header class="top"><div class="topin"><a class="brand" href="index.html">Fashion_Fussion</a><nav class="links"><a href="search.html">Shop</a><a href="cart.html">Cart</a><a href="account.html#orders">My Account</a></nav></div></header><main class="wrap"><div class="head"><div><h1>Wishlist</h1><p>Saved products from your Fashion_Fussion account.</p></div><a class="btn details" href="search.html">CONTINUE SHOPPING</a></div><div id="list" class="empty">Loading wishlist...</div></main><script>'use strict';(async()=>{const list=document.getElementById('list'),CART_KEY='fashion_fussion_cart';const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});const{data:{user},error:ue}=await window.supabaseClient.auth.getUser();if(ue||!user){location.href='login.html';return}function image(p){return p.image_url?'<img class="pic" src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'" onerror="this.outerHTML=\'<div class=&quot;fallback&quot;>Image unavailable</div>\'">':'<div class="fallback">Image unavailable</div>'}function add(id){let c={};try{c=JSON.parse(localStorage.getItem(CART_KEY)||'{}')||{}}catch{}c[id]=Math.min(500,(Number(c[id])||0)+1);localStorage.setItem(CART_KEY,JSON.stringify(c));sessionStorage.removeItem('fashion_fussion_checkout_key');location.href='cart.html'}async function load(){const{data:rows,error}=await window.supabaseClient.from('customer_wishlist').select('id,product_id,created_at').eq('user_id',user.id).order('created_at',{ascending:false});if(error){list.className='empty';list.textContent='Unable to load wishlist.';return}if(!rows?.length){list.className='empty';list.innerHTML='<h2>Your Wishlist is empty</h2><p>Use the heart on a product to save it here.</p><a class="btn" href="search.html">Browse products</a>';return}const ids=rows.map(x=>x.product_id);const{data:products,error:pe}=await window.supabaseClient.from('products').select('id,name,category,price,image_url,is_active,gst_rate').in('id',ids);if(pe){list.className='empty';list.textContent='Unable to load saved products.';return}const map=new Map((products||[]).map(p=>[Number(p.id),p]));list.className='';list.innerHTML=rows.map(x=>{const p=map.get(Number(x.product_id));if(!p)return '<div class="card"><div class="fallback">Removed product</div><div><div class="name">Product unavailable</div><div class="meta">This saved product no longer exists.</div></div><div class="actions"><button class="btn remove" data-remove="'+x.product_id+'">REMOVE</button></div></div>';return '<div class="card">'+image(p)+'<div><a class="name" href="product.html?id='+encodeURIComponent(p.id)+'">'+esc(p.name)+'</a><div class="meta">'+esc(p.category||'General')+' · GST '+Number(p.gst_rate||0)+'%</div><div class="price">'+money(p.price)+'</div></div><div class="actions"><a class="btn details" href="product.html?id='+encodeURIComponent(p.id)+'">DETAILS</a><button class="btn" data-add="'+p.id+'" '+(!p.is_active?'disabled':'')+'>'+(p.is_active?'ADD TO CART':'UNAVAILABLE')+'</button><button class="btn remove" data-remove="'+p.id+'">REMOVE</button></div></div>'}).join('');list.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(Number(b.dataset.add)));list.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{b.disabled=true;const{error}=await window.supabaseClient.from('customer_wishlist').delete().eq('user_id',user.id).eq('product_id',Number(b.dataset.remove));if(error){alert(error.message);b.disabled=false}else load()})}await load()})().catch(e=>{console.error(e);document.getElementById('list').textContent='Wishlist could not be loaded.'});</script></body></html>
