<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist | Fashion_Fussion</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#f1f3f6;color:#222}.top{background:#2874f0;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}.top a{color:#fff;text-decoration:none;margin-left:12px}.wrap{max-width:1000px;margin:24px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{background:#fff;border-radius:8px;padding:16px;border:1px solid #ddd;display:flex;gap:14px;align-items:flex-start}.product-image{width:110px;height:110px;object-fit:contain;border:1px solid #eee;border-radius:6px;background:#fff;flex:0 0 auto}.placeholder{width:110px;height:110px;display:flex;align-items:center;justify-content:center;border:1px solid #eee;border-radius:6px;font-size:34px;flex:0 0 auto}.content{min-width:0;flex:1}.name{font-size:17px;font-weight:700;margin:0 0 5px}.category{color:#777;font-size:12px;margin-bottom:8px}.price{font-size:18px;font-weight:700;margin-bottom:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-block;background:#2874f0;color:#fff;padding:9px 12px;border-radius:5px;text-decoration:none;border:0;cursor:pointer;font-weight:600}.btn:disabled{opacity:.6;cursor:not-allowed}.remove{background:#fff;color:#d32f2f;border:1px solid #ddd}.secondary{background:#fff;color:#2874f0;border:1px solid #2874f0}.empty{text-align:center;padding:45px;background:#fff;border:1px solid #ddd;border-radius:8px}.notice{margin:0 0 16px;padding:10px 12px;background:#e8f5e9;color:#2e7d32;border-radius:6px;display:none}@media(max-width:520px){.card{flex-direction:column}.product-image,.placeholder{width:100%;height:210px}.top{align-items:flex-start;flex-direction:column}.top a{margin:0 12px 0 0}}</style></head><body><div class="top"><b>Fashion_Fussion — Wishlist</b><div><a href="index.html">Store</a><a href="cart.html">Cart</a><a href="account.html">My Account</a></div></div><main class="wrap"><h1>Wishlist</h1><div id="notice" class="notice"></div><div id="list" class="empty">Loading wishlist...</div></main><script>(async()=>{
const CART_KEY='fashion_fussion_cart';
const list=document.getElementById('list');
const notice=document.getElementById('notice');
const money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const showNotice=msg=>{notice.textContent=msg;notice.style.display='block';setTimeout(()=>notice.style.display='none',1800)};
function readCart(){try{const value=JSON.parse(localStorage.getItem(CART_KEY)||'{}');return value&&typeof value==='object'&&!Array.isArray(value)?value:{}}catch{return {}}}
function addToCart(productId){const cart=readCart(),key=String(productId),current=Number(cart[key]||0);if(current>=20){showNotice('Maximum quantity is 20 for one product.');return}cart[key]=current+1;localStorage.setItem(CART_KEY,JSON.stringify(cart));showNotice('Added to cart.');}
const{data:{user}}=await window.supabaseClient.auth.getUser();
if(!user){location.href='login.html?redirect=wishlist';return}

async function load(){
  const{data:wishlist,error:wishlistError}=await window.supabaseClient.from('customer_wishlist').select('id,product_id,created_at').eq('user_id',user.id).order('created_at',{ascending:false});
  if(wishlistError){list.className='empty';list.textContent='Unable to load wishlist.';return}
  if(!wishlist?.length){list.className='empty';list.replaceChildren();const h=document.createElement('h2');h.textContent='Your Wishlist is empty';const p=document.createElement('p');p.textContent='Tap the heart on a product to save it here.';const a=document.createElement('a');a.className='btn';a.href='index.html#shop';a.textContent='Continue Shopping';list.append(h,p,a);return}

  const ids=[...new Set(wishlist.map(x=>Number(x.product_id)).filter(Number.isFinite))];
  const{data:products,error:productError}=await window.supabaseClient.from('products').select('id,name,category,price,image_url,is_active').in('id',ids);
  if(productError){list.className='empty';list.textContent='Unable to load saved product details.';return}
  const byId=new Map((products||[]).map(p=>[Number(p.id),p]));
  list.className='grid';list.replaceChildren();

  for(const saved of wishlist){
    const product=byId.get(Number(saved.product_id));
    if(!product)continue;
    const card=document.createElement('article');card.className='card';
    if(product.image_url){const img=document.createElement('img');img.className='product-image';img.src=product.image_url;img.alt=product.name||'Product';img.loading='lazy';img.onerror=()=>img.replaceWith(Object.assign(document.createElement('div'),{className:'placeholder',textContent:'🛍️'}));card.appendChild(img)}else{const ph=document.createElement('div');ph.className='placeholder';ph.textContent='🛍️';card.appendChild(ph)}
    const content=document.createElement('div');content.className='content';
    const name=document.createElement('h2');name.className='name';name.textContent=product.name||('Product #'+product.id);
    const category=document.createElement('div');category.className='category';category.textContent=product.category||'Product';
    const price=document.createElement('div');price.className='price';price.textContent=money(product.price);
    const actions=document.createElement('div');actions.className='actions';
    const add=document.createElement('button');add.type='button';add.className='btn';add.textContent='Add to Cart';add.onclick=()=>addToCart(product.id);
    const view=document.createElement('a');view.className='btn secondary';view.href='index.html?product='+encodeURIComponent(product.id)+'#shop';view.textContent='View Product';
    const remove=document.createElement('button');remove.type='button';remove.className='btn remove';remove.textContent='Remove';remove.onclick=async()=>{remove.disabled=true;const{error}=await window.supabaseClient.from('customer_wishlist').delete().eq('user_id',user.id).eq('product_id',Number(product.id));if(error){alert(error.message);remove.disabled=false}else load()};
    actions.append(add,view,remove);content.append(name,category,price,actions);card.appendChild(content);list.appendChild(card);
  }

  if(!list.children.length){list.className='empty';list.textContent='Your saved products are no longer available.'}
}

load();
})();</script></body></html>
