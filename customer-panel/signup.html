<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | Fashion Fussion</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script><script src="supabase-config.js"></script><link rel="stylesheet" href="csp-signup.css?v=1"><script src="desktop-auth-loader.js?v=1" defer></script><link rel="stylesheet" href="csp-dynamic.css?v=1"></head><body><div class="container auth-standalone-main"><div class="card"><h1>Fashion Fussion</h1><div class="subtitle">Create your account</div><form id="signupForm"><label for="fullName">Full Name</label><input type="text" id="fullName" maxlength="100" required autocomplete="name"><label for="phone">Phone</label><input type="tel" id="phone" maxlength="20" required autocomplete="tel" placeholder="10-digit mobile number"><label for="email">Email</label><input type="email" id="email" required autocomplete="email"><label for="password">Password</label><input type="password" id="password" required minlength="10" autocomplete="new-password"><div class="hint">Use at least 10 characters. A unique password is recommended.</div><label for="confirmPassword">Confirm Password</label><input type="password" id="confirmPassword" required minlength="10" autocomplete="new-password"><button type="submit" id="signupButton">Create Account</button></form><div id="message" class="message"></div><div class="links"><a href="login.html">Already have an account? Login</a><br><a href="index.html">Continue shopping</a></div></div></div><script src="csp-signup.js?v=3"></script></body></html>
