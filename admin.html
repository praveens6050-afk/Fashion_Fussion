<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fashion Fusion — Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .logout-btn {
      background: #e53935;
      border: 0;
      color: white;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    .success {
      color: #16803c;
      font-weight: 600;
    }

    .error {
      color: #d32f2f;
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }
  </style>
</head>

<body>

<header>
  <h1>Fashion Fusion — Admin</h1>
  <button class="logout-btn" id="logoutBtn">Logout</button>
</header>

<div class="container">

  <div class="card">
    <h2>Admin Dashboard</h2>
    <p id="adminInfo" class="loading">Checking administrator access...</p>
  </div>

  <div class="card">
    <h2>Product Catalog</h2>
    <p>
      Product management will be connected here after the admin
      authorization has been verified.
    </p>
  </div>

</div>

<script>

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

async function checkAdmin() {

  const adminInfo = document.getElementById("adminInfo");

  try {

    const {
      data: { user },
      error: userError
    } = await supabaseClient.auth.getUser();

    if (userError || !user) {
      window.location.href = "login.html";
      return;
    }

    const { data: profile, error: profileError } =
      await supabaseClient
        .from("profiles")
        .select("is_admin")
        .eq("id", user.id)
        .single();

    if (profileError) {
      console.error(profileError);

      adminInfo.textContent =
        "Unable to verify administrator access.";

      adminInfo.className = "error";

      return;
    }

    if (!profile || profile.is_admin !== true) {

      adminInfo.textContent =
        "Access denied. Administrator privileges are required.";

      adminInfo.className = "error";

      setTimeout(() => {
        window.location.href = "account.html";
      }, 2000);

      return;
    }

    adminInfo.textContent =
      "Administrator access granted: " + user.email;

    adminInfo.className = "success";

  } catch (error) {

    console.error(error);

    adminInfo.textContent =
      "An unexpected error occurred.";

    adminInfo.className = "error";
  }
}

document
  .getElementById("logoutBtn")
  .addEventListener("click", async () => {

    await supabaseClient.auth.signOut();

    window.location.href = "login.html";
  });

checkAdmin();

</script>

</body>
</html>
