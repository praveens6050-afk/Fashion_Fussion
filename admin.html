<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fashion Fusion — Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .logout-btn {
      background: #e53935;
      border: 0;
      color: white;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 600;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .add-btn {
      margin-top: 20px;
      background: #111;
      color: white;
      border: 0;
      padding: 13px 22px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
    }

    .add-btn:hover {
      opacity: 0.85;
    }

    #message {
      margin-top: 15px;
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      header {
        gap: 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Fashion Fusion — Admin</h1>
  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<div class="container">

  <div class="card">
    <h2>Admin Dashboard</h2>
    <p id="adminInfo">Checking administrator access...</p>
  </div>

  <div class="card">
    <h2>Add Product</h2>

    <form id="productForm">

      <div class="form-grid">

        <div class="field">
          <label for="name">Product Name</label>
          <input
            id="name"
            type="text"
            placeholder="Example: Premium Cotton Shirt"
            required
          >
        </div>

        <div class="field">
          <label for="price">Price (₹)</label>
          <input
            id="price"
            type="number"
            min="0"
            step="0.01"
            placeholder="999"
            required
          >
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="">Select category</option>
            <option value="Men">Men</option>
            <option value="Women">Women</option>
            <option value="Kids">Kids</option>
            <option value="Accessories">Accessories</option>
          </select>
        </div>

        <div class="field">
          <label for="stock">Stock</label>
          <input
            id="stock"
            type="number"
            min="0"
            placeholder="10"
            required
          >
        </div>

        <div class="field">
          <label for="sizes">Sizes</label>
          <input
            id="sizes"
            type="text"
            placeholder="S, M, L, XL"
          >
        </div>

        <div class="field">
          <label for="image">Image URL</label>
          <input
            id="image"
            type="url"
            placeholder="https://..."
          >
        </div>

        <div class="field full">
          <label for="description">Description</label>
          <textarea
            id="description"
            placeholder="Product description..."
          ></textarea>
        </div>

      </div>

      <button class="add-btn" type="submit">
        Add Product
      </button>

      <div id="message"></div>

    </form>
  </div>

  <div class="card">
    <h2>Product Catalog</h2>
    <div id="products">
      <div class="loading">Loading products...</div>
    </div>
  </div>

</div>

<script>

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  async function checkAdmin() {

    const {
      data: { user },
      error
    } = await supabaseClient.auth.getUser();

    if (error || !user) {
      window.location.href = "login.html";
      return;
    }

    document.getElementById("adminInfo").textContent =
      "Logged in as: " + user.email;

    /*
      IMPORTANT:

      We will add the real admin authorization
      after creating the admin role in Supabase.

      Do NOT rely on this page alone for security.
    */
  }

  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href = "login.html";
  }

  document
    .getElementById("productForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      const message = document.getElementById("message");

      message.textContent = "Product system will be connected next.";

    });

  checkAdmin();

</script>

</body>
</html>
