<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fashion Fusion — Admin</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Your existing Supabase configuration -->
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .logout-btn {
      background: #e53935;
      border: 0;
      color: white;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .logout-btn:hover {
      opacity: 0.85;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-top: 0;
    }

    .success {
      color: #16803c;
      font-weight: 600;
    }

    .error {
      color: #d32f2f;
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }

    .admin-badge {
      display: inline-block;
      background: #16803c;
      color: white;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      margin-left: 8px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Fashion Fusion — Admin</h1>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </header>

  <div class="container">

    <div class="card">
      <h2>Admin Dashboard</h2>

      <p id="adminInfo" class="loading">
        Checking administrator access...
      </p>
    </div>

    <div class="card">
      <h2>Product Catalog</h2>

      <p>
        Administrator access has been verified.
        Product management will be available here.
      </p>
    </div>

  </div>

  <script>

    /*
      IMPORTANT:
      Do NOT create another supabaseClient here.

      supabase-config.js already creates:
      const supabaseClient = window.supabase.createClient(...)

      We use that existing client below.
    */

    async function checkAdmin() {

      const adminInfo = document.getElementById("adminInfo");

      try {

        /*
          Get currently logged-in user
        */
        const {
          data: { user },
          error: userError
        } = await supabaseClient.auth.getUser();

        /*
          No logged-in user
        */
        if (userError || !user) {

          window.location.href = "login.html";

          return;
        }

        /*
          Get admin status from profiles table
        */
        const {
          data: profile,
          error: profileError
        } = await supabaseClient
          .from("profiles")
          .select("is_admin")
          .eq("id", user.id)
          .single();

        /*
          Profile lookup failed
        */
        if (profileError) {

          console.error(
            "Profile lookup error:",
            profileError
          );

          adminInfo.textContent =
            "Unable to verify administrator access.";

          adminInfo.className = "error";

          return;
        }

        /*
          User is NOT an administrator
        */
        if (!profile || profile.is_admin !== true) {

          adminInfo.textContent =
            "Access denied. Administrator privileges are required.";

          adminInfo.className = "error";

          setTimeout(function () {

            window.location.href = "account.html";

          }, 2000);

          return;
        }

        /*
          User IS an administrator
        */
        adminInfo.innerHTML =
          "Administrator access granted: " +
          user.email +
          ' <span class="admin-badge">ADMIN</span>';

        adminInfo.className = "success";

      } catch (error) {

        console.error(
          "Admin check error:",
          error
        );

        adminInfo.textContent =
          "An unexpected error occurred.";

        adminInfo.className = "error";
      }
    }


    /*
      Logout
    */
    document
      .getElementById("logoutBtn")
      .addEventListener("click", async function () {

        try {

          await supabaseClient.auth.signOut();

        } catch (error) {

          console.error(
            "Logout error:",
            error
          );

        }

        window.location.href = "login.html";

      });


    /*
      Start admin check
    */
    checkAdmin();

  </script>

</body>
</html>
