name = "fashion-fussion-ai-orchestrator"
main = "src/index.js"
compatibility_date = "2026-11-11"
workers_dev = true

# Keep execution disabled until the queue consumer, Supabase secrets,
# agent-specific connectors, and safety tests are deployed.
[vars]
APP_ENV = "development"
AGENT_RUNTIME_READY = "false"
AI_MODEL = "@cf/zai-org/glm-5.3"

[ai]
binding = "AI"

# Provision these queue resources in the target Cloudflare account before deploying.
# Runtime stays disabled until preview tests and secret configuration are complete.
[[queues.producers]]
binding = "AGENT_JOBS"
queue = "fashion-fussion-agent-jobs"

[[queues.consumers]]
queue = "fashion-fussion-agent-jobs"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "fashion-fussion-agent-jobs-dlq"
