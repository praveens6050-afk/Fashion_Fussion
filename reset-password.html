<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | Fashion_Fussion</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Arial,sans-serif;background:#f4eee1;color:#1c2333}.card{width:min(430px,100%);background:#fffdf8;border:1px solid #d8cdae;border-radius:10px;padding:32px;box-shadow:0 10px 35px #0001}.logo{text-align:center;font-size:25px;font-weight:800;color:#1b2a4a;margin-bottom:25px}h1{text-align:center;font-size:25px;margin:0 0 10px}.subtitle{text-align:center;color:#666;font-size:14px;line-height:1.6;margin-bottom:25px}.group{margin-bottom:17px}.group label{display:block;margin-bottom:7px;font-size:13px;font-weight:700}.group input{width:100%;padding:13px;border:1px solid #ccc;border-radius:6px}button{width:100%;border:0;border-radius:5px;padding:13px;background:#1b2a4a;color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.6}.message{display:none;margin-top:16px;padding:11px;border-radius:6px;font-size:13px;line-height:1.5}.message.success,.message.error{display:block}.success{background:#e8f5e9;color:#176b35}.error{background:#fdecec;color:#a52222}.back{display:block;text-align:center;margin-top:20px;color:#1b2a4a;text-decoration:none;font-weight:700;font-size:13px}#resetSection,#invalidSection{display:none}</style></head><body><div class="card"><div class="logo">Fashion_Fussion</div><section id="resetSection"><h1>Set New Password</h1><p class="subtitle">Choose a new password with at least 10 characters.</p><form id="resetForm"><div class="group"><label for="password">New Password</label><input type="password" id="password" autocomplete="new-password" minlength="10" required></div><div class="group"><label for="confirmPassword">Confirm Password</label><input type="password" id="confirmPassword" autocomplete="new-password" minlength="10" required></div><button id="resetButton" type="submit">Update Password</button></form><div id="message" class="message"></div><a class="back" href="login.html">Back to Login</a></section><section id="invalidSection"><h1>Reset Link Invalid</h1><p class="subtitle">This password reset link is invalid or expired. Request a new link from the login page.</p><a class="back" href="login.html">Back to Login</a></section></div><script>'use strict';const resetSection=document.getElementById('resetSection'),invalidSection=document.getElementById('invalidSection'),form=document.getElementById('resetForm'),button=document.getElementById('resetButton'),message=document.getElementById('message'),params=new URLSearchParams(location.search),recoveryHint=params.has('code')||params.get('type')==='recovery'||location.hash.includes('type=recovery');let ready=false;function showReset(){resetSection.style.display='block';invalidSection.style.display='none'}function showInvalid(){resetSection.style.display='none';invalidSection.style.display='block'}function show(msg,type){message.textContent=msg;message.className='message '+type}window.supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){ready=true;showReset();return}if(event==='SIGNED_IN'&&session&&recoveryHint){ready=true;showReset()}});async function check(){try{if(!recoveryHint){setTimeout(()=>{if(!ready)showInvalid()},900);return}setTimeout(async()=>{if(ready)return;const{data,error}=await window.supabaseClient.auth.getSession();if(error)throw error;if(data?.session){ready=true;showReset()}else showInvalid()},1200)}catch(e){console.error(e);showInvalid()}}form.addEventListener('submit',async e=>{e.preventDefault();if(!ready){show('Recovery session is not valid. Request a new reset link.','error');return}const password=document.getElementById('password').value,confirm=document.getElementById('confirmPassword').value;if(password.length<10){show('Password must be at least 10 characters.','error');return}if(password!==confirm){show('Passwords do not match.','error');return}button.disabled=true;button.textContent='Updating…';try{const{error}=await window.supabaseClient.auth.updateUser({password});if(error)throw error;show('Password updated successfully. Redirecting to login…','success');form.reset();setTimeout(async()=>{await window.supabaseClient.auth.signOut();location.replace('login.html')},1200)}catch(err){show(err.message||'Unable to update password.','error');button.disabled=false;button.textContent='Update Password'}});check();</script></body></html>
