<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | Fashion Fusion</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 35px 30px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #222;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 14px;
      background: #111;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      background: #333;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.success {
      display: block;
      background: #e9f8ee;
      color: #176b35;
    }

    .message.error {
      display: block;
      background: #fdecec;
      color: #a52222;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #222;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    #resetSection {
      display: none;
    }

    #invalidSection {
      display: none;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <div class="logo">FASHION FUSION</div>

      <!-- Reset Password Form -->
      <div id="resetSection">

        <h1>Set New Password</h1>

        <p class="subtitle">
          Enter your new password below. Make sure it is strong and secure.
        </p>

        <form id="resetForm">

          <div class="form-group">
            <label for="password">New Password</label>
            <input
              type="password"
              id="password"
              autocomplete="new-password"
              minlength="6"
              required
              placeholder="Enter new password"
            >
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              autocomplete="new-password"
              minlength="6"
              required
              placeholder="Confirm new password"
            >
          </div>

          <button type="submit" id="resetButton">
            Update Password
          </button>

        </form>

        <div id="message" class="message"></div>

        <a href="login.html" class="back-link">
          Back to Login
        </a>

      </div>

      <!-- Invalid / Expired Link -->
      <div id="invalidSection">

        <h1>Reset Link Invalid</h1>

        <p class="subtitle">
          This password reset link is invalid or has expired.
          Please request a new password reset link from the login page.
        </p>

        <a href="login.html" class="back-link">
          Back to Login
        </a>

      </div>

    </div>
  </div>


  <script>
    const resetSection = document.getElementById("resetSection");
    const invalidSection = document.getElementById("invalidSection");
    const resetForm = document.getElementById("resetForm");
    const resetButton = document.getElementById("resetButton");
    const message = document.getElementById("message");

    let recoverySessionReady = false;


    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }


    function showResetForm() {
      resetSection.style.display = "block";
      invalidSection.style.display = "none";
    }


    function showInvalidLink() {
      resetSection.style.display = "none";
      invalidSection.style.display = "block";
    }


    /*
     * Supabase sends the user back to this page after clicking
     * the password-reset email link.
     *
     * The PASSWORD_RECOVERY event confirms that the recovery
     * session has been established.
     */
    supabaseClient.auth.onAuthStateChange(async (event, session) => {

      if (event === "PASSWORD_RECOVERY") {
        recoverySessionReady = true;
        showResetForm();
        return;
      }

      if (event === "SIGNED_IN" && session) {
        /*
         * Some Supabase configurations establish the recovery
         * session as SIGNED_IN instead of PASSWORD_RECOVERY.
         */
        recoverySessionReady = true;
        showResetForm();
      }

    });


    /*
     * Check whether a recovery session already exists.
     */
    async function checkRecoverySession() {

      try {

        const { data, error } = await supabaseClient.auth.getSession();

        if (error) {
          console.error(error);
          showInvalidLink();
          return;
        }

        if (data && data.session) {
          recoverySessionReady = true;
          showResetForm();
          return;
        }

        /*
         * Give Supabase's auth event a short moment to establish
         * the recovery session from the URL.
         */
        setTimeout(async () => {

          if (recoverySessionReady) {
            return;
          }

          const { data: retryData } =
            await supabaseClient.auth.getSession();

          if (retryData && retryData.session) {
            recoverySessionReady = true;
            showResetForm();
          } else {
            showInvalidLink();
          }

        }, 1200);

      } catch (error) {

        console.error(error);
        showInvalidLink();

      }
    }


    /*
     * Update the user's password.
     */
    resetForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;


      if (password.length < 6) {
        showMessage(
          "Password must be at least 6 characters long.",
          "error"
        );
        return;
      }


      if (password !== confirmPassword) {
        showMessage(
          "Passwords do not match.",
          "error"
        );
        return;
      }


      resetButton.disabled = true;
      resetButton.textContent = "Updating...";

      message.className = "message";


      try {

        const { error } =
          await supabaseClient.auth.updateUser({
            password: password
          });


        if (error) {
          throw error;
        }


        showMessage(
          "Password updated successfully. Redirecting to login...",
          "success"
        );


        resetForm.reset();


        /*
         * End the recovery session after the password
         * has successfully been changed.
         */
        setTimeout(async () => {

          await supabaseClient.auth.signOut();

          window.location.href = "login.html";

        }, 1800);


      } catch (error) {

        console.error("Password update error:", error);

        showMessage(
          error.message ||
          "Unable to update your password. Please request a new reset link.",
          "error"
        );

        resetButton.disabled = false;
        resetButton.textContent = "Update Password";

      }

    });


    /*
     * Start recovery-session detection.
     */
    checkRecoverySession();

  </script>

</body>
</html>
