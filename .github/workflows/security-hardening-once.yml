name: Security hardening once

on:
  push:
    branches:
      - security-hardening-20260910
    paths:
      - .github/workflows/security-hardening-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-hardening-20260910
          fetch-depth: 0
      - name: Pin Supabase browser SDK
        run: |
          find . -maxdepth 1 -name '*.html' -print0 | xargs -0 sed -i 's#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0#g'
      - name: Commit pinned dependency
        run: |
          rm -f .github/workflows/security-hardening-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pin Supabase browser SDK"
          git push origin HEAD:security-hardening-20260910
