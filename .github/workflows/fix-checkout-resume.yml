name: Fix checkout resume

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          marker = "const checkoutResume = new URLSearchParams(window.location.search).get(\"checkout\") === \"1\";"
          if marker in text:
              print("Checkout resume patch already present")
          else:
              old = '''    async function initializeStore(){\n\n      loadCart();\n\n      setupTicker();\n\n      renderReviews();\n\n      updateCartUI();\n\n      await updateAccountLink();\n\n      await loadProducts();\n\n    }'''

              new = '''    async function initializeStore(){\n\n      loadCart();\n\n      setupTicker();\n\n      renderReviews();\n\n      updateCartUI();\n\n      await updateAccountLink();\n\n      await loadProducts();\n\n      /* Resume checkout after login without auto-opening payment. */\n      const checkoutResume =\n        new URLSearchParams(window.location.search).get("checkout") === "1";\n\n      if(\n        checkoutResume &&\n        Object.keys(cart).length\n      ){\n\n        setTimeout(\n          function(){\n\n            openCart();\n\n            window.history.replaceState(\n              {},\n              document.title,\n              "index.html"\n            );\n\n          },\n          300\n        );\n\n      }\n\n    }'''

              if old not in text:
                  raise SystemExit("Expected initializeStore block was not found; no changes made")

              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("Checkout resume patch applied")
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-checkout-resume.yml
          git rm .github/workflows/fix-checkout-resume.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Fix checkout resume after login"
          git push
