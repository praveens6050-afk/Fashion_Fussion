name: Zoho Missed Email Recovery Safety
on:
  push:
    branches:
      - feature/zoho-pending-email-recovery
  pull_request:
    branches:
      - cloudflare-seller
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test recovery fail-closed safety
        run: node --experimental-default-type=module --test seller-panel/tests/zoho-order-recovery.test.mjs
