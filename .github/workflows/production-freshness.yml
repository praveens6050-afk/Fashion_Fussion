name: Cloudflare Production Customer Smoke

on:
  push:
    branches: [cloudflare-customer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-customer:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for exact Cloudflare production commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_URL: https://fashionfussion.in/release.json
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            body="$(curl --fail --silent --show-error --max-time 10 -H 'Cache-Control: no-cache' "$RELEASE_URL?check=$attempt" || true)"
            live_sha="$(node -e "try{const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.git_sha||''))}catch{}" "$body")"
            echo "Attempt $attempt: Cloudflare live=${live_sha:-missing} expected=$EXPECTED_SHA"
            if [ "$live_sha" = "$EXPECTED_SHA" ]; then
              echo "Cloudflare production is serving the exact customer commit."
              exit 0
            fi
            sleep 5
          done
          echo "Cloudflare production did not update to $EXPECTED_SHA." >&2
          exit 1

      - name: Verify apex and www are reachable
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://fashionfussion.in/ | grep -q 'Fashion Fussion'
          curl --fail --silent --show-error --max-time 20 https://www.fashionfussion.in/ | grep -q 'data-canonical-host'

      - name: Install Chromium smoke runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify www redirects human browsers to apex
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          await page.goto('https://www.fashionfussion.in/cart.html?from=www-test#cart', { waitUntil: 'domcontentloaded', timeout: 30000 });
          await page.waitForURL(url => url.hostname === 'fashionfussion.in' && url.pathname === '/cart.html', { timeout: 10000 });
          const url = new URL(page.url());
          if (url.searchParams.get('from') !== 'www-test' || url.hash !== '#cart') throw new Error(`www canonical redirect lost path/query/hash: ${url.href}`);
          console.log(`PASS human www redirect -> ${url.href}`);
          await browser.close();
          NODE

      - name: Public pages browser test on Cloudflare production
        env:
          SMOKE_BASE_URL: https://fashionfussion.in
        run: node scripts/public_launch_smoke.js

      - name: Customer journey browser test on Cloudflare production
        env:
          SMOKE_BASE_URL: https://fashionfussion.in
        run: node scripts/browser_smoke.js
