name: Production Freshness
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-production-sha:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for Vercel production to match main
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_URL: https://fashion-fussion-olive.vercel.app/api/release
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            body="$(curl --fail --silent --show-error --max-time 10 -H 'Cache-Control: no-cache' "$RELEASE_URL?check=$attempt" || true)"
            live_sha="$(node -e "try{const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.git_sha||''))}catch{}" "$body")"
            echo "Attempt $attempt: live=${live_sha:-missing} expected=$EXPECTED_SHA"
            if [ "$live_sha" = "$EXPECTED_SHA" ]; then
              echo "Production is serving the exact main commit."
              exit 0
            fi
            sleep 10
          done
          echo "Production did not update to $EXPECTED_SHA. Check the Vercel Git connection/deployment settings before treating main as live." >&2
          exit 1
