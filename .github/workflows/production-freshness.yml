name: Cloudflare Production Customer Smoke

on:
  push:
    branches: [cloudflare-customer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-customer:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for exact Cloudflare production commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_URL: https://fashionfussion.in/release.json
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            body="$(curl --fail --silent --show-error --max-time 10 -H 'Cache-Control: no-cache' "$RELEASE_URL?check=$attempt" || true)"
            live_sha="$(node -e "try{const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.git_sha||''))}catch{}" "$body")"
            echo "Attempt $attempt: Cloudflare live=${live_sha:-missing} expected=$EXPECTED_SHA"
            if [ "$live_sha" = "$EXPECTED_SHA" ]; then
              echo "Cloudflare production is serving the exact customer commit."
              exit 0
            fi
            sleep 5
          done
          echo "Cloudflare production did not update to $EXPECTED_SHA." >&2
          exit 1

      - name: Verify apex and www are reachable
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://fashionfussion.in/ | grep -q 'Fashion Fussion'
          curl --fail --silent --show-error --max-time 20 https://www.fashionfussion.in/ | grep -q 'data-canonical-host'
          curl --fail --silent --show-error --max-time 20 https://www.fashionfussion.in/canonical-host.js | grep -q 'www.fashionfussion.in'

      - name: Install Chromium smoke runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Public pages browser test on Cloudflare production
        env:
          SMOKE_BASE_URL: https://fashionfussion.in
        run: node scripts/public_launch_smoke.js

      - name: Customer journey browser test on Cloudflare production
        env:
          SMOKE_BASE_URL: https://fashionfussion.in
        run: node scripts/browser_smoke.js

      - name: Diagnose and verify www human browser canonicalization
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage();
              const messages=[];
              page.on('console', msg=>messages.push(`console ${msg.type()}: ${msg.text()}`));
              page.on('pageerror', err=>messages.push(`pageerror: ${err.message}`));
              page.on('requestfailed', req=>messages.push(`requestfailed ${req.url()}: ${req.failure()?.errorText||''}`));
              const response = await page.goto('https://www.fashionfussion.in/cart.html?from=www-test#cart', { waitUntil: 'domcontentloaded', timeout: 30000 });
              console.log(`www initial response=${response?.status()} final=${page.url()}`);
              const script = await page.locator('script[data-canonical-host]').getAttribute('src').catch(()=>null);
              console.log(`canonical script=${script||'missing'}`);
              const host = await page.evaluate(()=>location.hostname);
              console.log(`browser hostname=${host}`);
              await page.waitForTimeout(1500);
              const final = new URL(page.url());
              for(const message of messages) console.log(message);
              if(final.hostname !== 'fashionfussion.in') throw new Error(`www browser remained on ${final.href}`);
              if(final.pathname !== '/cart.html' || final.searchParams.get('from') !== 'www-test' || final.hash !== '#cart') throw new Error(`www canonical redirect lost path/query/hash: ${final.href}`);
              console.log(`PASS human www redirect -> ${final.href}`);
            } finally {
              await browser.close();
            }
          })().catch(err=>{console.error(err.stack||err);process.exit(1)});
          NODE
