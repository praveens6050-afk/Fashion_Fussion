name: Cloudflare Production Admin Smoke

on:
  push:
    branches: [cloudflare-admin]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for exact Cloudflare production commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_URL: https://admin.fashionfussion.in/release.json
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            body="$(curl --fail --silent --show-error --max-time 10 -H 'Cache-Control: no-cache' "$RELEASE_URL?check=$attempt" || true)"
            live_sha="$(node -e "try{const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.git_sha||''))}catch{}" "$body")"
            echo "Attempt $attempt: Cloudflare live=${live_sha:-missing} expected=$EXPECTED_SHA"
            if [ "$live_sha" = "$EXPECTED_SHA" ]; then
              echo 'Cloudflare production is serving the exact Admin commit.'
              exit 0
            fi
            sleep 5
          done
          echo "Cloudflare Admin production did not update to $EXPECTED_SHA." >&2
          exit 1

      - name: Verify Admin pages and security headers
        run: |
          set -euo pipefail
          for path in /login /admin /admin-account /reset-password; do
            body="$(curl --fail --silent --show-error --max-time 20 -L "https://admin.fashionfussion.in$path")"
            printf '%s' "$body" | grep -qi '<html'
            echo "PASS $path"
          done
          headers="$(curl --fail --silent --show-error --max-time 20 -I https://admin.fashionfussion.in/login)"
          printf '%s\n' "$headers" | grep -qi '^x-content-type-options: nosniff'
          printf '%s\n' "$headers" | grep -qi '^x-frame-options: DENY'
          printf '%s\n' "$headers" | grep -qi '^strict-transport-security:'
          printf '%s\n' "$headers" | grep -qi '^content-security-policy:'

      - name: Verify Admin API boundary and payout readiness
        env:
          LOGIN_GUARD_URL: https://gmdevprqtvoshbbytsxf.supabase.co/functions/v1/admin-login-guard
        run: |
          set -euo pipefail
          guard_get="$(curl --silent --show-error --output /tmp/admin-guard-get --write-out '%{http_code}' --max-time 20 "$LOGIN_GUARD_URL")"
          test "$guard_get" = '405'
          guard_options="$(curl --silent --show-error --output /tmp/admin-guard-options --write-out '%{http_code}' --max-time 20 -X OPTIONS -H 'Origin: https://admin.fashionfussion.in' -H 'Access-Control-Request-Method: POST' "$LOGIN_GUARD_URL")"
          test "$guard_options" = '204'
          guard_invalid="$(curl --silent --show-error --output /tmp/admin-guard-invalid --write-out '%{http_code}' --max-time 20 -X POST -H 'Origin: https://admin.fashionfussion.in' -H 'Content-Type: application/json' --data '{"email":"invalid"}' "$LOGIN_GUARD_URL")"
          test "$guard_invalid" = '400'
          unknown="$(curl --silent --show-error --output /tmp/admin-unknown-body --write-out '%{http_code}' --max-time 20 https://admin.fashionfussion.in/api/cloudflare-smoke-not-found)"
          test "$unknown" = '404'
          payout="$(curl --fail --silent --show-error --max-time 20 https://admin.fashionfussion.in/api/seller-payout)"
          node -e "const x=JSON.parse(process.argv[1]);if(x.ok!==true||typeof x.configured!=='boolean'||!['disabled','gateway'].includes(x.mode))process.exit(1);if('gateway' in x||'direct_enabled' in x)process.exit(1)" "$payout"
          echo 'PASS Admin Edge login guard, Cloudflare API boundary and gateway-only payout readiness (GET only; no payout performed)'

      - name: Install Chromium human-smoke runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Human browser journey on live Admin production
        run: node .github/live-admin-browser-smoke.cjs
