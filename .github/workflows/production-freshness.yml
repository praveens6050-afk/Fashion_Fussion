name: Cloudflare Production Customer Smoke

on:
  push:
    branches: [cloudflare-customer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-customer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for exact Cloudflare production commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_URL: https://www.fashionfussion.in/release.json
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            body="$(curl --fail --silent --show-error --max-time 10 -H 'Cache-Control: no-cache' "$RELEASE_URL?check=$attempt" || true)"
            live_sha="$(node -e "try{const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.git_sha||''))}catch{}" "$body")"
            echo "Attempt $attempt: Cloudflare live=${live_sha:-missing} expected=$EXPECTED_SHA"
            if [ "$live_sha" = "$EXPECTED_SHA" ]; then
              echo "Cloudflare production is serving the exact customer commit."
              exit 0
            fi
            sleep 5
          done
          echo "Cloudflare production did not update to $EXPECTED_SHA." >&2
          exit 1

      - name: Verify production domains and security headers
        run: |
          set -euo pipefail
          home="$(curl --fail --silent --show-error --max-time 20 https://www.fashionfussion.in/)"
          grep -Eq 'Fashion[ _]Fussion' <<<"$home"
          apex_headers="$(curl --silent --show-error --max-time 20 -I https://fashionfussion.in/)"
          grep -Eq '^HTTP/[^ ]+ 301' <<<"$apex_headers"
          grep -qi '^location: https://www\.fashionfussion\.in/' <<<"$apex_headers"
          headers="$(curl --fail --silent --show-error --max-time 20 -I https://www.fashionfussion.in/)"
          grep -qi '^x-content-type-options: nosniff' <<<"$headers"
          grep -qi '^content-security-policy:' <<<"$headers"

      - name: Verify private-route cache and indexing headers
        run: |
          node - <<'NODE'
          (async()=>{
            const base='https://www.fashionfussion.in';
            const privateRoutes=['/account','/cart','/checkout','/quote-checkout','/login','/signup','/reset-password','/wishlist','/notifications','/coupons','/gift-cards','/order-confirmation','/order-details'];
            for(const path of privateRoutes){
              const response=await fetch(base+path,{redirect:'follow'});
              if(!response.ok) throw new Error(`${path} returned ${response.status}`);
              const cache=String(response.headers.get('cache-control')||'').toLowerCase();
              const robots=String(response.headers.get('x-robots-tag')||'').toLowerCase();
              if(!cache.includes('no-store')) throw new Error(`${path} missing no-store: ${cache}`);
              if(!robots.includes('noindex')||!robots.includes('nofollow')||!robots.includes('noarchive')) throw new Error(`${path} missing private X-Robots-Tag: ${robots}`);
              console.log(`PASS private headers ${path}`);
            }
            for(const path of ['/search','/product']){
              const response=await fetch(base+path,{redirect:'follow'});
              if(!response.ok) throw new Error(`${path} returned ${response.status}`);
              const robots=String(response.headers.get('x-robots-tag')||'').toLowerCase();
              if(!robots.includes('noindex')) throw new Error(`${path} missing noindex: ${robots}`);
              console.log(`PASS noindex ${path}`);
            }
            const home=await fetch(base+'/');
            const homeCsp=String(home.headers.get('content-security-policy')||'');
            if(/style-src[^;]*'unsafe-inline'/i.test(homeCsp)) throw new Error('Homepage unexpectedly allows unsafe-inline styles');
            if(/cdn\.razorpay\.com/i.test(homeCsp)) throw new Error('Homepage unexpectedly allows Razorpay risk script CDN');
            for(const path of ['/checkout','/quote-checkout']){
              const response=await fetch(base+path,{redirect:'follow'});
              const csp=String(response.headers.get('content-security-policy')||'');
              if(!/style-src[^;]*'unsafe-inline'/i.test(csp)) throw new Error(`${path} missing Razorpay inline-style CSP allowance`);
              if(!/cdn\.razorpay\.com/i.test(csp)) throw new Error(`${path} missing Razorpay risk script CDN`);
              console.log(`PASS payment CSP ${path}`);
            }
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - name: Customer critical-page smoke
        run: |
          node - <<'NODE'
          (async()=>{
            const pages=[
              ['/',/Fashion[ _]Fussion/i],
              ['/search?q=shirt',/(Search|Browse products)/i],
              ['/cart',/(Cart|Shopping cart)/i],
              ['/login',/(Sign in|Login)/i],
              ['/signup',/(Create|Sign up|Register)/i],
              ['/product',/(Product|Loading)/i]
            ];
            for (const [path,marker] of pages) {
              const response=await fetch('https://www.fashionfussion.in'+path,{redirect:'follow'});
              if(!response.ok) throw new Error(`${path} returned ${response.status}`);
              const text=await response.text();
              if(!marker.test(text)) throw new Error(`${path} missing expected page marker ${marker}`);
              if(!/<html/i.test(text)||!/<body/i.test(text)) throw new Error(`${path} did not return an HTML document`);
              console.log(`PASS ${path}: ${response.status}`);
            }
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - name: Customer API boundary smoke
        run: |
          node - <<'NODE'
          (async()=>{
            const base='https://www.fashionfussion.in';
            const shipping=await fetch(base+'/api/shipping-status',{
              method:'POST',
              headers:{'content-type':'application/json',authorization:'Bearer invalid-production-smoke-token'},
              body:'{}'
            });
            const body=await shipping.text();
            if(shipping.status>=500) throw new Error(`shipping-status server error ${shipping.status}: ${body}`);
            if(/configuration is missing/i.test(body)) throw new Error(`Customer runtime configuration missing: ${body}`);
            const unknown=await fetch(base+'/api/cloudflare-smoke-not-found',{method:'POST'});
            if(unknown.status!==404) throw new Error(`Unknown API route expected 404, got ${unknown.status}`);
            console.log(`PASS API auth/config boundary: ${shipping.status}; unknown route 404`);
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - name: Product SEO and sitemap smoke
        run: |
          node - <<'NODE'
          (async()=>{
            const base='https://www.fashionfussion.in';
            const sitemap=await fetch(base+'/api/product-sitemap',{redirect:'follow'});
            const sitemapText=await sitemap.text();
            if(!sitemap.ok) throw new Error(`product sitemap returned ${sitemap.status}: ${sitemapText.slice(0,200)}`);
            const sitemapType=String(sitemap.headers.get('content-type')||'').toLowerCase();
            if(!sitemapType.includes('application/xml')) throw new Error(`product sitemap content-type is ${sitemapType}`);
            if(!/<urlset\b/i.test(sitemapText)) throw new Error('product sitemap missing urlset');
            const loc=sitemapText.match(/<loc>(https:\/\/www\.fashionfussion\.in\/product\?id=(\d+))<\/loc>/i);
            if(!loc) throw new Error('product sitemap has no canonical www product URL');
            const productUrl=loc[1];
            const productId=loc[2];

            const product=await fetch(productUrl,{redirect:'follow'});
            const html=await product.text();
            if(!product.ok) throw new Error(`indexed product returned ${product.status}`);
            const robots=String(product.headers.get('x-robots-tag')||'').toLowerCase();
            if(robots.includes('noindex')||!robots.includes('index')||!robots.includes('follow')) throw new Error(`indexed product robots header is ${robots}`);
            const link=String(product.headers.get('link')||'');
            if(!link.includes(`<${productUrl}>`)||!/rel="?canonical"?/i.test(link)) throw new Error(`indexed product canonical header is ${link}`);
            const csp=String(product.headers.get('content-security-policy')||'');
            if(!/script-src[^;]*'nonce-[^']+'/i.test(csp)) throw new Error('indexed product CSP missing JSON-LD nonce');
            if(!html.includes('data-seo-rendered="true"')) throw new Error('indexed product was not edge-rendered');
            if(!html.includes(`data-seo-product-id="${productId}"`)) throw new Error('indexed product id marker mismatch');
            if(!html.includes(`href="${productUrl}" data-product-seo="canonical"`)) throw new Error('indexed product HTML canonical mismatch');
            if(!/property="og:title"/i.test(html)||!/property="og:description"/i.test(html)) throw new Error('indexed product missing Open Graph metadata');
            const schemaMatch=html.match(/<script[^>]*data-product-schema[^>]*>([\s\S]*?)<\/script>/i);
            if(!schemaMatch) throw new Error('indexed product missing Product JSON-LD');
            const schema=JSON.parse(schemaMatch[1]);
            if(schema['@type']!=='Product'||!schema.name||schema.url!==productUrl) throw new Error('Product JSON-LD identity is invalid');
            for(const forbidden of ['aggregateRating','review','offers','cost']){
              if(Object.prototype.hasOwnProperty.call(schema,forbidden)) throw new Error(`Product JSON-LD unexpectedly exposes ${forbidden}`);
            }

            const missing=await fetch(base+'/product?id=999999999999',{redirect:'manual'});
            if(missing.status!==404) throw new Error(`missing product expected 404, got ${missing.status}`);
            const missingRobots=String(missing.headers.get('x-robots-tag')||'').toLowerCase();
            if(!missingRobots.includes('noindex')) throw new Error(`missing product is indexable: ${missingRobots}`);

            const robotsTxt=await fetch(base+'/robots.txt');
            const robotsText=await robotsTxt.text();
            if(!robotsTxt.ok||!robotsText.includes('Sitemap: https://www.fashionfussion.in/api/product-sitemap')) throw new Error('robots.txt missing www product sitemap declaration');
            console.log(`PASS product SEO ${productUrl}, dynamic sitemap, missing-product noindex`);
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - name: Cross-panel Cloudflare smoke
        env:
          CUSTOMER_URL: https://www.fashionfussion.in
          ADMIN_URL: https://admin.fashionfussion.in
          SELLER_URL: https://seller.fashionfussion.in
        run: node .github/cloudflare-smoke.mjs

      - name: Install Chromium human-smoke runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Human browser journey on live Customer production
        run: node .github/live-customer-browser-smoke.cjs
