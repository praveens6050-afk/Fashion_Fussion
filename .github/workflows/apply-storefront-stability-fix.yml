name: Apply storefront stability fix

on:
  push:
    branches:
      - storefront-stability-20260909
    paths:
      - .github/workflows/apply-storefront-stability-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stability branch
        uses: actions/checkout@v4
        with:
          ref: storefront-stability-20260909
          fetch-depth: 0

      - name: Apply guarded storefront repair
        run: python scripts/apply_storefront_stability_fix.py

      - name: Validate storefront source invariants
        run: |
          grep -q 'Fashion_Fussion' index.html
          grep -q '₹299' index.html
          ! grep -q '₹599' index.html
          grep -q '24×7' index.html
          ! grep -q '9am–7pm' index.html
          grep -q 'Dispatch within 3 days' index.html
          ! grep -q 'Same-week dispatch' index.html
          grep -q 'slots.length < 4' index.html
          grep -q 'Promise.allSettled' index.html
          grep -q 'storeInitializationStarted' index.html
          ! grep -q 'forceStorefrontCopy' supabase-config.js
          ! grep -q 'MutationObserver' supabase-config.js
          ! grep -q 'storefront-branding.js' supabase-config.js
          ! grep -q 'storefront-consistency.js' supabase-config.js

      - name: Commit storefront repair
        run: |
          if git diff --quiet -- index.html supabase-config.js; then
            echo 'No storefront changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html supabase-config.js
          git commit -m 'Stabilize storefront hero and initialization'
          git push origin HEAD:storefront-stability-20260909
