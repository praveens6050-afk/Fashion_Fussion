name: Product Image Production Smoke

on:
  push:
    branches: [cloudflare-customer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for exact Cloudflare production commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_URL: https://www.fashionfussion.in/release.json
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            body="$(curl --fail --silent --show-error --max-time 10 -H 'Cache-Control: no-cache' "$RELEASE_URL?product-image-check=$attempt" || true)"
            live_sha="$(node -e "try{const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.git_sha||''))}catch{}" "$body")"
            echo "Attempt $attempt: Cloudflare live=${live_sha:-missing} expected=$EXPECTED_SHA"
            if [ "$live_sha" = "$EXPECTED_SHA" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Cloudflare production did not update to $EXPECTED_SHA." >&2
          exit 1

      - name: Verify product image routes
        run: |
          node - <<'NODE'
          (async()=>{
            const base='https://www.fashionfussion.in';
            for(const id of [34,35,36]){
              const url=`${base}/images/products/${id}`;
              const response=await fetch(url,{redirect:'follow'});
              const type=String(response.headers.get('content-type')||'').toLowerCase();
              const bytes=Buffer.from(await response.arrayBuffer());
              if(!response.ok) throw new Error(`${url} returned ${response.status}: ${bytes.toString('utf8',0,200)}`);
              if(!type.startsWith('image/')) throw new Error(`${url} returned non-image content-type ${type}`);
              if(bytes.length<1000) throw new Error(`${url} returned suspiciously small image (${bytes.length} bytes)`);
              console.log(`PASS product ${id} image: ${response.status} ${type} ${bytes.length} bytes`);
            }
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
