name: Audit runtime privacy fixes once
on:
  push:
    branches: [audit-runtime-privacy-fixes-20260910]
    paths: [.github/workflows/audit-runtime-privacy-fixes-once.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-runtime-privacy-fixes-20260910
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply audited patch
        env:
          PATCH_B64:  
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/audit.patch
          git apply /tmp/audit.patch
      - name: Verify fixes
        run: |
          node scripts/check_source.js
          (cd backend && npm test && npm run check)
      - name: Commit fixes
        run: |
          rm -f .github/workflows/audit-runtime-privacy-fixes-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix session refresh and browser PII persistence"
          git push origin HEAD:audit-runtime-privacy-fixes-20260910
