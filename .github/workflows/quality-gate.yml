name: Quality Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, production-hardening-cod-20260909, ux/desktop-commerce-v1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Source checks
        run: node scripts/check_source.js
      - name: Variant and inventory source checks
        run: node scripts/check_inventory_source.js
      - name: Backend syntax
        working-directory: backend
        run: npm run check
      - name: Backend pricing tests
        working-directory: backend
        run: npm test
      - name: Install Chromium smoke-test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Desktop browser smoke test
        run: |
          python3 -m http.server 4173 >/tmp/fashion-fussion-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node scripts/browser_smoke.js
          node scripts/order_details_smoke.js
          node scripts/return_exchange_smoke.js
