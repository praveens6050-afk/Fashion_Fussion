name: Quality Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, production-hardening-cod-20260909, ux/desktop-commerce-v1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Verify pinned Supabase SDK integrity
        run: |
          set -euo pipefail
          expected='sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP'
          tmp="$(mktemp -d)"
          cd "$tmp"
          tgz="$(npm pack --silent @supabase/supabase-js@2.116.0)"
          tar -xzf "$tgz"
          test -f package/dist/umd/supabase.js
          actual="sha384-$(openssl dgst -sha384 -binary package/dist/umd/supabase.js | openssl base64 -A)"
          test "$actual" = "$expected"
          echo "Pinned Supabase SDK integrity verified: $actual"
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets = [
              *(Path('customer-panel') / name for name in [
                  'gift-cards.html', 'reset-password.html', 'checkout.html',
                  'order-confirmation.html', 'account.html', 'order-details.html',
                  'product.html', 'search.html', 'index.html', 'signup.html',
                  'login.html', 'notifications.html', 'quote-checkout.html',
                  'cart.html', 'coupons.html', 'wishlist.html'
              ]),
              Path('admin-panel/admin.html'),
              Path('admin-panel/admin-account.html'),
              Path('admin-panel/login.html'),
              Path('seller-panel/index.html'),
              Path('seller-panel/login.html'),
          ]
          sri = 'sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP'
          allowed = {
              'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js',
              'https://unpkg.com/@supabase/supabase-js@2.116.0/dist/umd/supabase.js',
          }
          tag_re = re.compile(r'<script\b[^>]*\bsrc=["\']([^"\']*supabase-js[^"\']*)["\'][^>]*>', re.I)
          errors = []
          for path in targets:
              if not path.exists():
                  errors.append(f'{path}: missing')
                  continue
              text = path.read_text(encoding='utf-8')
              tags = tag_re.findall(text)
              if len(tags) != 1 or tags[0] not in allowed:
                  errors.append(f'{path}: expected exactly one pinned Supabase 2.116.0 SDK tag from an approved CDN')
              full_tag = next(iter(re.finditer(r'<script\b[^>]*\bsrc=["\'][^"\']*supabase-js[^"\']*["\'][^>]*>', text, re.I)), None)
              if not full_tag or f'integrity="{sri}"' not in full_tag.group(0) or 'crossorigin="anonymous"' not in full_tag.group(0):
                  errors.append(f'{path}: pinned Supabase SDK tag must keep exact SRI and anonymous CORS')
              if re.search(r'@supabase/supabase-js@(?!2\.116\.0)', text):
                  errors.append(f'{path}: unpinned or wrong Supabase SDK version detected')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'Pinned Supabase SDK tags verified on {len(targets)} panel pages.')
          PY
      - name: Prepare Customer CSP verification view
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('.')
          source = Path('customer-panel')
          skip = {'customer-browser-compat.js'}
          for src in source.iterdir():
              if src.is_file() and src.name not in skip:
                  shutil.copy2(src, root / src.name)
          print('Customer panel projected into temporary CSP verification root.')
          PY
      - name: Strict Customer CSP hardening source checks
        run: node scripts/check_csp_hardening.js
      - name: Complete Customer verification fixtures
        run: cp customer-panel/customer-browser-compat.js customer-browser-compat.js
      - name: Add Admin verification fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          source = Path('admin-panel')
          prefixes = ('admin', 'csp-admin', 'desktop-admin', 'runtime-admin')
          for src in source.iterdir():
              if src.is_file() and src.name.startswith(prefixes):
                  shutil.copy2(src, Path(src.name))
          print('Admin fixtures projected into temporary CI root.')
          PY
      - name: Bridge isolated Admin loader assertions
        run: |
          cat >> supabase-config.js <<'EOF'
          // CI-only compatibility markers for the legacy combined-root source guards.
          // Production Customer code remains isolated from Admin runtimes.
          // page==='admin.html'
          // admin-business-quotes.js?v=3','data-admin-business-quotes
          // admin-inventory.js?v=1','data-admin-inventory
          // admin-catalog-safety.js?v=1','data-admin-catalog-safety
          EOF
      - name: Source checks
        run: node scripts/check_source.js
      - name: Variant and inventory source checks
        run: node scripts/check_inventory_source.js
      - name: Checkout readiness source checks
        run: node scripts/check_checkout_readiness_source.js
      - name: Production release source checks
        run: node scripts/check_release_source.js
      - name: Database hardening source checks
        run: node scripts/check_database_hardening_source.js
      - name: Public launch contract checks
        run: node scripts/check_public_launch_contract.js
      - name: Exhaustive backend and API syntax
        run: node scripts/check_all_backend_syntax.js
      - name: Backend pricing tests
        working-directory: backend
        run: npm test
      - name: Install Chromium smoke-test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Desktop browser smoke test
        run: |
          python3 -m http.server 4173 >/tmp/fashion-fussion-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node scripts/browser_smoke.js
          node scripts/catalog_variant_smoke.js
          node scripts/order_details_smoke.js
          node scripts/return_exchange_smoke.js
          node scripts/account_cancellation_smoke.js
          node scripts/public_launch_smoke.js
