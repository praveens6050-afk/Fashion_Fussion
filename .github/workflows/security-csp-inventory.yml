name: Security CSP Inventory
on:
  push:
    branches: [security/full-audit-hardening]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Inventory inline CSP dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          total = [0,0,0,0,0]
          print('HTML INLINE INVENTORY')
          print('file\tinline_scripts\tstyle_blocks\tstyle_attrs\tevent_attrs\tjavascript_urls')
          for p in sorted(Path('.').glob('*.html')):
              text = p.read_text(encoding='utf-8')
              scripts = len(re.findall(r'<script(?![^>]*\bsrc=)[^>]*>[\s\S]*?</script\s*>', text, re.I))
              styles = len(re.findall(r'<style\b[^>]*>[\s\S]*?</style\s*>', text, re.I))
              style_attrs = len(re.findall(r'\sstyle\s*=\s*(["\']).*?\1', text, re.I|re.S))
              event_attrs = len(re.findall(r'\son[a-z0-9_-]+\s*=\s*(["\']).*?\1', text, re.I|re.S))
              js_urls = len(re.findall(r'(?:href|src)\s*=\s*(["\'])\s*javascript:', text, re.I))
              vals = [scripts,styles,style_attrs,event_attrs,js_urls]
              if any(vals):
                  print(f'{p}\t' + '\t'.join(map(str, vals)))
              total = [a+b for a,b in zip(total,vals)]
          print('TOTAL\t' + '\t'.join(map(str,total)))

          print('\nCSSOM / DYNAMIC INLINE STYLE INVENTORY')
          cssom_total = 0
          set_style_total = 0
          for p in sorted(list(Path('.').glob('*.js')) + list(Path('scripts').glob('*.js')) + list(Path('backend').glob('*.js')) + list(Path('api').glob('*.js')) + list(Path('.').glob('*.html'))):
              text = p.read_text(encoding='utf-8')
              cssom = len(re.findall(r'\.style(?:\.|\[)', text))
              set_style = len(re.findall(r'(?:setAttribute|setAttributeNS)\s*\(\s*["\']style["\']', text, re.I))
              if cssom or set_style:
                  print(f'{p}\tstyle_api={cssom}\tset_style_attr={set_style}')
              cssom_total += cssom
              set_style_total += set_style
          print(f'CSSOM_TOTAL\tstyle_api={cssom_total}\tset_style_attr={set_style_total}')
          PY
