name: Security CSP Inventory
on:
  push:
    branches: [security/full-audit-hardening]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Inventory inline CSP dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          print('HTML INLINE INVENTORY')
          total=[0,0,0,0,0]
          for p in sorted(Path('.').glob('*.html')):
              text=p.read_text(encoding='utf-8')
              vals=[
                len(re.findall(r'<script(?![^>]*\bsrc=)[^>]*>[\s\S]*?</script\s*>',text,re.I)),
                len(re.findall(r'<style\b[^>]*>[\s\S]*?</style\s*>',text,re.I)),
                len(re.findall(r'\sstyle\s*=\s*(["\']).*?\1',text,re.I|re.S)),
                len(re.findall(r'\son[a-z0-9_-]+\s*=\s*(["\']).*?\1',text,re.I|re.S)),
                len(re.findall(r'(?:href|src)\s*=\s*(["\'])\s*javascript:',text,re.I)),
              ]
              if any(vals): print(f'{p}: scripts={vals[0]} styles={vals[1]} style_attrs={vals[2]} events={vals[3]} js_urls={vals[4]}')
              total=[a+b for a,b in zip(total,vals)]
          print('HTML_TOTAL',total)

          print('\nEXACT DYNAMIC STYLE STRINGS')
          style_re=re.compile(r'\sstyle\s*=\s*(["\'])(.*?)\1',re.I|re.S)
          for p in sorted(Path('.').glob('*.js')):
              text=p.read_text(encoding='utf-8')
              matches=list(style_re.finditer(text))
              css_text=[m.start() for m in re.finditer(r'\.style\.cssText\s*=',text)]
              if not matches and not css_text: continue
              print(f'FILE {p}')
              for i,m in enumerate(matches,1):
                  value=' '.join(m.group(2).split())
                  print(f'  style#{i}: {value[:700]}')
              for i,pos in enumerate(css_text,1):
                  lo=max(0,pos-180); hi=min(len(text),pos+500)
                  snippet=' '.join(text[lo:hi].split())
                  print(f'  cssText#{i}: {snippet}')
          PY
