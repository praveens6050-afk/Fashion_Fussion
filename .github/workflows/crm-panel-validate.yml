name: CRM panel contract validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'admin-panel/**'
      - 'supabase/functions/crm-*/**'
      - 'supabase/migrations/202610191*.sql'
      - 'supabase/config.toml'
      - 'scripts/check_crm_panel_contract.js'
      - '.github/workflows/crm-panel-validate.yml'
  push:
    branches: [crm-team-access]
    paths:
      - '.github/workflows/crm-panel-validate.yml'
      - 'admin-panel/**'
      - 'supabase/functions/crm-*/**'
      - 'supabase/migrations/202610191*.sql'
      - 'supabase/config.toml'
      - 'scripts/check_crm_panel_contract.js'
jobs:
  crm-static-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify CRM contract
        run: node scripts/check_crm_panel_contract.js
      - uses: denoland/setup-deno@v2
      - name: Check JavaScript and TypeScript syntax
        run: |
          node --check admin-panel/crm-auth.js
          node --check admin-panel/crm-unified-inbox.js
          node --check admin-panel/crm-team-management.js
          deno check --no-lock supabase/functions/crm-send-reply/index.ts
      - name: Validate CRM migrations on disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d crm_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $role$ BEGIN
            CREATE ROLE anon NOLOGIN;
            EXCEPTION WHEN duplicate_object THEN NULL;
          END $role$;
          DO $role$ BEGIN
            CREATE ROLE authenticated NOLOGIN;
            EXCEPTION WHEN duplicate_object THEN NULL;
          END $role$;
          DO $role$ BEGIN
            CREATE ROLE service_role NOLOGIN BYPASSRLS;
            EXCEPTION WHEN duplicate_object THEN NULL;
          END $role$;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY, email text);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $uid$ SELECT NULL::uuid $uid$;
          CREATE TABLE public.profiles (id uuid PRIMARY KEY, is_admin boolean DEFAULT false, phone text);
          CREATE TABLE public.seller_profiles (user_id uuid, phone text);
          CREATE TABLE public.seller_leads (id bigint generated by default as identity primary key);
          CREATE TABLE public.seller_lead_tasks (id bigint generated by default as identity primary key);
          CREATE TABLE public.seller_lead_activities (id bigint generated by default as identity primary key);
          CREATE TABLE public.support_tickets (
            id bigint generated by default as identity primary key, ticket_code text, channel text, issue_type text,
            subject text, status text, priority text, created_at timestamptz default now(), sla_due_at timestamptz,
            first_response_at timestamptz, resolved_at timestamptz
          );
          CREATE TABLE public.support_ticket_messages (
            id bigint generated by default as identity primary key, ticket_id bigint, created_at timestamptz default now(),
            sender_type text, is_internal boolean default false
          );
          CREATE TABLE public.orders (
            id bigint generated by default as identity primary key, user_id uuid, created_at timestamptz default now(),
            total_amount numeric(12,2) default 0, status text, coupon_code text, coupon_discount numeric(12,2) default 0
          );
          CREATE TABLE public.coupons (id bigint generated by default as identity primary key, code text, is_active boolean default true);
          SQL
          psql -h localhost -U postgres -d crm_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261019100000_crm_team_access.sql
          psql -h localhost -U postgres -d crm_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261019110000_crm_department_modules.sql
          psql -h localhost -U postgres -d crm_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261019130000_crm_unified_inbox.sql
          psql -h localhost -U postgres -d crm_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261019140000_crm_outbound_reply.sql
      - name: Build Cloudflare Pages assets
        working-directory: admin-panel
        run: npm run build
