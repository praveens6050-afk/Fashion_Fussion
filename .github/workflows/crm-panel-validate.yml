name: CRM panel contract validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'admin-panel/**'
      - 'supabase/functions/crm-*/**'
      - 'supabase/migrations/202610191*.sql'
      - 'supabase/config.toml'
      - 'scripts/check_crm_panel_contract.js'
      - '.github/workflows/crm-panel-validate.yml'
  push:
    branches: [crm-team-access]
    paths:
      - '.github/workflows/crm-panel-validate.yml'
      - 'admin-panel/**'
      - 'supabase/functions/crm-*/**'
      - 'supabase/migrations/202610191*.sql'
      - 'supabase/config.toml'
      - 'scripts/check_crm_panel_contract.js'
jobs:
  crm-static-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify CRM contract
        run: node scripts/check_crm_panel_contract.js
      - name: Test WhatsApp attachment pipeline contracts
        run: node --test admin-panel/tests/crm-whatsapp-attachments.test.mjs
      - uses: denoland/setup-deno@v2
      - name: Check JavaScript and TypeScript syntax
        run: |
          node --check admin-panel/crm-auth.js
          node --check admin-panel/crm-unified-inbox.js
          node --check admin-panel/crm-team-management.js
          node --check admin-panel/crm-support-workspace.js
          node --check admin-panel/crm-department-workspaces.js
          deno check --no-lock supabase/functions/crm-inbound-webhook/index.ts
          deno check --no-lock supabase/functions/crm-send-reply/index.ts
          deno check --no-lock supabase/functions/crm-zoho-delivery-sync/index.ts
          deno check --no-lock supabase/functions/crm-whatsapp-media/index.ts
      - name: Validate CRM migrations on disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d crm_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $role$ BEGIN
            CREATE ROLE anon NOLOGIN;
            EXCEPTION WHEN duplicate_object THEN NULL;
          END $role$;
          DO $role$ BEGIN
            CREATE ROLE authenticated NOLOGIN;
            EXCEPTION WHEN duplicate_object THEN NULL;
          END $role$;
          DO $role$ BEGIN
            CREATE ROLE service_role NOLOGIN BYPASSRLS;
            EXCEPTION WHEN duplicate_object THEN NULL;
          END $role$;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY, email text);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $uid$ SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid $uid$;
          CREATE TABLE public.profiles (id uuid PRIMARY KEY, is_admin boolean DEFAULT false, phone text);
          CREATE TABLE public.seller_profiles (user_id uuid, phone text);
          CREATE TABLE public.seller_leads (id bigint generated by default as identity primary key);
          CREATE TABLE public.support_tickets (
            id bigint generated by default as identity primary key, ticket_code text, channel text, issue_type text,
            subject text, status text, priority text, created_at timestamptz default now(), sla_due_at timestamptz,
            first_response_at timestamptz, resolved_at timestamptz
          );
          CREATE TABLE public.support_ticket_messages (
            id bigint generated by default as identity primary key, ticket_id bigint, created_at timestamptz default now(),
            sender_role text, is_internal boolean default false
          );
          CREATE TABLE public.orders (
            id bigint generated by default as identity primary key, user_id uuid, created_at timestamptz default now(),
            total_amount numeric(12,2) default 0, status text, coupon_code text, coupon_discount numeric(12,2) default 0
          );
          CREATE TABLE public.coupons (id bigint generated by default as identity primary key, code text, is_active boolean default true);
          SQL
          psql -h localhost -U postgres -d crm_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261017110000_admin_seller_lead_crm.sql
          psql -h localhost -U postgres -d crm_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261019100000_crm_team_access.sql
          psql -h localhost -U postgres -d crm_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261019110000_crm_department_modules.sql
          psql -h localhost -U postgres -d crm_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261019130000_crm_unified_inbox.sql
          psql -h localhost -U postgres -d crm_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261019140000_crm_outbound_reply.sql
          psql -h localhost -U postgres -d crm_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users(id,email) VALUES
            ('00000000-0000-4000-8000-000000000001','customer-support@test.invalid'),
            ('00000000-0000-4000-8000-000000000002','seller-support@test.invalid'),
            ('00000000-0000-4000-8000-000000000003','sales@test.invalid'),
            ('00000000-0000-4000-8000-000000000004','marketing@test.invalid'),
            ('00000000-0000-4000-8000-000000000005','admin@test.invalid');
          INSERT INTO public.profiles(id,is_admin,phone) VALUES
            ('00000000-0000-4000-8000-000000000001',false,null),
            ('00000000-0000-4000-8000-000000000002',false,null),
            ('00000000-0000-4000-8000-000000000003',false,null),
            ('00000000-0000-4000-8000-000000000004',false,null),
            ('00000000-0000-4000-8000-000000000005',true,null);
          INSERT INTO public.crm_team_members(user_id,email,role,is_active) VALUES
            ('00000000-0000-4000-8000-000000000001','customer-support@test.invalid','customer_support',true),
            ('00000000-0000-4000-8000-000000000002','seller-support@test.invalid','seller_support',true),
            ('00000000-0000-4000-8000-000000000003','sales@test.invalid','sales',true),
            ('00000000-0000-4000-8000-000000000004','marketing@test.invalid','marketing',true);
          INSERT INTO public.crm_inbox_conversations(provider,provider_message_id,department,latest_message,inbox_address) VALUES
            ('email','rls-customer-1','customer_support','customer msg','customer.care@fashionfussion.in'),
            ('email','rls-seller-1','seller_support','seller msg','seller.support@fashionfussion.in'),
            ('email','rls-sales-1','sales','sales msg','sales.team@fashionfussion.in'),
            ('email','rls-marketing-1','marketing','marketing msg','marketing@fashionfussion.in');
          INSERT INTO public.crm_inbox_messages(conversation_id,provider_message_id,direction,body)
            SELECT id,provider_message_id,'inbound',latest_message FROM public.crm_inbox_conversations
            WHERE provider_message_id LIKE 'rls-%';
          SET ROLE authenticated;
          SET request.jwt.claim.sub = '00000000-0000-4000-8000-000000000001';
          DO $test$ DECLARE c integer; m integer; BEGIN
            SELECT count(*) INTO c FROM public.crm_inbox_conversations;
            SELECT count(*) INTO m FROM public.crm_inbox_messages;
            IF c <> 1 OR m <> 1 THEN RAISE EXCEPTION 'customer support RLS leak: conversations %, messages %', c, m; END IF;
          END $test$;
          SET request.jwt.claim.sub = '00000000-0000-4000-8000-000000000002';
          DO $test$ DECLARE c integer; BEGIN
            SELECT count(*) INTO c FROM public.crm_inbox_conversations;
            IF c <> 1 OR EXISTS(SELECT 1 FROM public.crm_inbox_conversations WHERE department <> 'seller_support') THEN RAISE EXCEPTION 'seller support RLS leak'; END IF;
          END $test$;
          SET request.jwt.claim.sub = '00000000-0000-4000-8000-000000000003';
          DO $test$ DECLARE c integer; BEGIN
            SELECT count(*) INTO c FROM public.crm_inbox_conversations;
            IF c <> 1 OR EXISTS(SELECT 1 FROM public.crm_inbox_conversations WHERE department <> 'sales') THEN RAISE EXCEPTION 'sales RLS leak'; END IF;
          END $test$;
          SET request.jwt.claim.sub = '00000000-0000-4000-8000-000000000004';
          DO $test$ DECLARE c integer; BEGIN
            SELECT count(*) INTO c FROM public.crm_inbox_conversations;
            IF c <> 2 OR EXISTS(SELECT 1 FROM public.crm_inbox_conversations WHERE department NOT IN ('sales','marketing')) THEN RAISE EXCEPTION 'marketing shared-inbox RLS mismatch'; END IF;
          END $test$;
          SET request.jwt.claim.sub = '00000000-0000-4000-8000-000000000005';
          DO $test$ DECLARE c integer; BEGIN
            SELECT count(*) INTO c FROM public.crm_inbox_conversations;
            IF c <> 4 THEN RAISE EXCEPTION 'administrator must see all four test conversations, got %', c; END IF;
          END $test$;
          RESET ROLE;
          RESET request.jwt.claim.sub;
          SQL
      - name: Build Cloudflare Pages assets
        working-directory: admin-panel
        run: npm run build
