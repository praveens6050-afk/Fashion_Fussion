name: WhatsApp Order Confirmation Safety
on:
  push:
    branches: [feature/whatsapp-order-confirmation-safe-dispatch]
  pull_request:
    branches: [cloudflare-seller]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  whatsapp-dispatch-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify WhatsApp confirmation dispatch fail-closed tests
        run: node --experimental-default-type=module --test seller-panel/tests/whatsapp-order-confirmation-dispatch.test.mjs
      - name: Verify WhatsApp integration health read-only safety tests
        run: node --experimental-default-type=module --test seller-panel/tests/whatsapp-integration-health.test.mjs
