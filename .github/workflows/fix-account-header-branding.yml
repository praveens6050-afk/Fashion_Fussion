name: Fix account header branding

on:
  push:
    branches:
      - account-header-branding-20260909
    paths:
      - .github/workflows/fix-account-header-branding.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: account-header-branding-20260909
          fetch-depth: 0

      - name: Normalize account title and header logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('account.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>My Account | Fashion_FUSSION</title>', '<title>My Account | Fashion_Fussion</title>')
          s = s.replace('Fashion<span>_FUSSION</span>', 'Fashion<span>_Fussion</span>')
          if 'Fashion_FUSSION' in s or 'Fashion<span>_FUSSION</span>' in s:
              raise SystemExit('old account branding still present')
          if '<title>My Account | Fashion_Fussion</title>' not in s:
              raise SystemExit('new account title missing')
          if 'Fashion<span>_Fussion</span>' not in s:
              raise SystemExit('new account logo missing')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit account branding
        run: |
          if git diff --quiet -- account.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add account.html
          git commit -m 'Normalize account header branding'
          git push origin HEAD:account-header-branding-20260909
