name: Security CSP Fixup
on:
  push:
    branches: [security/full-audit-hardening]
permissions:
  contents: write
concurrency:
  group: security-csp-fixup
  cancel-in-progress: false
jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: security/full-audit-hardening
          fetch-depth: 1
      - name: Externalize inline CSP dependencies
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          html_files = sorted(p for p in Path('.').glob('*.html') if '</head>' in p.read_text(encoding='utf-8').lower())
          root_js_files = sorted(Path('.').glob('*.js'))
          style_block_re = re.compile(r'<style\b[^>]*>([\s\S]*?)</style\s*>', re.I)
          script_block_re = re.compile(r'<script(?![^>]*\bsrc\s*=)([^>]*)>([\s\S]*?)</script\s*>', re.I)
          html_style_attr_re = re.compile(r'(<[A-Za-z][^<>]*?)\sstyle\s*=\s*(["\'])(.*?)\2([^<>]*?>)', re.I | re.S)
          raw_style_attr_re = re.compile(r'\sstyle\s*=\s*(["\'])(.*?)\1', re.I | re.S)
          event_attr_re = re.compile(r'\son[a-z0-9_-]+\s*=\s*(["\'])(.*?)\1', re.I | re.S)
          css_text_re = re.compile(r'(?P<obj>[A-Za-z_$][\w$]*)\.style\.cssText\s*=\s*(?P<q>["\'])(?P<style>.*?)(?P=q)\s*;', re.S)
          dynamic_rules = []
          created_css = 0
          created_js = 0

          def add_rule(key, style):
              style = style.strip()
              if not style:
                  raise SystemExit(f'{key}: empty style')
              if any(x in style for x in ['\'+', '+\'', '${']):
                  raise SystemExit(f'{key}: dynamic style cannot be converted generically: {style[:160]}')
              dynamic_rules.append(f'[data-csp-style="{key}"]{{{style}}}')

          dynamic_rules.extend([
              '[data-csp-style="csp-dyn-ready"]{font-weight:800;color:#118344}',
              '[data-csp-style="csp-dyn-blocked"]{font-weight:800;color:#b42318}',
              '[data-csp-style="csp-refund-good"]{font-size:11px;font-weight:800;color:#118344}',
              '[data-csp-style="csp-refund-bad"]{font-size:11px;font-weight:800;color:#b42318}',
              '[data-csp-style="csp-refund-warn"]{font-size:11px;font-weight:800;color:#9a6700}',
          ])

          def normalize_backend_origin(text):
              text = text.replace("const BACKEND_URL='https://fashion-fussion-olive.vercel.app';", "const BACKEND_URL='';")
              text = text.replace("const BACKEND_URL=location.hostname.endsWith('vercel.app')?location.origin:'https://fashion-fussion-olive.vercel.app';", "const BACKEND_URL='';")
              return text

          for p in root_js_files:
              text = normalize_backend_origin(p.read_text(encoding='utf-8'))
              stem = p.stem

              if p.name == 'admin-launch-readiness.js':
                  old = 'style="font-weight:800;color:\'+(ok?\'#118344\':\'#b42318\')+\'"'
                  new = 'data-csp-style="\'+(ok?\'csp-dyn-ready\':\'csp-dyn-blocked\')+\'"'
                  if old not in text:
                      raise SystemExit('admin-launch-readiness.js: dynamic readiness style pattern missing')
                  text = text.replace(old, new, 1)
              if p.name == 'order-refund-tracker.js':
                  old = 'style="font-size:11px;font-weight:800;color:\'+tone+\'"'
                  new = 'data-csp-style="\'+(tone===\'#118344\'?\'csp-refund-good\':tone===\'#b42318\'?\'csp-refund-bad\':\'csp-refund-warn\')+\'"'
                  if old not in text:
                      raise SystemExit('order-refund-tracker.js: dynamic refund tone pattern missing')
                  text = text.replace(old, new, 1)

              style_index = [0]
              def js_style_repl(m):
                  value = m.group(2)
                  if any(x in value for x in ["'+", "+'", '${']):
                      raise SystemExit(f'{p}: unsupported dynamic style remains: {value[:180]}')
                  style_index[0] += 1
                  key = f'csp-js-{stem}-{style_index[0]}'
                  add_rule(key, value)
                  return f' data-csp-style="{key}"'
              text = raw_style_attr_re.sub(js_style_repl, text)

              css_index = [0]
              def css_text_repl(m):
                  css_index[0] += 1
                  key = f'csp-cssText-{stem}-{css_index[0]}'
                  add_rule(key, m.group('style'))
                  return f"{m.group('obj')}.setAttribute('data-csp-style','{key}');"
              text = css_text_re.sub(css_text_repl, text)
              p.write_text(text, encoding='utf-8')

          for p in html_files:
              text = p.read_text(encoding='utf-8')
              stem = p.stem
              style_index = [0]
              handler_seen = [False]

              def event_repl(m):
                  handler_seen[0] = True
                  handler = m.group(2).replace("\\'", "'").strip()
                  parsed = re.fullmatch(r"this\.outerHTML='<div class=&quot;([^&]+)&quot;>([^<]+)</div>'", handler)
                  if not parsed:
                      raise SystemExit(f'{p}: unsupported inline event handler: {handler[:140]}')
                  cls, label = parsed.groups()
                  return f' data-csp-fallback-class="{cls}" data-csp-fallback-text="{label}"'
              text = event_attr_re.sub(event_repl, text)

              def html_style_repl(m):
                  value = m.group(3)
                  if any(x in value for x in ["'+", "+'", '${']):
                      raise SystemExit(f'{p}: unsupported dynamic HTML style: {value[:180]}')
                  style_index[0] += 1
                  key = f'csp-html-{stem}-{style_index[0]}'
                  add_rule(key, value)
                  return m.group(1) + f' data-csp-style="{key}"' + m.group(4)
              text = html_style_attr_re.sub(html_style_repl, text)

              style_matches = list(style_block_re.finditer(text))
              if len(style_matches) > 1:
                  raise SystemExit(f'{p}: expected at most one style block, found {len(style_matches)}')
              if style_matches:
                  css_path = Path(f'csp-{stem}.css')
                  css_path.write_text(style_matches[0].group(1).strip() + '\n', encoding='utf-8')
                  text = style_block_re.sub(f'<link rel="stylesheet" href="{css_path.name}?v=1">', text, count=1)
                  created_css += 1

              script_matches = list(script_block_re.finditer(text))
              if len(script_matches) > 1:
                  raise SystemExit(f'{p}: expected at most one inline script block, found {len(script_matches)}')
              if script_matches:
                  attrs = script_matches[0].group(1)
                  js = normalize_backend_origin(script_matches[0].group(2).strip() + '\n')
                  if handler_seen[0]:
                      js = "document.addEventListener('error',event=>{const target=event.target;if(!(target instanceof HTMLImageElement))return;const cls=target.dataset.cspFallbackClass;if(!cls)return;const fallback=document.createElement('div');fallback.className=cls;fallback.textContent=target.dataset.cspFallbackText||'Image unavailable';target.replaceWith(fallback)},true);\n" + js
                  js_path = Path(f'csp-{stem}.js')
                  js_path.write_text(js, encoding='utf-8')
                  text = script_block_re.sub(f'<script{attrs} src="{js_path.name}?v=1"></script>', text, count=1)
                  created_js += 1
              elif handler_seen[0]:
                  raise SystemExit(f'{p}: fallback handler conversion requires page script')

              link = '<link rel="stylesheet" href="csp-dynamic.css?v=1">'
              if link not in text:
                  text = text.replace('</head>', link + '</head>', 1)
              p.write_text(text, encoding='utf-8')

          Path('csp-dynamic.css').write_text('\n'.join(dict.fromkeys(dynamic_rules)) + '\n', encoding='utf-8')

          problems = []
          for p in html_files:
              text = p.read_text(encoding='utf-8')
              if style_block_re.search(text): problems.append(f'{p}: inline style block remains')
              if script_block_re.search(text): problems.append(f'{p}: inline script block remains')
              if raw_style_attr_re.search(text): problems.append(f'{p}: style attribute remains')
              if event_attr_re.search(text): problems.append(f'{p}: event handler attribute remains')
              if re.search(r'(?:href|src)\s*=\s*(["\'])\s*javascript:', text, re.I): problems.append(f'{p}: javascript URL remains')
              if 'csp-dynamic.css?v=1' not in text: problems.append(f'{p}: global CSP compatibility CSS missing')
          for p in sorted(Path('.').glob('*.js')):
              text = p.read_text(encoding='utf-8')
              if raw_style_attr_re.search(text): problems.append(f'{p}: generated style attribute remains')
              if event_attr_re.search(text): problems.append(f'{p}: generated event-handler attribute remains')
              if re.search(r'\.style\.cssText\s*=', text): problems.append(f'{p}: style.cssText assignment remains')
              if re.search(r'(?:setAttribute|setAttributeNS)\s*\(\s*["\']style["\']', text, re.I): problems.append(f'{p}: direct style attribute mutation remains')
          if problems:
              raise SystemExit('\n'.join(problems))

          config_path = Path('vercel.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          strict_csp = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net https://checkout.razorpay.com; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://gmdevprqtvoshbbytsxf.supabase.co wss://gmdevprqtvoshbbytsxf.supabase.co https://*.razorpay.com; frame-src https://*.razorpay.com; upgrade-insecure-requests"
          found = 0
          for rule in config.get('headers', []):
              if rule.get('source') == '/(.*)':
                  for header in rule.get('headers', []):
                      if header.get('key','').lower() == 'content-security-policy':
                          header['value'] = strict_csp
                          found += 1
          if found != 1:
              raise SystemExit(f'Expected one global CSP header, found {found}')
          config_path.write_text(json.dumps(config, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          print(f'Externalized {created_js} inline scripts and {created_css} inline style blocks.')
          print(f'Migrated {len(dynamic_rules)} static/dynamic presentation rules to csp-dynamic.css.')
          print('Strict CSP source inventory passed.')
          PY
          git diff --check
      - name: Commit strict CSP refactor
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No CSP refactor changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' '*.js' 'csp-*.css' vercel.json
          git commit -m 'Externalize inline assets for strict CSP'
          git push origin HEAD:security/full-audit-hardening
