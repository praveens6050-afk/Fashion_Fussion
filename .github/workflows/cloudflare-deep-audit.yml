name: Cloudflare Seller Deep Audit

on:
  push:
    branches: [cloudflare-seller]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify isolated Cloudflare branch
        run: |
          set -euo pipefail
          test -d seller-panel
          test -d .github
          test ! -e customer-panel
          test ! -e admin-panel
          test ! -e api
          test ! -e backend
          test ! -e scripts
          legacy='ver''cel'
          if find . -path './.git' -prune -o -path './seller-panel/node_modules' -prune -o -iname "*${legacy}*" -print | grep -q .; then
            echo 'Legacy hosting artifact found.' >&2
            exit 1
          fi
          if grep -RIni --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "$legacy" seller-panel .github; then
            echo 'Legacy hosting reference found.' >&2
            exit 1
          fi

      - name: Syntax-audit Seller sources
        working-directory: seller-panel
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' -not -path './dist/*' -not -path './node_modules/*' -print0)
          node --check cloudflare-build.mjs

      - name: Build Seller static package and Pages Functions
        working-directory: seller-panel
        run: |
          set -euo pipefail
          npm run build
          test -s functions/api/payout-profile.js
          npx --yes wrangler@latest pages functions build --compatibility-date=2026-09-24 --outdir=.cf-functions-deep-audit
          test -s .cf-functions-deep-audit/index.js

      - name: Verify Seller security and routing
        working-directory: seller-panel
        run: |
          set -euo pipefail
          legacy='ver''cel'
          test -s dist/index.html
          test -s dist/login.html
          grep -Fq 'X-Content-Type-Options: nosniff' dist/_headers
          grep -Fq 'X-Frame-Options: DENY' dist/_headers
          grep -Fq 'Strict-Transport-Security:' dist/_headers
          grep -Fq 'Content-Security-Policy:' dist/_headers
          grep -Fq "frame-ancestors 'none'" dist/_headers
          test ! -e "dist/${legacy}.json"

      - name: Verify immutable release metadata
        working-directory: seller-panel
        run: |
          set -euo pipefail
          test -s dist/release.json
          node - <<'NODE'
          const fs=require('fs');
          const release=JSON.parse(fs.readFileSync('dist/release.json','utf8'));
          if(release.git_sha!==process.env.GITHUB_SHA) throw new Error(`release git_sha mismatch: ${release.git_sha} != ${process.env.GITHUB_SHA}`);
          if(release.branch!=='cloudflare-seller') throw new Error(`release branch mismatch: ${release.branch}`);
          if(!release.built_at || Number.isNaN(Date.parse(release.built_at))) throw new Error('release built_at invalid');
          console.log('PASS Seller release metadata');
          NODE

      - name: Verify built HTML local assets
        working-directory: seller-panel
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const root=path.resolve('dist');
          const htmlFiles=[];
          const walk=dir=>{for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory())walk(p);else if(e.name.endsWith('.html'))htmlFiles.push(p)}};
          walk(root);
          const missing=[];
          const attr=/(?:src|href)=["'](\/[^"'#?]+)["']/g;
          for(const file of htmlFiles){
            const text=fs.readFileSync(file,'utf8');
            for(const match of text.matchAll(attr)){
              const url=match[1];
              if(!/\.(?:js|css|svg|png|jpg|jpeg|webp|ico|json|xml|txt)$/i.test(url))continue;
              const target=path.join(root,url.replace(/^\//,''));
              if(!fs.existsSync(target))missing.push(`${path.relative(root,file)} -> ${url}`);
            }
          }
          if(missing.length)throw new Error(`Missing local assets:\n${missing.join('\n')}`);
          console.log(`PASS local asset integrity across ${htmlFiles.length} Seller HTML files`);
          NODE

      - name: Verify catalog, image-upload and payout integration
        working-directory: seller-panel
        run: |
          set -euo pipefail
          grep -Fq 'seller-live-integration.js' index.html
          grep -Fq 'product-image-upload.js' navigation-fix.js
          grep -Fq "file.type='file'" product-image-upload.js
          grep -Fq 'submit_seller_product' seller-live-integration.js
          grep -Fq 'register_seller_profile' seller-live-integration.js auth.js
          grep -Fq 'seller-payout-provider.js' supabase-config.js
          grep -Fq '/api/payout-profile' seller-payout-provider.js
          grep -Fq "operation:'create_fund_account'" functions/api/payout-profile.js
          grep -Fq 'provider_fund_account_ref' functions/api/payout-profile.js

      - name: Reject committed privileged secrets
        working-directory: seller-panel
        run: node ../.github/scan-privileged-secrets.mjs .
