name: Temporary Final Hardening Inventory
on:
  push:
    branches: [hardening/final-csp-runtime-cleanup]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Inventory runtime style mutations and url.parse usage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots=[p for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts]
          style_assign=re.compile(r'\.style\.([A-Za-z0-9_-]+)\s*=')
          style_call=re.compile(r'\.style\.(setProperty|removeProperty)\s*\(')
          set_style=re.compile(r"setAttribute(?:NS)?\s*\(\s*['\"]style['\"]")
          url_parse=re.compile(r'\burl\.parse\s*\(')
          require_url=re.compile(r"require\s*\(\s*['\"](?:node:)?url['\"]\s*\)")
          import_url=re.compile(r"from\s+['\"]node:url['\"]")
          print('=== STYLE MUTATIONS ===')
          count=0
          for p in sorted(x for x in roots if x.suffix=='.js'):
              text=p.read_text(encoding='utf-8',errors='ignore')
              for i,line in enumerate(text.splitlines(),1):
                  if style_assign.search(line) or style_call.search(line) or set_style.search(line):
                      count+=1; print(f'{p}:{i}:{line[:1200]}')
          print(f'STYLE_MUTATION_LINES={count}')
          print('=== URL PARSE / URL MODULE ===')
          count=0
          for p in sorted(x for x in roots if x.suffix in {'.js','.json','.mjs','.cjs'}):
              text=p.read_text(encoding='utf-8',errors='ignore')
              for i,line in enumerate(text.splitlines(),1):
                  if url_parse.search(line) or require_url.search(line) or import_url.search(line):
                      count+=1; print(f'{p}:{i}:{line[:1200]}')
          print(f'URL_USAGE_LINES={count}')
          print('=== DONE ===')
          PY
