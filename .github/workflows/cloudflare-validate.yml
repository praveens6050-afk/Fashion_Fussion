name: Cloudflare Admin Validate

on:
  push:
    branches: [cloudflare-admin]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build static assets
        run: npm run build
      - name: Validate Pages Functions bundle
        run: npx --yes wrangler@latest pages functions build --compatibility-date=2026-09-22 --compatibility-flag=nodejs_compat --outdir=.cf-functions-test
      - name: Verify deployment artifacts
        run: |
          for f in login.html admin.html admin-account.html reset-password.html admin-product-image-upload.js admin-orders.js admin-shipping.js admin-seller-approvals.js admin-checkout-health.js _headers _redirects _routes.json favicon.svg apple-touch-icon.png admin.webmanifest admin-login.js; do test -s "dist/$f"; done
          test -s dist/vendor/supabase.js
          test -s functions/api/admin-login-guard.js
          test -s .cf-functions-test/index.js
          LOGIN_ASSET="$(grep -oE 'src="/assets/admin-login\.[0-9a-f]{16}\.js"' dist/login.html | head -1 | cut -d'"' -f2)"
          test -n "$LOGIN_ASSET"
          test -s "dist$LOGIN_ASSET"
          cmp -s dist/admin-login.js "dist$LOGIN_ASSET"
      - name: Verify Admin login contract
        run: |
          grep -Eq 'defer src="/assets/admin-login\.[0-9a-f]{16}\.js" integrity="sha384-[A-Za-z0-9+/=]+"' dist/login.html
          ! grep -Fq 'src="/vendor/supabase.js"' dist/login.html
          ! grep -Eq 'cdn\.jsdelivr\.net/.+supabase|unpkg\.com/.+supabase' dist/login.html
          test "$(grep -o '<link rel="stylesheet"' dist/login.html | wc -l)" -eq 0
          grep -Fq 'rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"' dist/login.html
          grep -Fq 'method="post"' dist/login.html
          grep -Fq 'action="/login"' dist/login.html
          ! grep -Fq 'csrf_token' dist/login.html
          ! grep -Fq 'data-csrf-protected' dist/login.html
          grep -Fq 'JavaScript is required to securely sign in to the administrator portal.' dist/login.html
          grep -Fq 'name="email"' dist/login.html
          grep -Fq 'autocomplete="email"' dist/login.html
          ! grep -Fq 'placeholder="admin@example.com"' dist/login.html
          grep -Fq 'name="password"' dist/login.html
          grep -Fq 'id="passwordToggle"' dist/login.html
          grep -Fq 'data-i18n-key="admin.password.visibility" hidden' dist/login.html
          grep -Fq '.password-toggle[hidden]{display:none}' dist/login.html
          grep -Fq 'aria-label="Show administrator password" title="Show administrator password"' dist/login.html
          grep -Fq '<label class="remember"><input id="remember" name="remember" type="checkbox">Remember me</label>' dist/login.html
          ! grep -Fq 'autocomplete="off">Remember me' dist/login.html
          ! grep -Fq 'type="checkbox" checked' dist/login.html
          grep -Fq 'role="status" aria-live="polite" aria-atomic="true"' dist/login.html
          grep -Fq -- '--line:#667085' dist/login.html
          grep -Fq '.password-control:focus-within{border-color:var(--focus);outline:3px solid var(--focus);outline-offset:2px}' dist/login.html
          grep -Fq '.password-control:focus-within .password-toggle{border-left-color:var(--focus)}' dist/login.html
          grep -Fq 'font-weight:700' dist/login.html
          grep -Fq 'font-weight:600' dist/login.html
          ! grep -Eq 'font-weight:(650|750|850)' dist/login.html
          grep -Fq 'class="mobile-brand"' dist/login.html
          grep -Fq '.brand .brand-logo{display:none}' dist/login.html
          grep -Fq '<a class="brand-logo" href="https://fashionfussion.in/" target="_blank" rel="noopener noreferrer"' dist/login.html
          ! grep -Fq '<h2 class="brand-logo"' dist/login.html
          grep -Fq '<h2 id="admin-hero-title" class="brand-title">Secure Admin Center</h2>' dist/login.html
          grep -Fq 'class="external-mark" aria-hidden="true"><svg' dist/login.html
          ! grep -Fq '>↗</span>' dist/login.html
          ! grep -Fq '.form-side{min-height:100dvh' dist/login.html
          ! grep -Fq '100vh' dist/login.html
          grep -Fq '100dvh' dist/login.html
          grep -Fq 'grid-template-areas:"form brand"' dist/login.html
          grep -Fq 'aria-label="Open Fashion Fussion customer website in a new tab"' dist/login.html
          grep -Fq 'media="(max-width:800px)"' dist/login.html
          grep -Fq '#f6f7f9' dist/login.html
          grep -Fq 'no-transform' dist/_headers
          grep -Fq '/assets/*' dist/_headers
          grep -Fq 'PerformanceObserver' dist/admin-login.js
          grep -Fq "const REMEMBER_KEY='ff_admin_remember'" dist/admin-login.js
          grep -Fq 'remember.checked=false' dist/admin-login.js
          grep -Fq 'passwordToggle.hidden=false' dist/admin-login.js
          grep -Fq 'loadSupabaseSdk' dist/admin-login.js
          grep -Fq "script.src='/vendor/supabase.js'" dist/admin-login.js
          grep -Fq "script.addEventListener('error',onError" dist/admin-login.js
          grep -Fq "setAttribute('aria-pressed',String(reveal))" dist/admin-login.js
          grep -Fq "const label=reveal?'Hide administrator password':'Show administrator password';" dist/admin-login.js
          grep -Fq "setAttribute('aria-label',label)" dist/admin-login.js
          grep -Fq "setAttribute('title',label)" dist/admin-login.js
          grep -Fq "banner.setAttribute('role',isError?'alert':'status')" dist/admin-login.js
          grep -Fq "banner.setAttribute('aria-live',isError?'assertive':'polite')" dist/admin-login.js
          grep -Fq "fetch('/api/admin-login-guard'" dist/admin-login.js
          grep -Fq 'checkLoginRateLimit(mail)' dist/admin-login.js
          ! grep -Fq 'CSRF_KEY' dist/admin-login.js
          ! grep -Fq 'hasValidCsrfToken' dist/admin-login.js
          node --check dist/admin-login.js
          node --check dist/supabase-config.js
      - name: Verify login guard
        run: |
          grep -Fq "SUPABASE_SERVICE_ROLE_KEY" functions/api/admin-login-guard.js
          grep -Fq "CF-Connecting-IP" functions/api/admin-login-guard.js
          grep -Fq "consume_admin_login_rate_limit" functions/api/admin-login-guard.js
          grep -Fq "p_limit:8" functions/api/admin-login-guard.js
          grep -Fq "p_window_seconds:600" functions/api/admin-login-guard.js
          grep -Fq "request.headers.get('Origin')" functions/api/admin-login-guard.js
          grep -Fq "request.headers.get('Sec-Fetch-Site')" functions/api/admin-login-guard.js
          grep -Fq "fetchSite!=='same-origin'" functions/api/admin-login-guard.js
          grep -Fq "status===429" admin-login.js
          node --check functions/api/admin-login-guard.js
      - name: Verify heading and visual order
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('dist/login.html','utf8');
          const h1=html.indexOf('<h1 id="admin-sign-in-title">');
          const heroH2=html.indexOf('<h2 id="admin-hero-title"');
          if(h1<0||heroH2<0||h1>heroH2) throw new Error('Admin login heading order is invalid');
          if(html.includes('<h2 class="brand-logo"')) throw new Error('Decorative brand logo must not pollute heading hierarchy');
          if(!html.includes('grid-template-areas:"form brand"')) throw new Error('Desktop visual order must match DOM order');
          NODE
      - name: Verify Cloudflare clean URL safety
        run: |
          grep -Fxq '/ /login 302' dist/_redirects
          if grep -Eq '^/(login|admin|account|admin-account|reset-password)[[:space:]]+[^[:space:]]+\.html[[:space:]]+200$' dist/_redirects; then exit 1; fi
          grep -Fq "const isAdminPage=page==='admin'||page==='admin.html';" supabase-config.js
          grep -Fq "page!=='admin'&&page!=='admin.html'" desktop-admin-loader.js
          grep -Fq "location.replace('/admin')" admin-login.js
          grep -Fq "new URL('/reset-password',location.origin)" admin-login.js
          grep -Fq '/admin-account' admin.html
          grep -Fq 'Cache-Control: no-store, max-age=0' dist/_headers
      - name: Verify Admin feature wiring
        run: |
          grep -Fq "admin-product-image-upload.js" desktop-admin-loader.js
          grep -Fq "admin-payment-review.js" desktop-admin-loader.js
          grep -Fq "admin-recovery-status.js" desktop-admin-loader.js
          for f in admin-orders.js admin-shipping.js admin-seller-approvals.js admin-checkout-health.js admin-returns.js admin-promotions.js admin-inventory.js admin-business-quotes.js; do grep -Fq "$f" supabase-config.js; done
          grep -Fq "window.ffAdminSupabaseReady" admin-product-image-upload.js
          grep -Fq "save.disabled=Boolean(busy)" admin-product-image-upload.js
      - name: Verify API routing boundary
        run: |
          grep -Fq '"/api/*"' dist/_routes.json
          ! grep -Fq '"/*"' dist/_routes.json
