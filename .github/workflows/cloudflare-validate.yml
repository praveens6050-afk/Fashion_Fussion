name: Cloudflare Admin Validate

on:
  push:
    branches: [cloudflare-admin]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build static assets
        run: npm run build
      - name: Validate Pages Functions bundle
        run: npx --yes wrangler@latest pages functions build --compatibility-date=2026-09-22 --compatibility-flag=nodejs_compat --outdir=.cf-functions-test
      - name: Verify deployment artifacts
        run: |
          for f in login.html admin.html admin-account.html reset-password.html admin-product-image-upload.js admin-orders.js admin-shipping.js admin-seller-approvals.js admin-seller-finance.js admin-checkout-health.js _headers _redirects _routes.json favicon.svg apple-touch-icon.png admin.webmanifest admin-login.js; do test -s "dist/$f"; done
          test -s dist/vendor/supabase.js
          test -s functions/_middleware.js
          test -s functions/api/admin-login-guard.js
          test -s .cf-functions-test/index.js
          LOGIN_ASSET="$(grep -oE 'src="/assets/admin-login\.[0-9a-f]{16}\.js"' dist/login.html | head -1 | cut -d'"' -f2)"
          SUPABASE_ASSET="$(grep -oE 'src="/assets/supabase\.[0-9a-f]{16}\.js"' dist/login.html | head -1 | cut -d'"' -f2)"
          test -n "$LOGIN_ASSET"
          test -n "$SUPABASE_ASSET"
          test -s "dist$LOGIN_ASSET"
          test -s "dist$SUPABASE_ASSET"
          cmp -s dist/admin-login.js "dist$LOGIN_ASSET"
          cmp -s dist/vendor/supabase.js "dist$SUPABASE_ASSET"
      - name: Verify Admin login contract
        run: |
          grep -Fq 'http-equiv="Content-Security-Policy"' dist/login.html
          ! grep -Eq 'http-equiv="Content-Security-Policy"[^>]*frame-ancestors' dist/login.html
          grep -Fq 'https://static.cloudflareinsights.com' dist/login.html
          grep -Eq 'defer src="/assets/supabase\.[0-9a-f]{16}\.js" data-supabase-sdk="local" integrity="sha384-[A-Za-z0-9+/=]+" crossorigin="anonymous"' dist/login.html
          grep -Eq 'defer src="/assets/admin-login\.[0-9a-f]{16}\.js" integrity="sha384-[A-Za-z0-9+/=]+" crossorigin="anonymous"' dist/login.html
          ! grep -Fq 'src="/vendor/supabase.js"' dist/login.html
          ! grep -Eq 'cdn\.jsdelivr\.net/.+supabase|unpkg\.com/.+supabase' dist/login.html
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('dist/login.html','utf8');
          const sdk=html.search(/src="\/assets\/supabase\.[0-9a-f]{16}\.js"/);
          const app=html.search(/src="\/assets\/admin-login\.[0-9a-f]{16}\.js"/);
          if(sdk<0||app<0||sdk>app) throw new Error('Deferred authentication scripts are not ordered');
          NODE
          test "$(grep -o '<link rel="stylesheet"' dist/login.html | wc -l)" -eq 0
          grep -Fq 'rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"' dist/login.html
          grep -Fq 'rel="preconnect" href="https://gmdevprqtvoshbbytsxf.supabase.co" crossorigin' dist/login.html
          grep -Fq '<form id="form" autocomplete="on" aria-labelledby="admin-sign-in-title"' dist/login.html
          ! grep -Eq '<form[^>]+method=' dist/login.html
          ! grep -Eq '<form[^>]+action=' dist/login.html
          grep -Fq 'JavaScript is required to securely sign in to the administrator portal.' dist/login.html
          grep -Fq 'name="email"' dist/login.html
          grep -Fq 'autocomplete="email"' dist/login.html
          grep -Fq 'placeholder="name@company.com"' dist/login.html
          grep -Fq 'aria-describedby="emailHint" autofocus required' dist/login.html
          grep -Fq 'using standard email format.' dist/login.html
          grep -Fq 'name="password"' dist/login.html
          grep -Fq 'id="passwordToggle"' dist/login.html
          grep -Fq 'aria-labelledby="passwordToggleText"' dist/login.html
          grep -Fq '<span id="passwordToggleText" class="sr-only">Show administrator password</span>' dist/login.html
          ! grep -Fq 'aria-label="Show administrator password"' dist/login.html
          ! grep -Fq 'title="Show administrator password"' dist/login.html
          ! grep -Fq 'Remember me' dist/login.html
          grep -Fq 'role="alert" aria-live="assertive" aria-atomic="true"' dist/login.html
          grep -Fq 'For your security, this admin session stays in this browser tab.' dist/login.html
          grep -Fq -- '--line:#667085' dist/login.html
          grep -Fq '.password-control:focus-within{border-color:var(--focus);outline:3px solid var(--focus);outline-offset:2px}' dist/login.html
          grep -Fq '.password-control:has(.password-toggle:focus-visible){outline:0;border-color:var(--line)}' dist/login.html
          grep -Fq '.password-toggle:focus-visible{outline:3px solid var(--focus);outline-offset:2px' dist/login.html
          grep -Fq 'align-content:start' dist/login.html
          grep -Fq '@media(max-width:800px)' dist/login.html
          grep -Fq '.brand{display:none}' dist/login.html
          grep -Fq 'class="mobile-brand"' dist/login.html
          grep -Fq '<div class="brand-logo"' dist/login.html
          ! grep -Fq '<a class="brand-logo"' dist/login.html
          test "$(grep -o 'class="external-mark"' dist/login.html | wc -l)" -eq 1
          grep -Fq '<h2 id="admin-hero-title" class="brand-title">Secure Admin Center</h2>' dist/login.html
          grep -Fq 'grid-template-areas:"form brand"' dist/login.html
          grep -Fq '<meta name="theme-color" content="#0b1220">' dist/login.html
          grep -Fq '<meta name="theme-color" content="#f6f7f9" media="(max-width:800px)">' dist/login.html
          grep -Fq '<button id="submit" class="btn" type="submit">Sign in to Admin</button>' dist/login.html
          grep -Fq "frame-ancestors 'none'" dist/_headers
          grep -Fq 'X-Frame-Options: DENY' dist/_headers
          grep -Fq 'https://static.cloudflareinsights.com' dist/_headers
          grep -Fq '/assets/*' dist/_headers
          grep -Fq 'PerformanceObserver' dist/admin-login.js
          grep -Fq "storage:sessionStorage" dist/admin-login.js
          grep -Fq "storageKey:'ff_admin_auth'" dist/admin-login.js
          ! grep -Fq 'localStorage' dist/admin-login.js
          ! grep -Fq 'REMEMBER_KEY' dist/admin-login.js
          ! grep -Fq 'loadSupabaseSdk' dist/admin-login.js
          grep -Fq 'if(clientPromise)return clientPromise' dist/admin-login.js
          grep -Fq 'if(!window.supabase' dist/admin-login.js
          grep -Fq "setAttribute('aria-pressed',String(reveal))" dist/admin-login.js
          grep -Fq "passwordToggleText.textContent=reveal?'Hide administrator password':'Show administrator password'" dist/admin-login.js
          ! grep -Fq "setAttribute('aria-label'" dist/admin-login.js
          ! grep -Fq "setAttribute('title'" dist/admin-login.js
          grep -Fq 'setPasswordToggleState(false);' dist/admin-login.js
          grep -Fq 'passwordToggle.hidden=false' dist/admin-login.js
          grep -Fq "form?.addEventListener('submit'" dist/admin-login.js
          ! grep -Fq "submit?.addEventListener('click'" dist/admin-login.js
          ! grep -Fq "field?.addEventListener('keydown'" dist/admin-login.js
          grep -Fq "banner.setAttribute('role',isError?'alert':'status')" dist/admin-login.js
          grep -Fq "banner.setAttribute('aria-live',isError?'assertive':'polite')" dist/admin-login.js
          grep -Fq "fetch('/api/admin-login-guard'" dist/admin-login.js
          grep -Fq 'checkLoginRateLimit(mail)' dist/admin-login.js
          node --check dist/admin-login.js
          node --check dist/supabase-config.js
      - name: Verify login guard and static security headers
        run: |
          grep -Fq "SUPABASE_SERVICE_ROLE_KEY" functions/api/admin-login-guard.js
          grep -Fq "CF-Connecting-IP" functions/api/admin-login-guard.js
          grep -Fq "consume_admin_login_rate_limit" functions/api/admin-login-guard.js
          grep -Fq "p_limit:8" functions/api/admin-login-guard.js
          grep -Fq "p_window_seconds:600" functions/api/admin-login-guard.js
          grep -Fq "request.headers.get('Origin')" functions/api/admin-login-guard.js
          grep -Fq "request.headers.get('Sec-Fetch-Site')" functions/api/admin-login-guard.js
          grep -Fq "fetchSite!=='same-origin'" functions/api/admin-login-guard.js
          grep -Fq "frame-ancestors 'none'" dist/_headers
          grep -Fq 'X-Frame-Options: DENY' dist/_headers
          grep -Fq 'https://static.cloudflareinsights.com' dist/_headers
          node --check functions/api/admin-login-guard.js
          node --check functions/_middleware.js
      - name: Verify heading and visual order
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('dist/login.html','utf8');
          const h1=html.indexOf('<h1 id="admin-sign-in-title">');
          const heroH2=html.indexOf('<h2 id="admin-hero-title"');
          if(h1<0||heroH2<0||h1>heroH2) throw new Error('Admin login heading order is invalid');
          if(html.includes('<h2 class="brand-logo"')) throw new Error('Decorative brand logo must not pollute heading hierarchy');
          if(!html.includes('grid-template-areas:"form brand"')) throw new Error('Desktop visual order must match DOM order');
          NODE
      - name: Verify Cloudflare clean URL safety
        run: |
          grep -Fxq '/ /login 302' dist/_redirects
          if grep -Eq '^/(login|admin|account|admin-account|reset-password)[[:space:]]+[^[:space:]]+\.html[[:space:]]+200$' dist/_redirects; then exit 1; fi
          grep -Fq "const isAdminPage=page==='admin'||page==='admin.html';" supabase-config.js
          grep -Fq "page!=='admin'&&page!=='admin.html'" desktop-admin-loader.js
          grep -Fq "location.replace('/admin')" admin-login.js
          grep -Fq "new URL('/reset-password',location.origin)" admin-login.js
          grep -Fq '/admin-account' admin.html
          grep -Fq 'Cache-Control: no-store, max-age=0' dist/_headers
      - name: Verify Admin feature wiring
        run: |
          grep -Fq "admin-product-image-upload.js" desktop-admin-loader.js
          grep -Fq "admin-payment-review.js" desktop-admin-loader.js
          grep -Fq "admin-recovery-status.js" desktop-admin-loader.js
          for f in admin-orders.js admin-shipping.js admin-seller-approvals.js admin-seller-finance.js admin-checkout-health.js admin-returns.js admin-promotions.js admin-inventory.js admin-business-quotes.js; do grep -Fq "$f" supabase-config.js; done
          grep -Fq "admin_list_seller_finance_reviews" admin-seller-finance.js
          grep -Fq "admin_review_seller_finance" admin-seller-finance.js
          grep -Fq "admin_upsert_seller_settlement" admin-seller-finance.js
          node --check admin-seller-finance.js
          grep -Fq "window.ffAdminSupabaseReady" admin-product-image-upload.js
          grep -Fq "save.disabled=Boolean(busy)" admin-product-image-upload.js
      - name: Verify API routing boundary
        run: |
          grep -Fq '"/api/*"' dist/_routes.json
          ! grep -Fq '"/login"' dist/_routes.json
          ! grep -Fq '"/login.html"' dist/_routes.json
          ! grep -Fq '"/"' dist/_routes.json
          ! grep -Fq '"/*"' dist/_routes.json
