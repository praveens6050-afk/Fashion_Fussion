name: Cloudflare Admin Validate

on:
  push:
    branches: [cloudflare-admin]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build static assets
        run: npm run build
      - name: Validate Pages Functions bundle
        run: npx --yes wrangler@latest pages functions build --compatibility-date=2026-09-22 --compatibility-flag=nodejs_compat --outdir=.cf-functions-test
      - name: Verify deployment artifacts
        run: |
          for f in login.html admin.html admin-account.html reset-password.html admin-product-image-upload.js admin-orders.js admin-shipping.js admin-seller-approvals.js admin-checkout-health.js _headers _redirects _routes.json favicon.svg apple-touch-icon.png admin.webmanifest admin-login.20260923e.js; do test -s "dist/$f"; done
          test -s dist/vendor/supabase.js
          test -s .cf-functions-test/index.js
      - name: Verify Admin login contract
        run: |
          grep -Fq 'data-supabase-sdk="local"' dist/login.html
          grep -Fq 'defer src="/vendor/supabase.js"' dist/login.html
          grep -Fq 'defer src="/admin-login.20260923e.js"' dist/login.html
          ! grep -Fq 'rel="preload" href="/vendor/supabase.js" as="script"' dist/login.html
          ! grep -Fq 'rel="preload" href="/admin-login.20260923e.js" as="script"' dist/login.html
          ! grep -Eq 'cdn\.jsdelivr\.net/.+supabase|unpkg\.com/.+supabase' dist/login.html
          test "$(grep -o '<link rel="stylesheet"' dist/login.html | wc -l)" -eq 0
          grep -Fq 'rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"' dist/login.html
          grep -Fq 'method="post"' dist/login.html
          grep -Fq 'action="/login"' dist/login.html
          grep -Fq 'data-csrf-protected="session-bound"' dist/login.html
          grep -Fq 'name="email"' dist/login.html
          grep -Fq 'autocomplete="email"' dist/login.html
          grep -Fq 'autofocus required' dist/login.html
          grep -Fq 'name="password"' dist/login.html
          grep -Fq 'id="passwordToggle"' dist/login.html
          grep -Fq 'aria-label="Show administrator password"' dist/login.html
          grep -Fq 'id="remember" name="remember" type="checkbox">Remember me' dist/login.html
          ! grep -Fq 'id="remember" name="remember" type="checkbox" checked' dist/login.html
          grep -Fq 'class="mobile-brand"' dist/login.html
          grep -Fq '.mobile-brand{display:block}' dist/login.html
          ! grep -Fq '.form-side{min-height:100dvh' dist/login.html
          ! grep -Fq '100vh' dist/login.html
          grep -Fq '100dvh' dist/login.html
          grep -Fq 'grid-template-areas:"form brand"' dist/login.html
          grep -Fq 'aria-label="Open Fashion Fussion customer website in a new tab"' dist/login.html
          grep -Fq 'class="external-mark" aria-hidden="true">↗</span>' dist/login.html
          grep -Fq 'no-transform' dist/_headers
          grep -Fq 'PerformanceObserver' dist/admin-login.20260923e.js
          grep -Fq "const CSRF_KEY='ff_admin_csrf_v1'" dist/admin-login.20260923e.js
          grep -Fq 'crypto.getRandomValues' dist/admin-login.20260923e.js
          grep -Fq 'hasValidCsrfToken' dist/admin-login.20260923e.js
          grep -Fq "const REMEMBER_KEY='ff_admin_remember'" dist/admin-login.20260923e.js
          grep -Fq "localStorage.getItem(REMEMBER_KEY)==='true'" dist/admin-login.20260923e.js
          grep -Fq 'remember.checked=false' dist/admin-login.20260923e.js
          ! grep -Fq 'setRememberMode(false)' dist/admin-login.20260923e.js
          grep -Fq 'storage:authStorage' dist/admin-login.20260923e.js
          grep -Fq "setAttribute('aria-pressed',String(reveal))" dist/admin-login.20260923e.js
          grep -Fq "setAttribute('aria-label',reveal?'Hide administrator password':'Show administrator password')" dist/admin-login.20260923e.js
          grep -Fq "setAttribute('title',reveal?'Hide password':'Show password')" dist/admin-login.20260923e.js
          grep -Fq 'setPasswordToggleState(false)' dist/admin-login.20260923e.js
          grep -Fq "localStorage.getItem(REMEMBER_KEY)==='true'" dist/supabase-config.js
          grep -Fq 'storage:authStorage' dist/supabase-config.js
          node --check dist/admin-login.20260923e.js
          node --check dist/supabase-config.js
      - name: Verify heading and visual order
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('dist/login.html','utf8');
          const h1=html.indexOf('<h1 id="admin-sign-in-title">');
          const h2=html.indexOf('<h2 id="admin-hero-title"');
          if(h1<0||h2<0||h1>h2) throw new Error('H1 must precede H2');
          if(!html.includes('grid-template-areas:"form brand"')) throw new Error('Desktop visual order must match DOM order');
          NODE
      - name: Verify Cloudflare clean URL safety
        run: |
          grep -Fxq '/ /login 302' dist/_redirects
          if grep -Eq '^/(login|admin|account|admin-account|reset-password)[[:space:]]+[^[:space:]]+\.html[[:space:]]+200$' dist/_redirects; then exit 1; fi
          grep -Fq "const isAdminPage=page==='admin'||page==='admin.html';" supabase-config.js
          grep -Fq "page!=='admin'&&page!=='admin.html'" desktop-admin-loader.js
          grep -Fq "location.replace('/admin')" admin-login.20260923e.js
          grep -Fq "new URL('/reset-password',location.origin)" admin-login.20260923e.js
          grep -Fq '/admin-account' admin.html
          grep -Fq 'Cache-Control: no-store, max-age=0' dist/_headers
      - name: Verify Admin feature wiring
        run: |
          grep -Fq "admin-product-image-upload.js" desktop-admin-loader.js
          grep -Fq "admin-payment-review.js" desktop-admin-loader.js
          grep -Fq "admin-recovery-status.js" desktop-admin-loader.js
          for f in admin-orders.js admin-shipping.js admin-seller-approvals.js admin-checkout-health.js admin-returns.js admin-promotions.js admin-inventory.js admin-business-quotes.js; do grep -Fq "$f" supabase-config.js; done
          grep -Fq "window.ffAdminSupabaseReady" admin-product-image-upload.js
          grep -Fq "save.disabled=Boolean(busy)" admin-product-image-upload.js
      - name: Verify API routing boundary
        run: |
          grep -Fq '"/api/*"' dist/_routes.json
          ! grep -Fq '"/*"' dist/_routes.json
