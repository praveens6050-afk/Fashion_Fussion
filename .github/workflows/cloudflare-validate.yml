name: Cloudflare Admin Validate

on:
  push:
    branches: [cloudflare-admin]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build static assets
        run: npm run build
      - name: Validate Pages Functions bundle
        run: npx --yes wrangler@latest pages functions build --compatibility-date=2026-09-22 --compatibility-flag=nodejs_compat --outdir=.cf-functions-test
      - name: Verify deployment artifacts
        run: |
          test -f dist/login.html
          test -f dist/admin.html
          test -f dist/admin-account.html
          test -f dist/reset-password.html
          test -f dist/admin-product-image-upload.js
          test -f dist/admin-orders.js
          test -f dist/admin-shipping.js
          test -f dist/admin-seller-approvals.js
          test -f dist/admin-checkout-health.js
          test -f dist/_headers
          test -f dist/_redirects
          test -f dist/_routes.json
          test -s dist/vendor/supabase.js
          test -s dist/admin-login.20260923d.js
          test -s dist/favicon.svg
          test -s dist/admin.webmanifest
          test -s .cf-functions-test/index.js
      - name: Verify Admin login performance and accessibility contract
        run: |
          grep -Fq 'data-supabase-sdk="local"' dist/login.html
          grep -Fq 'defer src="/vendor/supabase.js"' dist/login.html
          grep -Fq 'defer src="/admin-login.20260923d.js"' dist/login.html
          grep -Fq 'rel="preload" href="/vendor/supabase.js" as="script"' dist/login.html
          grep -Fq 'rel="preload" href="/admin-login.20260923d.js" as="script"' dist/login.html
          ! grep -Eq 'cdn\.jsdelivr\.net/.+supabase|unpkg\.com/.+supabase' dist/login.html
          test "$(grep -o '<link rel="stylesheet"' dist/login.html | wc -l)" -eq 0
          grep -Fq 'font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif' dist/login.html
          ! grep -Fq 'font-family:Inter' dist/login.html
          grep -Fq 'method="post"' dist/login.html
          grep -Fq 'action="/login"' dist/login.html
          grep -Fq 'name="email"' dist/login.html
          grep -Fq 'autocomplete="email"' dist/login.html
          grep -Fq 'placeholder="admin@example.com"' dist/login.html
          grep -Fq 'aria-describedby="emailHint"' dist/login.html
          grep -Fq 'name="password"' dist/login.html
          grep -Fq 'id="passwordToggle"' dist/login.html
          grep -Fq 'aria-label="Show administrator password"' dist/login.html
          grep -Fq 'data-i18n-key="admin.password.visibility"' dist/login.html
          grep -Fq '<svg aria-hidden="true"' dist/login.html
          ! grep -Fq '>Show</button>' dist/login.html
          grep -Fq 'aria-describedby="passwordHint"' dist/login.html
          grep -Fq 'href="/reset-password"' dist/login.html
          grep -Fq 'min-height:44px' dist/login.html
          grep -Fq 'class="password-control"' dist/login.html
          grep -Fq '.banner{display:none' dist/login.html
          ! grep -Fq '.banner{position:fixed' dist/login.html
          grep -Fq '<form id="form" method="post" action="/login" autocomplete="on"><div id="banner"' dist/login.html
          grep -Fq '<h1 id="admin-sign-in-title">Admin sign in</h1>' dist/login.html
          grep -Fq '<h2 id="admin-hero-title" class="brand-title">Secure Admin Center</h2>' dist/login.html
          grep -Fq 'aria-label="Administrator sign-in form"' dist/login.html
          ! grep -Fq '<header class="top">' dist/login.html
          ! grep -Fq 'href="/admin" class="logo"' dist/login.html
          grep -Fq 'translate="no" spellcheck="false" data-brand-name="true"' dist/login.html
          ! grep -Fq 'autofocus' dist/login.html
          ! grep -Fq '100vh' dist/login.html
          grep -Fq '100dvh' dist/login.html
          grep -Fq '.field>input:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-color:var(--focus);box-shadow:none}' dist/login.html
          grep -Fq '.password-control:focus-within{outline:3px solid var(--focus);outline-offset:2px;border-color:var(--focus);box-shadow:none}' dist/login.html
          grep -Fq -- '--focus:#1d4ed8' dist/login.html
          grep -Fq '.stamp{width:max-content;padding:8px 13px;border:1px solid #fff;border-radius:999px;background:#fff;color:var(--navy)' dist/login.html
          grep -Fq '.password-toggle:focus-visible' dist/login.html
          grep -Fq '.btn:focus-visible' dist/login.html
          grep -Fq 'aria-label="Open Fashion Fussion customer website in a new tab">fashionfussion.in</a>' dist/login.html
          ! grep -Fq 'fashionfussion.in (opens in new tab)' dist/login.html
          grep -Fq 'rel="icon"' dist/login.html
          grep -Fq 'rel="apple-touch-icon"' dist/login.html
          grep -Fq 'target="_blank"' dist/login.html
          grep -Fq 'no-transform' dist/_headers
          grep -Fq 'admin-login.20260923d.js' dist/_headers
          grep -Fq 'PerformanceObserver' dist/admin-login.20260923d.js
          grep -Fq "setAttribute('aria-label',reveal?'Hide administrator password':'Show administrator password')" dist/admin-login.20260923d.js
          ! grep -Fq "passwordToggle.textContent=reveal" dist/admin-login.20260923d.js
          node --check dist/admin-login.20260923d.js
          node --check dist/supabase-config.js
      - name: Verify heading order
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('dist/login.html','utf8');
          const h1=html.indexOf('<h1 id="admin-sign-in-title">');
          const h2=html.indexOf('<h2 id="admin-hero-title"');
          if(h1<0||h2<0||h1>h2){
            console.error('Admin login heading hierarchy must place H1 before H2 in DOM order');
            process.exit(1);
          }
          NODE
      - name: Verify Cloudflare clean URL safety
        run: |
          grep -Fxq '/ /login 302' dist/_redirects
          if grep -Eq '^/(login|admin|account|admin-account|reset-password)[[:space:]]+[^[:space:]]+\.html[[:space:]]+200$' dist/_redirects; then
            echo 'Unsafe .html clean-route rewrite detected in _redirects'
            exit 1
          fi
          grep -Fq "const isAdminPage=page==='admin'||page==='admin.html';" supabase-config.js
          grep -Fq "page!=='admin'&&page!=='admin.html'" desktop-admin-loader.js
          grep -Fq "'login','login.html'" desktop-auth-loader.js
          grep -Fq "'reset-password','reset-password.html'" desktop-auth-loader.js
          grep -Fq "location.replace('/admin')" admin-login.20260923d.js
          grep -Fq "new URL('/reset-password',location.origin)" admin-login.20260923d.js
          grep -Fq "location.replace('/login')" csp-reset-password.js
          grep -Fq '/admin-account' admin.html
          grep -Fq '/admin' admin-account.html
          grep -Fq '/admin-account' dist/_headers
          grep -Fq 'Cache-Control: no-store, max-age=0' dist/_headers
      - name: Verify Admin feature wiring
        run: |
          grep -Fq "admin-product-image-upload.js" desktop-admin-loader.js
          grep -Fq "admin-payment-review.js" desktop-admin-loader.js
          grep -Fq "admin-recovery-status.js" desktop-admin-loader.js
          grep -Fq "admin-orders.js" supabase-config.js
          grep -Fq "admin-shipping.js" supabase-config.js
          grep -Fq "admin-seller-approvals.js" supabase-config.js
          grep -Fq "admin-checkout-health.js" supabase-config.js
          grep -Fq "window.ffAdminSupabaseReady" admin-product-image-upload.js
          grep -Fq "save.disabled=Boolean(busy)" admin-product-image-upload.js
      - name: Verify API routing boundary
        run: |
          grep -Fq '"/api/*"' dist/_routes.json
          if grep -Fq '"/*"' dist/_routes.json; then
            echo 'Pages Functions must not execute for all static routes'
            exit 1
          fi
