name: Cloudflare Customer Validate

on:
  push:
    branches: [cloudflare-customer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Cloudflare-only branch structure
        run: |
          set -euo pipefail
          test -d customer-panel
          test -d .github
          test -d supabase
          test ! -e admin-panel
          test ! -e seller-panel
          test ! -e api
          test ! -e backend
          test ! -e scripts
          legacy='ver''cel'
          if find . -path './.git' -prune -o -path './customer-panel/node_modules' -prune -o -iname "*${legacy}*" -print | grep -q .; then
            echo 'Legacy hosting artifact found:' >&2
            find . -path './.git' -prune -o -path './customer-panel/node_modules' -prune -o -iname "*${legacy}*" -print >&2
            exit 1
          fi
          if grep -RIni --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "$legacy" customer-panel .github; then
            echo 'Legacy hosting reference found in Cloudflare Customer branch.' >&2
            exit 1
          fi

      - name: Install build dependencies
        working-directory: customer-panel
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate Customer JavaScript and backend sources
        working-directory: customer-panel
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './dist/*' -not -path './functions/*' -print0)
          node backend/test-customer.js

      - name: Validate variant commerce entry points
        working-directory: customer-panel
        run: |
          set -euo pipefail
          grep -Fq 'variant-commerce.js?v=4' product.html
          grep -Fq 'product-variants.js?v=4' product.html
          grep -Fq 'csp-product.js?v=3' product.html
          grep -Fq 'variant-commerce.js?v=4' search.html
          grep -Fq 'catalog-cart-entry.js?v=3' search.html
          grep -Fq 'variant-commerce.js?v=4' wishlist.html
          grep -Fq 'catalog-cart-entry.js?v=3' wishlist.html
          grep -Fq 'variant-commerce.js?v=4' cart.html
          grep -Fq 'variant-cart-ui.js?v=4' cart.html
          grep -Fq 'variant-commerce.js?v=4' checkout.html
          grep -Fq 'variant-cart-ui.js?v=4' checkout.html
          grep -Fq 'has_variants' csp-product.js
          grep -Fq 'addSyncedLine' csp-product.js
          grep -Fq 'selectedBasePrice' csp-product.js
          grep -Fq 'get_variant_availability' product-variants.js
          grep -Fq 'syncActions' product-variants.js
          ! grep -Fq 'captureCartAdd' product-variants.js
          grep -Fq "leaf.includes('.')?leaf:leaf+'.html'" catalog-cart-entry.js
          grep -Fq "leaf.includes('.')?leaf:leaf+'.html'" variant-cart-ui.js
          grep -Fq "leaf.includes('.')?leaf:leaf+'.html'" desktop-checkout-loader.js

      - name: Validate account and post-purchase entry points
        working-directory: customer-panel
        run: |
          set -euo pipefail
          for script in account-refunds.js account-returns.js account-business.js account-repeat-order.js account-cancel-promotion.js account-role-guard.js account-stability.js account-extension-router.js; do grep -Fq "$script?v=1" account.html; done
          grep -Fq 'desktop-account-loader.js?v=1' account.html
          grep -Fq 'csp-order-details.js?v=3' order-details.html
          for script in order-shipping.js order-refund-tracker.js order-return-exchange.js order-cancel-promotion.js order-business-details.js; do grep -Fq "$script?v=1" order-details.html; done
          grep -Fq 'csp-order-confirmation.js?v=3' order-confirmation.html
          grep -Fq 'order-business-details.js?v=1' order-confirmation.html
          grep -Fq 'Fashion Fussion' account.html
          grep -Fq 'Fashion Fussion' order-details.html

      - name: Validate checkout and business entry points
        working-directory: customer-panel
        run: |
          set -euo pipefail
          grep -Fq 'checkout-business.js?v=1' checkout.html
          grep -Fq 'quote-checkout.js?v=2' quote-checkout.html
          grep -Fq 'quote-payment-safety.js?v=1' quote-checkout.html
          grep -Fq "'quote-checkout.html'" csp-login.js
          grep -Fq 'business_invoice' checkout-business.js
          grep -Fq 'purchase_order_no' checkout-business.js
          grep -Fq "target='quote-checkout.html?quote='" quote-checkout.js
          grep -Fq 'Fashion Fussion' quote-checkout.html

      - name: Build static assets
        working-directory: customer-panel
        run: npm run build

      - name: Validate Pages Functions bundle
        working-directory: customer-panel
        run: npx --yes wrangler@latest pages functions build --compatibility-date=2026-09-22 --compatibility-flag=nodejs_compat --outdir=.cf-functions-test

      - name: Verify deployment artifacts
        working-directory: customer-panel
        run: |
          set -euo pipefail
          legacy='ver''cel'
          for f in index.html login.html signup.html cart.html checkout.html product.html search.html wishlist.html account.html order-details.html order-confirmation.html quote-checkout.html _headers _redirects _routes.json canonical-host.js release.json homepage.bundle.css homepage.runtime.js; do test -s "dist/$f"; done
          test -s dist/vendor/supabase.js
          test -s functions/_node-handler-bridge.js
          test -s functions/api/[[path]].js
          test -s .cf-functions-test/index.js
          test ! -e "functions/_${legacy}-adapter.js"
          test ! -e "dist/${legacy}.json"
          grep -q 'variant-commerce.js?v=4' dist/cart.html
          grep -q 'variant-cart-ui.js?v=4' dist/cart.html
          grep -q 'variant-commerce.js?v=4' dist/checkout.html
          grep -q 'variant-cart-ui.js?v=4' dist/checkout.html
          grep -Fq 'checkout-business.js?v=1' dist/checkout.html
          grep -q 'variant-commerce.js?v=4' dist/product.html
          grep -q 'product-variants.js?v=4' dist/product.html
          grep -q 'catalog-cart-entry.js?v=3' dist/search.html
          grep -q 'catalog-cart-entry.js?v=3' dist/wishlist.html
          for script in account-refunds.js account-returns.js account-business.js account-repeat-order.js account-cancel-promotion.js account-role-guard.js account-stability.js account-extension-router.js; do grep -Fq "$script?v=1" dist/account.html; done
          grep -Fq 'csp-order-details.js?v=3' dist/order-details.html
          for script in order-shipping.js order-refund-tracker.js order-return-exchange.js order-cancel-promotion.js order-business-details.js; do grep -Fq "$script?v=1" dist/order-details.html; done
          grep -Fq 'csp-order-confirmation.js?v=3' dist/order-confirmation.html
          grep -Fq 'order-business-details.js?v=1' dist/order-confirmation.html
          grep -Fq 'quote-checkout.js?v=2' dist/quote-checkout.html
          grep -Fq 'quote-payment-safety.js?v=1' dist/quote-checkout.html

      - name: Verify Pages Functions and API boundary
        working-directory: customer-panel
        run: |
          set -euo pipefail
          grep -Fq '"/api/*"' dist/_routes.json
          ! grep -Fq '"/*"' dist/_routes.json
          grep -Fq "runNodeHandler" functions/api/[[path]].js
          grep -Fq "X-Razorpay-Signature" functions/_node-handler-bridge.js
          grep -Fq "'razorpay-webhook'" functions/api/[[path]].js
          grep -Fq "'shipping-status'" functions/api/[[path]].js

      - name: Verify security headers and static caching
        working-directory: customer-panel
        run: |
          set -euo pipefail
          grep -Fq 'X-Content-Type-Options: nosniff' dist/_headers
          grep -Fq 'X-Frame-Options: DENY' dist/_headers
          grep -Fq 'Content-Security-Policy:' dist/_headers
          grep -Fq 'Strict-Transport-Security:' dist/_headers
          grep -Fq 'Cache-Control:' dist/_headers

      - name: Verify homepage performance and accessibility contract
        working-directory: customer-panel
        run: |
          set -euo pipefail
          grep -q 'data-supabase-sdk="local"' dist/index.html
          grep -q 'data-homepage-bundle' dist/index.html
          grep -q 'data-homepage-runtime' dist/index.html
          ! grep -Eq 'cdn\.jsdelivr\.net/.+supabase|unpkg\.com/.+supabase' dist/index.html
          test "$(grep -o '<link rel="stylesheet"' dist/index.html | wc -l)" -eq 1
          test "$(grep -o 'business-registration-trust.js' dist/index.html | wc -l)" -eq 0
          grep -q 'Fashion Fussion</div>' dist/index.html
          grep -q 'heart-glyph' dist/homepage.runtime.js
          grep -q 'sr-only' dist/homepage.runtime.js
          node --check dist/homepage.runtime.js
          node --check dist/supabase-config.js

      - name: Verify local HTML asset integrity
        working-directory: customer-panel
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const root=path.resolve('dist');
          const htmlFiles=[];
          const walk=dir=>{for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory())walk(p);else if(e.name.endsWith('.html'))htmlFiles.push(p)}};
          walk(root);
          const missing=[];
          const attr=/(?:src|href)=["'](\/[^"'#?]+)["']/g;
          for(const file of htmlFiles){
            const text=fs.readFileSync(file,'utf8');
            for(const match of text.matchAll(attr)){
              const url=match[1];
              if(!/\.(?:js|css|svg|png|jpg|jpeg|webp|ico|json|xml|txt)$/i.test(url))continue;
              const target=path.join(root,url.replace(/^\//,''));
              if(!fs.existsSync(target))missing.push(`${path.relative(root,file)} -> ${url}`);
            }
          }
          if(missing.length)throw new Error(`Missing local assets:\n${missing.join('\n')}`);
          console.log(`PASS local asset integrity across ${htmlFiles.length} HTML files`);
          NODE

      - name: Reject committed privileged secrets
        working-directory: customer-panel
        run: node ../.github/scan-privileged-secrets.mjs .
