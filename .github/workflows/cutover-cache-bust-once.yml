name: Cutover cache bust one-shot

on:
  push:
    branches: [production-cutover-cleanup-20260910]
    paths:
      - '.github/workflows/cutover-cache-bust-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-cutover-cleanup-20260910
      - name: Version production config loaders
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('checkout.html'): ('src="supabase-config.js"', 'src="supabase-config.js?v=20260910-cutover1"'),
              Path('admin.html'): ('src="supabase-config.js?v=20260909-admin2"', 'src="supabase-config.js?v=20260910-cutover1"'),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'Expected loader not found in {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- checkout.html admin.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checkout.html admin.html
          git commit -m "Bust production config cache after cutover"
          git push origin HEAD:production-cutover-cleanup-20260910
