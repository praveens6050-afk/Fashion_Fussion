# Supabase CLI project configuration for GitHub previews.
project_id = "fashion-fussion"

[functions.crm-inbound-webhook]
# Provider callbacks authenticate with Meta HMAC or the dedicated email webhook HMAC.
verify_jwt = false

[functions.crm-send-reply]
# The function validates the Supabase session and CRM role before sending.
verify_jwt = true

[functions.crm-zoho-inbox-sync]
  # Only the authenticated CRM administrator may synchronize the connected Zoho inbox.
  verify_jwt = true

[functions.crm-zoho-delivery-sync]
# Only the authenticated CRM administrator may refresh Zoho delivery logs.
verify_jwt = true
